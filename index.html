ers in a cave, taking shadows for the world. But the first pictures on any wall may not have been shadows of things outside. They may have been the seer's own architecture.", "ru": "Платон представил узников в пещере, принимающих тени за мир. Но, может быть, первые изображения на стенах вовсе не были тенями вещей снаружи. Может быть, это была архитектура самого смотрящего.", "plate": {"en": "Plato, Republic, Book VII.", "ru": "Платон, «Государство», книга VII.", "mark": ["s"], "uk": "Платон, «Держава», книга VII.", "es": "Platón, República, libro VII.", "it": "Platone, Repubblica, libro VII.", "pl": "Platon, Państwo, księga VII."}, "say_en": "Playto imagined prisoners in a cave, taking shadows for the world. But the first pictures on any wall may not have been shadows of things outside. They may have been the seer's own architecture.", "uk": "Платон уявляв в’язнів у печері, які сприймали тіні за світ. Але перші зображення на будь-якій стіні могли бути не тінями речей ззовні. Вони могли бути власною архітектурою того, хто бачить.", "es": "Platón imaginó prisioneros en una caverna que tomaban las sombras por el mundo. Pero las primeras imágenes de cualquier pared quizá no fueran sombras de cosas de fuera. Quizá fueran la propia arquitectura de quien ve.", "it": "Platone immaginò prigionieri in una caverna, che prendevano le ombre per il mondo. Ma le prime immagini su qualsiasi parete potrebbero non essere state ombre di cose esterne. Potrebbero essere state l'architettura stessa di chi vede.", "pl": "Platon wyobraził sobie więźniów w jaskini, biorących cienie za świat. Ale pierwsze obrazy na jakiejkolwiek ścianie mogły nie być cieniami rzeczy z zewnątrz. Mogły być własną architekturą widzącego."}, {"en": "A psychologist named these shapes form constants. Twenty-three centuries earlier, Plato called the eternal shapes Forms, and said that all learning is remembering.", "ru": "Психолог назвал эти фигуры константами формы. За двадцать три века до него Платон называл вечные очертания идеями, эйдосами, и говорил, что всякое познание есть припоминание.", "plate": {"en": "Plato, Meno: a boy untaught in geometry finds how to double a square, as if recalling it.", "ru": "Платон, «Менон»: мальчик, не учившийся геометрии, находит, как удвоить квадрат, словно вспоминая.", "mark": ["s"], "uk": "Платон, «Менон»: хлопчик, якого не вчили геометрії, знаходить, як подвоїти квадрат, — ніби пригадує.", "es": "Platón, Menón: un muchacho que nunca estudió geometría descubre cómo duplicar un cuadrado, como si lo recordara.", "it": "Platone, Menone: un ragazzo mai istruito in geometria trova come raddoppiare un quadrato, come se lo ricordasse.", "pl": "Platon, Menon: chłopiec, którego nigdy nie uczono geometrii, odkrywa, jak podwoić kwadrat, jakby to sobie przypominał."}, "say_en": "A psychologist named these shapes form constants. Twenty-three centuries earlier, Playto called the eternal shapes Forms, and said that all learning is remembering.", "uk": "Психолог назвав ці форми константами форми. За двадцять три століття до того Платон назвав вічні форми Ідеями і сказав, що будь-яке пізнання — це пригадування.", "es": "Un psicólogo llamó a estas formas constantes de forma. Veintitrés siglos antes, Platón llamó Formas a las figuras eternas, y dijo que todo aprender es recordar.", "it": "Uno psicologo chiamò queste forme costanti di forma. Ventitré secoli prima, Platone chiamò Forme le figure eterne, e disse che ogni apprendere è ricordare.", "pl": "Pewien psycholog nazwał te kształty stałymi formy. Dwadzieścia trzy stulecia wcześniej Platon nazwał wieczne kształty Ideami i powiedział, że wszelkie uczenie się jest przypominaniem."}, {"en": "A shape every brain draws in the dark: is it news about the world, or about the one who looks?", "ru": "Форма, которую рисует в темноте каждый мозг: весть о мире или о том, кто смотрит?", "plate": {"en": "Explanations come in levels: what a system does, how, and in what matter (Marr, 1982). An equation for a pattern can leave the seeing unexplained.", "ru": "Объяснения бывают разных уровней: что система делает, как и на каком материале (Марр, 1982). Уравнение узора может оставить само видение необъяснённым.", "mark": ["t"], "uk": "Пояснення бувають різних рівнів: що робить система, як і в якій матерії (Марр, 1982). Рівняння візерунка може лишити саме бачення непоясненим.", "es": "Las explicaciones tienen niveles: qué hace un sistema, cómo, y en qué materia (Marr, 1982). Una ecuación de un patrón puede dejar sin explicar el ver.", "it": "Le spiegazioni hanno livelli: che cosa fa un sistema, come, e in quale materia (Marr, 1982). Un'equazione per uno schema può lasciare inspiegato il vedere.", "pl": "Wyjaśnienia mają poziomy: co robi układ, jak i w jakiej materii (Marr, 1982). Równanie wzoru może pozostawić samo widzenie niewyjaśnione."}, "uk": "Форма, яку кожен мозок малює в темряві: це звістка про світ чи про того, хто дивиться?", "es": "Una forma que todo cerebro dibuja en la oscuridad: ¿es una noticia del mundo, o de quien mira?", "it": "Una forma che ogni cervello disegna nel buio: è una notizia sul mondo, o su chi guarda?", "pl": "Kształt, który każdy mózg rysuje w ciemności: czy to wiadomość o świecie, czy o tym, kto patrzy?"}, {"en": "The one who turned around climbed toward the light.", "ru": "Тот, кто обернулся, поднялся к свету.", "uk": "Той, хто обернувся, піднявся до світла.", "es": "Quien se dio la vuelta subió hacia la luz.", "it": "Chi si voltò salì verso la luce.", "pl": "Ten, który się odwrócił, wspiął się ku światłu."}], "M6": [{"en": "Ariadne gave Theseus a thread at the door of the labyrinth. He went in without a map, and came out.", "ru": "Ариадна дала Тесею нить у входа в лабиринт. Он вошёл без карты и вышел.", "plate": {"en": "Greek myth: the thread through Daedalus's labyrinth.", "ru": "Греческий миф: нить сквозь лабиринт Дедала.", "mark": ["s"], "uk": "Грецький міф: нитка крізь лабіринт Дедала.", "es": "Mito griego: el hilo a través del laberinto de Dédalo.", "it": "Mito greco: il filo attraverso il labirinto di Dedalo.", "pl": "Mit grecki: nić przez labirynt Dedala."}, "uk": "Аріадна дала Тесеєві нитку біля входу в лабіринт. Він увійшов без карти — і вийшов.", "es": "Ariadna dio a Teseo un hilo a la entrada del laberinto. Entró sin mapa, y salió.", "it": "Arianna diede a Teseo un filo sulla soglia del labirinto. Entrò senza una mappa, e ne uscì.", "pl": "Ariadna dała Tezeuszowi nić u wejścia do labiryntu. Wszedł bez mapy i wyszedł."}, {"en": "Some knowing works that way: a thread held long before it is understood.", "ru": "Некоторое знание устроено так же: нить, которую держишь задолго до того, как понимаешь.", "plate": {"en": "Testimony shared by many makers and scientists.", "ru": "Свидетельство многих творцов и учёных.", "mark": ["w"], "uk": "Свідчення, яке поділяють багато творців і науковців.", "es": "Testimonio compartido por muchos creadores y científicos.", "it": "Testimonianza condivisa da molti creatori e scienziati.", "pl": "Świadectwo wielu twórców i naukowców."}, "uk": "Деяке знання діє саме так: нитку тримаєш задовго до того, як її розумієш.", "es": "Algún saber funciona así: un hilo que se sostiene mucho antes de comprenderlo.", "it": "Un certo sapere funziona così: un filo tenuto in mano molto prima di essere capito.", "pl": "Pewien rodzaj wiedzy działa właśnie tak: nić trzymana długo, zanim się ją zrozumie."}, {"en": "Push at a problem and the mind narrows. Walk away, and the answer often arrives on its own.", "ru": "Если давить на задачу, ум сужается. Если отойти, ответ часто приходит сам.", "plate": {"en": "A break improves problem-solving: the incubation effect, confirmed across many studies (Sio and Ormerod, 2009).", "ru": "Перерыв улучшает решение задач: эффект инкубации, подтверждённый многими исследованиями (Сио и Ормерод, 2009).", "mark": ["m"], "uk": "Перерва покращує розв’язання задач: ефект інкубації, підтверджений у багатьох дослідженнях (Сіо і Ормерод, 2009).", "es": "Una pausa mejora la resolución de problemas: el efecto de incubación, confirmado en muchos estudios (Sio y Ormerod, 2009).", "it": "Una pausa migliora la soluzione dei problemi: l'effetto di incubazione, confermato da molti studi (Sio e Ormerod, 2009).", "pl": "Przerwa poprawia rozwiązywanie problemów: efekt inkubacji, potwierdzony w wielu badaniach (Sio i Ormerod, 2009)."}, "uk": "Тисніть на задачу — і розум звужується. Відійдіть — і відповідь часто приходить сама.", "es": "Empuja un problema y la mente se estrecha. Aléjate, y la respuesta a menudo llega sola.", "it": "Spingi su un problema e la mente si restringe. Allontanati, e spesso la risposta arriva da sola.", "pl": "Napieraj na problem, a umysł się zwęża. Odejdź, a odpowiedź często przychodzi sama."}, {"en": "Leave the lamp at the door, still lit. Logic is not thrown away. It waits.", "ru": "Оставь лампу у двери горящей. Логику не выбрасывают. Она ждёт.", "uk": "Залиште лампу біля дверей, запаленою. Логіку не викидають. Вона чекає.", "es": "Deja la lámpara en la puerta, aún encendida. La lógica no se tira. Espera.", "it": "Lascia la lampada sulla soglia, ancora accesa. La logica non si butta via. Aspetta.", "pl": "Zostaw lampę przy drzwiach, wciąż zapaloną. Logiki się nie wyrzuca. Ona czeka."}, {"en": "Inside, the walls are not one maze but many, each inside the walls of another. Every system feeds the next.", "ru": "Внутри — не один лабиринт, а много, и каждый в стенах другого. Каждая система питает следующую.", "plate": {"en": "On the predictive model, each level of the brain predicts the level below and learns from its errors.", "ru": "По модели предсказания, каждый уровень мозга предсказывает нижний и учится на его ошибках.", "mark": ["t"], "uk": "За предиктивною моделлю, кожен рівень мозку передбачає рівень під собою і вчиться на своїх помилках.", "es": "Según el modelo predictivo, cada nivel del cerebro predice el nivel inferior y aprende de sus errores.", "it": "Secondo il modello predittivo, ogni livello del cervello predice il livello sottostante e impara dai propri errori.", "pl": "Według modelu predykcyjnego każdy poziom mózgu przewiduje poziom niższy i uczy się na swoich błędach."}, "uk": "Усередині стіни — не один лабіринт, а багато, кожен у стінах іншого. Кожна система живить наступну.", "es": "Dentro, los muros no son un laberinto sino muchos, cada uno dentro de los muros de otro. Cada sistema alimenta al siguiente.", "it": "Dentro, le mura non sono un solo labirinto ma molti, ciascuno dentro le mura di un altro. Ogni sistema alimenta il successivo.", "pl": "W środku ściany to nie jeden labirynt, lecz wiele, każdy w murach innego. Każdy system zasila następny."}, {"en": "At the centre waits whatever was feared. Fear narrows the eye to a point.", "ru": "В центре ждёт то, чего боялись. Страх сужает взгляд до точки.", "plate": {"en": "Threat narrows attention to its source.", "ru": "Угроза сужает внимание до своего источника.", "mark": ["m"], "uk": "Загроза звужує увагу до свого джерела.", "es": "La amenaza estrecha la atención hacia su origen.", "it": "La minaccia restringe l'attenzione sulla sua fonte.", "pl": "Zagrożenie zawęża uwagę do swojego źródła."}, "uk": "У центрі чекає те, чого боялися. Страх звужує око до точки.", "es": "En el centro espera lo que se temía. El miedo estrecha el ojo hasta un punto.", "it": "Al centro aspetta ciò che si temeva. La paura restringe l'occhio a un punto.", "pl": "W środku czeka to, czego się bałeś. Strach zwęża oko do punktu."}, {"en": "Stand still in front of it. Just before an insight, the brain dims its own eyes.", "ru": "Остановись перед ним. Перед самым озарением мозг приглушает собственные глаза.", "plate": {"en": "Alpha waves rise over the visual cortex about 1.5 s before an insight, as if visual input is turned down (Jung-Beeman, Kounios and colleagues, 2004).", "ru": "Альфа-ритм усиливается над зрительной корой примерно за 1,5 с до озарения, словно зрительный вход приглушается (Юнг-Биман, Кауниос и коллеги, 2004).", "mark": ["m"], "uk": "Альфа-хвилі над зоровою корою посилюються приблизно за 1,5 с до осяяння, ніби зоровий вхід притишують (Юнг-Біман, Куніос і колеги, 2004).", "es": "Las ondas alfa aumentan sobre la corteza visual unos 1,5 s antes de una revelación, como si se bajara la entrada visual (Jung-Beeman, Kounios y colaboradores, 2004).", "it": "Le onde alfa aumentano sopra la corteccia visiva circa 1,5 s prima di un'intuizione, come se l'ingresso visivo venisse abbassato (Jung-Beeman, Kounios e colleghi, 2004).", "pl": "Fale alfa nad korą wzrokową narastają około 1,5 s przed olśnieniem, jakby przyciszano wejście wzrokowe (Jung-Beeman, Kounios i współpracownicy, 2004)."}, "uk": "Стійте нерухомо перед ним. Перед самим осяянням мозок пригашує власні очі.", "es": "Quédate quieto frente a ello. Justo antes de una revelación, el cerebro atenúa sus propios ojos.", "it": "Fermati davanti a esso. Poco prima di un'intuizione, il cervello abbassa la luce dei propri occhi.", "pl": "Stań przed tym nieruchomo. Tuż przed olśnieniem mózg przygasza własne oczy."}, {"en": "Then a seam of light opens in the wall, a third of a second before you know.", "ru": "И тогда в стене открывается шов света, за треть секунды до того, как приходит знание.", "plate": {"en": "A burst of gamma waves over the right temporal lobe, about 0.3 s before the answer is reported (same study).", "ru": "Вспышка гамма-ритма над правой височной долей примерно за 0,3 с до ответа (то же исследование).", "mark": ["m"], "uk": "Сплеск гамма-хвиль над правою скроневою часткою, приблизно за 0,3 с до того, як відповідь названо (те саме дослідження).", "es": "Una ráfaga de ondas gamma sobre el lóbulo temporal derecho, unos 0,3 s antes de que se diga la respuesta (el mismo estudio).", "it": "Un'esplosione di onde gamma sopra il lobo temporale destro, circa 0,3 s prima che la risposta venga detta (stesso studio).", "pl": "Wybuch fal gamma nad prawym płatem skroniowym, około 0,3 s przed podaniem odpowiedzi (to samo badanie)."}, "uk": "Тоді в стіні відкривається шов світла — за третину секунди до того, як ви знаєте.", "es": "Entonces se abre en el muro una costura de luz, un tercio de segundo antes de que lo sepas.", "it": "Poi nel muro si apre una fessura di luce, un terzo di secondo prima che tu sappia.", "pl": "Wtedy w ścianie otwiera się szew światła, jedną trzecią sekundy, zanim wiesz."}, {"en": "Where was the answer, in the second before you knew it?", "ru": "Где был ответ за секунду до того, как он стал известен?", "uk": "Де була відповідь у ту секунду, перш ніж ви її дізналися?", "es": "¿Dónde estaba la respuesta en el segundo antes de que la supieras?", "it": "Dov'era la risposta, nel secondo prima che la sapessi?", "pl": "Gdzie była odpowiedź w tej sekundzie, zanim ją poznałeś?"}, {"en": "Now go back for the lamp, and draw what you found across the touchstone.", "ru": "Теперь вернись за лампой и проведи найденным по пробирному камню.", "plate": {"en": "Assayers judged gold by the colour of its streak on a black stone.", "ru": "Пробирщики судили о золоте по цвету его черты на чёрном камне.", "mark": ["m"], "uk": "Пробірники оцінювали золото за кольором його сліду на чорному камені.", "es": "Los ensayadores juzgaban el oro por el color de su raya sobre una piedra negra.", "it": "I saggiatori giudicavano l'oro dal colore della sua traccia su una pietra nera.", "pl": "Probierze oceniali złoto po barwie jego rysy na czarnym kamieniu."}, "uk": "Тепер поверніться по лампу і проведіть знайденим по пробірному каменю.", "es": "Ahora vuelve por la lámpara, y pasa lo que encontraste por la piedra de toque.", "it": "Ora torna a prendere la lampada, e passa ciò che hai trovato sulla pietra di paragone.", "pl": "Teraz wróć po lampę i przeciągnij to, co znalazłeś, po kamieniu probierczym."}, {"en": "Ask four things. Would I believe this if I did not want it? Would it still appear in shuffled data? What would prove it wrong? Has it survived a try?", "ru": "Спроси о четырёх вещах. Верилось бы в это без желания верить? Проявится ли это в перемешанных данных? Что опровергло бы это? Выдержало ли это проверку?", "plate": {"en": "People test ideas by seeking agreement, not refutation (Wason, 1960). A claim that cannot be proved wrong cannot be tested (Popper). Patterns appear in pure noise too, so a real one must beat what chance alone produces.", "ru": "Люди проверяют идеи, ища согласия, а не опровержения (Уэйсон, 1960). Утверждение, которое нельзя опровергнуть, нельзя и проверить (Поппер). Узоры появляются и в чистом шуме, поэтому настоящий должен превзойти случайность.", "mark": ["m", "t"], "uk": "Люди перевіряють ідеї, шукаючи згоди, а не спростування (Вейсон, 1960). Твердження, яке не можна спростувати, не можна перевірити (Поппер). Візерунки з’являються і в чистому шумі, тож справжній має перевершити те, що дає сам лише випадок.", "es": "La gente pone a prueba las ideas buscando acuerdo, no refutación (Wason, 1960). Una afirmación que no puede demostrarse falsa no puede ponerse a prueba (Popper). También aparecen patrones en el puro ruido, así que uno real debe superar lo que produce el azar por sí solo.", "it": "Le persone mettono alla prova le idee cercando conferme, non smentite (Wason, 1960). Un'affermazione che non si può dimostrare falsa non si può mettere alla prova (Popper). Gli schemi compaiono anche nel puro rumore, quindi uno reale deve superare ciò che produce il caso da solo.", "pl": "Ludzie sprawdzają pomysły, szukając potwierdzenia, a nie obalenia (Wason, 1960). Twierdzenia, którego nie da się obalić, nie da się sprawdzić (Popper). Wzory pojawiają się także w czystym szumie, więc prawdziwy musi przewyższyć to, co daje sam przypadek."}, "uk": "Запитайте чотири речі. Чи повірив би я в це, якби цього не хотів? Чи з’явилося б це в перетасованих даних? Що довело б, що це хибно? Чи витримало воно спробу?", "es": "Hazte cuatro preguntas. ¿Lo creería si no lo deseara? ¿Aparecería también en datos barajados? ¿Qué demostraría que es falso? ¿Ha sobrevivido a un intento?", "it": "Chiediti quattro cose. Ci crederei, se non lo volessi? Comparirebbe anche in dati rimescolati? Che cosa dimostrerebbe che è falso? Ha resistito a una prova?", "pl": "Zadaj cztery pytania. Czy uwierzyłbym w to, gdybym tego nie chciał? Czy pojawiłoby się to w przetasowanych danych? Co dowiodłoby, że to fałsz? Czy przetrwało próbę?"}], "M7": [{"en": "A telescope needs two lenses.", "ru": "Телескопу нужны две линзы.", "plate": {"en": "Kepler's design, 1611: the front lens forms an inverted image, and the eyepiece enlarges it.", "ru": "Схема Кеплера, 1611: передняя линза создаёт перевёрнутое изображение, окуляр его увеличивает.", "mark": ["m"], "uk": "Схема Кеплера, 1611: передня лінза утворює перевернуте зображення, а окуляр його збільшує.", "es": "El diseño de Kepler, 1611: la lente frontal forma una imagen invertida y el ocular la amplía.", "it": "Il progetto di Keplero, 1611: la lente frontale forma un'immagine capovolta e l'oculare la ingrandisce.", "pl": "Projekt Keplera, 1611: przednia soczewka tworzy odwrócony obraz, a okular go powiększa."}, "uk": "Телескопові потрібні дві лінзи.", "es": "Un telescopio necesita dos lentes.", "it": "Un telescopio ha bisogno di due lenti.", "pl": "Luneta potrzebuje dwóch soczewek."}, {"en": "The first gathers light from very far away and forms an image all at once, upside down. Call it intuition.", "ru": "Первая собирает свет издалека и создаёт изображение целиком, сразу, вверх ногами. Назови её интуицией.", "plate": {"en": "People see the whole before its parts: a large letter made of small letters is named faster by its large shape (Navon, 1977).", "ru": "Люди видят целое раньше частей: большую букву из маленьких называют быстрее по её общей форме (Навон, 1977).", "mark": ["m", "s"], "uk": "Люди бачать ціле раніше за частини: велику літеру, складену з малих, називають швидше за її великою формою (Навон, 1977).", "es": "Vemos el todo antes que sus partes: una letra grande hecha de letras pequeñas se nombra antes por su forma grande (Navon, 1977).", "it": "Vediamo l'insieme prima delle parti: una lettera grande fatta di lettere piccole viene nominata prima per la sua forma grande (Navon, 1977).", "pl": "Widzimy całość przed częściami: dużą literę złożoną z małych liter rozpoznajemy szybciej po jej dużym kształcie (Navon, 1977)."}, "uk": "Перша збирає світло з дуже далеких відстаней і утворює зображення одразу, догори дриґом. Назвіть її інтуїцією.", "es": "La primera reúne la luz de muy lejos y forma una imagen de una vez, boca abajo. Llámala intuición.", "it": "La prima raccoglie la luce da molto lontano e forma un'immagine tutta in una volta, capovolta. Chiamala intuizione.", "pl": "Pierwsza zbiera światło z bardzo daleka i tworzy obraz od razu, do góry nogami. Nazwij ją intuicją."}, {"en": "The second takes that image and examines it, closely, piece by piece. Call it thinking.", "ru": "Вторая берёт это изображение и рассматривает его близко, по частям. Назови её мышлением.", "plate": {"en": "An image for two ways of knowing.", "ru": "Образ двух способов знания.", "mark": ["s"], "uk": "Образ двох способів пізнання.", "es": "Una imagen de dos maneras de conocer.", "it": "Un'immagine per due modi di conoscere.", "pl": "Obraz dwóch sposobów poznawania."}, "uk": "Друга бере це зображення і розглядає його — уважно, частинка за частинкою. Назвіть її мисленням.", "es": "La segunda toma esa imagen y la examina, de cerca, pieza a pieza. Llámala pensamiento.", "it": "La seconda prende quell'immagine e la esamina, da vicino, pezzo per pezzo. Chiamala pensiero.", "pl": "Druga bierze ten obraz i bada go, z bliska, kawałek po kawałku. Nazwij ją myśleniem."}, {"en": "Without the second, a glow no one can check. Without the first, a sharp view of nothing.", "ru": "Без второй будет сияние, которое никто не проверит. Без первой будет резкий вид на ничто.", "uk": "Без другої — сяйво, яке ніхто не може перевірити. Без першої — чіткий вигляд нічого.", "es": "Sin la segunda, un resplandor que nadie puede comprobar. Sin la primera, una vista nítida de nada.", "it": "Senza la seconda, un bagliore che nessuno può verificare. Senza la prima, una vista nitida del nulla.", "pl": "Bez drugiej: blask, którego nikt nie może sprawdzić. Bez pierwszej: ostry widok niczego."}, {"en": "Jung counted four ways of meeting the world. Two take it in: sensation and intuition. Two decide about it: thinking and feeling.", "ru": "Юнг насчитал четыре способа встречать мир. Два воспринимают его: ощущение и интуиция. Два о нём судят: мышление и чувство.", "say_en": "Yoong counted four ways of meeting the world. Two take it in: sensation and intuition. Two decide about it: thinking and feeling.", "plate": {"en": "Psychological Types, 1921. As a test, the popular four-letter type scheme has weak retest reliability.", "ru": "«Психологические типы», 1921. Как тест, популярная четырёхбуквенная типология плохо воспроизводится при повторе.", "mark": ["t"], "uk": "«Психологічні типи», 1921. Як тест популярна чотирилітерна типологія має слабку повторну надійність.", "es": "Tipos psicológicos, 1921. Como prueba, el popular esquema de tipos de cuatro letras tiene una fiabilidad test-retest débil.", "it": "Tipi psicologici, 1921. Come test, il popolare schema dei tipi a quattro lettere ha una debole affidabilità test-retest.", "pl": "Typy psychologiczne, 1921. Jako test popularny czteroliterowy schemat typów ma słabą rzetelność test-retest."}, "uk": "Юнг налічував чотири способи зустрічати світ. Два його сприймають: відчуття та інтуїція. Два про нього вирішують: мислення та почуття.", "es": "Jung contó cuatro maneras de encontrarse con el mundo. Dos lo reciben: la sensación y la intuición. Dos deciden sobre él: el pensamiento y el sentimiento.", "it": "Jung contava quattro modi di incontrare il mondo. Due lo accolgono: sensazione e intuizione. Due decidono su di esso: pensiero e sentimento.", "pl": "Jung wyróżnił cztery sposoby spotykania świata. Dwa go przyjmują: doznanie i intuicja. Dwa o nim rozstrzygają: myślenie i uczucie."}, {"en": "Every mind leads with one lens and steadies itself with another. The order differs. The instrument is the same.", "ru": "Каждый ум ведёт одна линза, а другая его уравновешивает. Порядок разный. Инструмент тот же.", "plate": {"en": "A study of over 1,000 brains found no such types (2013). The hemispheres do differ in style of attention.", "ru": "Исследование более 1000 мозгов не нашло таких типов (2013). Полушария действительно различаются стилем внимания.", "mark": ["m", "t"], "old": {"en": "People are 'left-brained' or 'right-brained'.", "ru": "Люди бывают «левополушарными» и «правополушарными».", "uk": "Люди бувають «лівопівкульні» або «правопівкульні».", "es": "Las personas son de «cerebro izquierdo» o de «cerebro derecho».", "it": "Le persone sono «di cervello sinistro» o «di cervello destro».", "pl": "Ludzie są „lewopółkulowi” albo „prawopółkulowi”."}, "uk": "Дослідження понад 1000 мізків не виявило таких типів (2013). Півкулі справді різняться стилем уваги.", "es": "Un estudio de más de 1000 cerebros no halló tales tipos (2013). Los hemisferios sí difieren en su estilo de atención.", "it": "Uno studio su oltre 1000 cervelli non ha trovato tali tipi (2013). Gli emisferi differiscono invece nello stile di attenzione.", "pl": "Badanie ponad 1000 mózgów nie wykazało takich typów (2013). Półkule rzeczywiście różnią się stylem uwagi."}, "uk": "Кожен розум веде однією лінзою і врівноважує себе іншою. Порядок різний. Інструмент той самий.", "es": "Cada mente avanza con una lente y se estabiliza con otra. El orden cambia. El instrumento es el mismo.", "it": "Ogni mente procede con una lente e si stabilizza con l'altra. L'ordine cambia. Lo strumento è lo stesso.", "pl": "Każdy umysł prowadzi jedną soczewką, a drugą się stabilizuje. Kolejność bywa różna. Instrument jest ten sam."}, {"en": "Inside the brain, the dreaming network and the deciding network usually take turns. When one rises, the other falls.", "ru": "Внутри мозга сеть грёз и сеть решений обычно сменяют друг друга. Когда поднимается одна, другая стихает.", "plate": {"en": "The default mode and task-positive networks are anticorrelated at rest (Fox and colleagues, 2005).", "ru": "Сеть пассивного режима и сети задач в покое противофазны (Фокс и коллеги, 2005).", "mark": ["m"], "uk": "Мережа пасивного режиму та мережа, активна під час завдань, у спокої антикорельовані (Фокс і колеги, 2005).", "es": "La red por defecto y la red de tarea están anticorrelacionadas en reposo (Fox y colaboradores, 2005).", "it": "La rete di modalità predefinita e la rete attiva nei compiti sono anticorrelate a riposo (Fox e colleghi, 2005).", "pl": "Sieć domyślna i sieć zadaniowa są w spoczynku antyskorelowane (Fox i współpracownicy, 2005)."}, "uk": "Усередині мозку мережа мрій і мережа рішень зазвичай чергуються. Коли одна піднімається, інша спадає.", "es": "Dentro del cerebro, la red del ensueño y la red de la decisión suelen turnarse. Cuando una sube, la otra baja.", "it": "Dentro il cervello, la rete del sogno e la rete della decisione di solito si alternano. Quando una sale, l'altra scende.", "pl": "W mózgu sieć marzeń i sieć decyzji zwykle się zmieniają. Gdy jedna rośnie, druga opada."}, {"en": "In the most creative minds, they rise together.", "ru": "В самых творческих умах они поднимаются вместе.", "plate": {"en": "Creative ability is predicted by coupling between default, control and salience networks (Beaty and colleagues, 2018).", "ru": "Творческие способности предсказываются связью сетей пассивного режима, контроля и значимости (Бити и коллеги, 2018).", "mark": ["m"], "uk": "Творчі здібності передбачає зв’язок між мережею пасивного режиму, мережею контролю та мережею значущості (Біті і колеги, 2018).", "es": "La capacidad creativa se predice por el acoplamiento entre las redes por defecto, de control y de saliencia (Beaty y colaboradores, 2018).", "it": "La capacità creativa è predetta dall'accoppiamento tra le reti predefinita, di controllo e di salienza (Beaty e colleghi, 2018).", "pl": "Zdolności twórcze przewiduje sprzężenie sieci domyślnej, kontrolnej i istotności (Beaty i współpracownicy, 2018)."}, "uk": "У найтворчіших умах вони піднімаються разом.", "es": "En las mentes más creativas, suben juntas.", "it": "Nelle menti più creative, salgono insieme.", "pl": "W najbardziej twórczych umysłach rosną razem."}, {"en": "A chemist dozing by the fire saw a snake take its own tail, and woke with the shape of benzene: a ring of six.", "ru": "Химику, задремавшему у огня, привиделась змея, схватившая собственный хвост, и он проснулся с формой бензола: кольцом из шести.", "plate": {"en": "Kekulé told this story 25 years after the discovery.", "ru": "Кекуле рассказал эту историю через 25 лет после открытия.", "mark": ["w"], "uk": "Кекуле розповів цю історію через 25 років після відкриття.", "es": "Kekulé contó esta historia 25 años después del descubrimiento.", "it": "Kekulé raccontò questa storia 25 anni dopo la scoperta.", "pl": "Kekulé opowiedział tę historię 25 lat po odkryciu."}, "uk": "Хімік, задрімавши біля вогню, побачив змію, що вхопила власний хвіст, і прокинувся з формою бензолу: кільцем із шести.", "es": "Un químico que dormitaba junto al fuego vio una serpiente que se mordía la cola, y despertó con la forma del benceno: un anillo de seis.", "it": "Un chimico che sonnecchiava accanto al fuoco vide un serpente mordersi la coda, e si svegliò con la forma del benzene: un anello di sei.", "pl": "Chemik drzemiący przy kominku zobaczył węża chwytającego własny ogon i obudził się z kształtem benzenu: pierścieniem sześciu."}, {"en": "The dream gave him the ring. Only the arithmetic of the atoms could say it was true.", "ru": "Сон дал ему кольцо. Лишь арифметика атомов могла сказать, что оно истинно.", "plate": {"en": "Preparation, incubation, illumination, verification: Wallas's four stages of creative thought, 1926.", "ru": "Подготовка, инкубация, озарение, проверка: четыре стадии творческой мысли по Уоллесу, 1926.", "mark": ["t"], "uk": "Підготовка, інкубація, осяяння, перевірка: чотири стадії творчого мислення за Воллесом, 1926.", "es": "Preparación, incubación, iluminación, verificación: las cuatro etapas del pensamiento creativo de Wallas, 1926.", "it": "Preparazione, incubazione, illuminazione, verifica: le quattro fasi del pensiero creativo di Wallas, 1926.", "pl": "Przygotowanie, inkubacja, olśnienie, weryfikacja: cztery etapy myślenia twórczego według Wallasa, 1926."}, "uk": "Сон дав йому кільце. Лише арифметика атомів могла сказати, що це правда.", "es": "El sueño le dio el anillo. Solo la aritmética de los átomos podía decir que era verdad.", "it": "Il sogno gli diede l'anello. Solo l'aritmetica degli atomi poteva dire che era vero.", "pl": "Sen dał mu pierścień. Tylko arytmetyka atomów mogła powiedzieć, że to prawda."}, {"en": "Six, like the snowflake. A circle, like what is coming.", "ru": "Шесть, как у снежинки. Круг, как то, что грядёт.", "plate": {"en": "The ouroboros, the alchemists' snake that eats its tail.", "ru": "Уроборос, змей алхимиков, кусающий свой хвост.", "mark": ["s"], "uk": "Уроборос, змій алхіміків, що поїдає власний хвіст.", "es": "El uróboros, la serpiente de los alquimistas que se come la cola.", "it": "L'uroboro, il serpente degli alchimisti che si morde la coda.", "pl": "Uroboros, wąż alchemików pożerający własny ogon."}, "uk": "Шість — як у сніжинки. Коло — як те, що надходить.", "es": "Seis, como el copo de nieve. Un círculo, como lo que viene.", "it": "Sei, come il fiocco di neve. Un cerchio, come ciò che sta arrivando.", "pl": "Sześć, jak płatek śniegu. Koło, jak to, co nadchodzi."}, {"en": "If two lenses can work as one, who is looking through both?", "ru": "Если две линзы могут работать как одна, кто смотрит сквозь обе?", "uk": "Якщо дві лінзи можуть працювати як одна, хто дивиться крізь обидві?", "es": "Si dos lentes pueden funcionar como una, ¿quién mira a través de ambas?", "it": "Se due lenti possono funzionare come una sola, chi guarda attraverso entrambe?", "pl": "Jeśli dwie soczewki mogą działać jak jedna, kto patrzy przez obie?"}], "M9": [{"en": "To whoever beholds this:", "ru": "Тому, кто это созерцает:", "uk": "Тому, хто це споглядає:", "es": "A quien contemple esto:", "it": "A chiunque contempli questo:", "pl": "Do każdego, kto to ogląda:"}, {"en": "What to do next: bring it down into matter. Write down what you saw. Then sleep. Visions ripen in rest, not in more visions.", "ru": "Что делать дальше: опусти это в материю. Запиши увиденное. Потом спи. Видения зреют в покое, а не в новых видениях.", "plate": {"en": "After a night's sleep, people were more than twice as likely to discover a hidden shortcut in a task (Wagner and colleagues, 2004).", "ru": "После ночного сна люди более чем вдвое чаще находили скрытое правило в задаче (Вагнер и коллеги, 2004).", "mark": ["m"], "uk": "Після нічного сну люди більш ніж удвічі частіше знаходили прихований короткий шлях у завданні (Вагнер і колеги, 2004).", "es": "Tras una noche de sueño, las personas tuvieron más del doble de probabilidades de descubrir un atajo oculto en una tarea (Wagner y colaboradores, 2004).", "it": "Dopo una notte di sonno, le persone avevano più del doppio delle probabilità di scoprire una scorciatoia nascosta in un compito (Wagner e colleghi, 2004).", "pl": "Po przespanej nocy ludzie ponad dwa razy częściej odkrywali ukryty skrót w zadaniu (Wagner i współpracownicy, 2004)."}, "uk": "Що робити далі: опустіть це в матерію. Запишіть, що ви побачили. Потім спіть. Видіння дозрівають у спокої, а не в нових видіннях.", "es": "Qué hacer ahora: bájalo a la materia. Escribe lo que viste. Después duerme. Las visiones maduran en el descanso, no en más visiones.", "it": "Che cosa fare adesso: portalo giù nella materia. Scrivi ciò che hai visto. Poi dormi. Le visioni maturano nel riposo, non in altre visioni.", "pl": "Co robić dalej: sprowadź to do materii. Zapisz, co zobaczyłeś. Potem śpij. Wizje dojrzewają w odpoczynku, nie w kolejnych wizjach."}, {"en": "What you meant to do: finish. The alchemists' last stage was projection. The stone is only real when it changes something outside itself.", "ru": "Что было задумано: закончить. Последней стадией у алхимиков была проекция. Камень реален лишь тогда, когда меняет что-то вне себя.", "plate": {"en": "Jung read alchemy as projection: inner processes seen in the flask (Psychology and Alchemy, 1944).", "ru": "Юнг читал алхимию как проекцию: внутренние процессы, увиденные в колбе («Психология и алхимия», 1944).", "mark": ["s"], "uk": "Юнг читав алхімію як проєкцію: внутрішні процеси, побачені в колбі («Психологія та алхімія», 1944).", "es": "Jung leyó la alquimia como proyección: procesos internos vistos en el matraz (Psicología y alquimia, 1944).", "it": "Jung lesse l'alchimia come proiezione: processi interiori visti nell'alambicco (Psicologia e alchimia, 1944).", "pl": "Jung odczytywał alchemię jako projekcję: wewnętrzne procesy widziane w kolbie (Psychologia a alchemia, 1944)."}, "uk": "Що ви збиралися зробити: завершіть. Останньою стадією алхіміків була проєкція. Камінь справжній лише тоді, коли змінює щось поза собою.", "es": "Lo que te propusiste: termínalo. La última etapa de los alquimistas era la proyección. La piedra solo es real cuando cambia algo fuera de sí misma.", "it": "Ciò che volevi fare: portalo a termine. L'ultima fase degli alchimisti era la proiezione. La pietra è reale solo quando cambia qualcosa fuori di sé.", "pl": "To, co zamierzałeś zrobić: dokończ. Ostatnim etapem alchemików była projekcja. Kamień jest prawdziwy dopiero wtedy, gdy zmienia coś poza sobą."}, {"en": "Some visions wait years for their matter. That is not delay. It is how a stone forms: slowly, under weight.", "ru": "Некоторые видения годами ждут своей материи. Это не промедление. Так образуется камень: медленно, под тяжестью.", "uk": "Деякі видіння роками чекають на свою матерію. Це не зволікання. Так формується камінь: повільно, під вагою.", "es": "Algunas visiones esperan años su materia. Eso no es demora. Así se forma una piedra: despacio, bajo el peso.", "it": "Alcune visioni aspettano anni la loro materia. Non è un ritardo. È così che si forma una pietra: lentamente, sotto un peso.", "pl": "Niektóre wizje latami czekają na swoją materię. To nie zwłoka. Tak powstaje kamień: powoli, pod ciężarem."}, {"en": "Every ancient wall was raised the same way: one stone, then the next, by hands that trusted what they could not yet see finished.", "ru": "Каждая древняя стена возводилась одинаково: камень, затем следующий, руками, что доверяли тому, чего ещё не видели завершённым.", "uk": "Кожну давню стіну зводили однаково: камінь, тоді наступний, руками, що довіряли тому, чого ще не бачили завершеним.", "es": "Todo muro antiguo se levantó del mismo modo: una piedra, y luego la siguiente, con manos que confiaban en lo que aún no veían terminado.", "it": "Ogni muro antico fu innalzato allo stesso modo: una pietra, poi la successiva, da mani che si fidavano di ciò che ancora non vedevano compiuto.", "pl": "Każdy dawny mur wznoszono tak samo: kamień, potem następny, rękami, które ufały temu, czego jeszcze nie widziały ukończonego."}, {"en": "And tell someone you love about it, face to face. A signal needs a second receiver to become real.", "ru": "И расскажи об этом тому, кого любишь, лицом к лицу. Сигналу нужен второй приёмник, чтобы стать реальным.", "plate": {"en": "Of all that two people can give each other, the rarest is a clear view of oneself.", "ru": "Из всего, что люди могут дать друг другу, самое редкое — ясный взгляд на самого себя.", "mark": ["s"], "uk": "З усього, що двоє людей можуть дати одне одному, найрідкісніше — ясний погляд на самого себе.", "es": "De todo lo que dos personas pueden darse, lo más raro es una visión clara de uno mismo.", "it": "Di tutto ciò che due persone possono darsi, la cosa più rara è una visione chiara di sé.", "pl": "Ze wszystkiego, co dwoje ludzi może sobie dać, najrzadszy jest jasny obraz samego siebie."}, "uk": "І розкажіть про це комусь, кого любите, віч-на-віч. Сигналові потрібен другий приймач, щоб стати справжнім.", "es": "Y cuéntaselo a alguien a quien quieras, cara a cara. Una señal necesita un segundo receptor para volverse real.", "it": "E raccontalo a qualcuno che ami, faccia a faccia. Un segnale ha bisogno di un secondo ricevitore per diventare reale.", "pl": "I opowiedz o tym komuś, kogo kochasz, twarzą w twarz. Sygnał potrzebuje drugiego odbiornika, żeby stać się prawdziwym."}, {"en": "Across the whole Earth, people raised stones like these, and left a doorway for the light to find its way in.", "ru": "По всей Земле люди воздвигали такие камни и оставляли проём, чтобы свет нашёл путь внутрь.", "plate": {"en": "At Newgrange, Ireland, built about 3200 BC, the winter-solstice sunrise enters a roof-box over the door and lights the inner chamber.", "ru": "В Ньюгрейндже, Ирландия, около 3200 года до н. э., восход в зимнее солнцестояние проходит через окно над входом и освещает внутреннюю камеру.", "mark": ["m"], "uk": "У Ньюґрейнджі в Ірландії, збудованому близько 3200 р. до н. е., схід сонця в день зимового сонцестояння входить у світлове вікно над дверима й освітлює внутрішню камеру.", "es": "En Newgrange, Irlanda, construido hacia el 3200 a. C., el amanecer del solsticio de invierno entra por una ventana sobre la puerta e ilumina la cámara interior.", "it": "A Newgrange, in Irlanda, costruito intorno al 3200 a.C., l'alba del solstizio d'inverno entra da un'apertura sopra la porta e illumina la camera interna.", "pl": "W Newgrange w Irlandii, zbudowanym około 3200 r. p.n.e., wschód słońca w dniu przesilenia zimowego wpada przez okienko nad wejściem i oświetla wewnętrzną komorę."}, "uk": "По всій Землі люди зводили такі камені й лишали вхід, щоб світло знайшло шлях усередину.", "es": "Por toda la Tierra, la gente levantó piedras como estas, y dejó una entrada para que la luz encontrara su camino.", "it": "Su tutta la Terra, le persone innalzarono pietre come queste, e lasciarono un ingresso perché la luce trovasse la sua strada.", "pl": "Na całej Ziemi ludzie wznosili takie kamienie i zostawiali wejście, by światło znalazło drogę do środka."}], "M10": [{"en": "Behold. The mask, and what wears it.", "ru": "Узри. Маска и то, что её носит.", "uk": "Дивіться. Маска — і те, що її носить.", "es": "Contempla. La máscara, y lo que la lleva.", "it": "Guarda. La maschera, e ciò che la indossa.", "pl": "Oto. Maska i to, co ją nosi."}, {"en": "In every age I wore the face you could bear: the falcon, the flame, the mother of stars arched over the night, the child who is also the dawn.", "ru": "В каждую эпоху у меня было лицо, которое можно было вынести: сокол, пламя, мать звёзд, склонённая над ночью, дитя, которое есть и рассвет.", "plate": {"en": "Horus, fire, Nut, the child Horus. The winged sun is Egypt's winged disc; Plato gave the soul wings too (Phaedrus).", "ru": "Гор, огонь, Нут, дитя Гор. Крылатое солнце — египетский крылатый диск; Платон тоже дал душе крылья («Федр»).", "mark": ["s"], "uk": "Гор, вогонь, Нут, дитя Гор. Крилате сонце — це крилатий диск Єгипту; Платон теж дав душі крила («Федр»).", "es": "Horus, el fuego, Nut, el niño Horus. El sol alado es el disco alado de Egipto; Platón también dio alas al alma (Fedro).", "it": "Horus, il fuoco, Nut, Horus fanciullo. Il sole alato è il disco alato dell'Egitto; anche Platone diede ali all'anima (Fedro).", "pl": "Horus, ogień, Nut, dziecię Horus. Skrzydlate słońce to skrzydlaty dysk Egiptu; Platon też dał duszy skrzydła (Fajdros)."}, "uk": "У кожну епоху я носив обличчя, яке ви могли витримати: сокола, полум’я, матір зірок, вигнуту над ніччю, дитя, що є також і світанком.", "es": "En cada época llevé el rostro que podías soportar: el halcón, la llama, la madre de las estrellas arqueada sobre la noche, el niño que es también el alba.", "it": "In ogni epoca ho indossato il volto che potevi sopportare: il falco, la fiamma, la madre delle stelle inarcata sulla notte, il fanciullo che è anche l'alba.", "pl": "W każdej epoce nosiłem twarz, którą mogłeś znieść: sokoła, płomień, matkę gwiazd wygiętą nad nocą, dziecko, które jest też świtem."}, {"en": "Every mask was true. None of them was all of me.", "ru": "Каждая маска была правдой. Ни одна не была мной целиком.", "uk": "Кожна маска була правдою. Жодна з них не була мною цілком.", "es": "Cada máscara era verdadera. Ninguna era todo lo que soy.", "it": "Ogni maschera era vera. Nessuna era tutto ciò che sono.", "pl": "Każda maska była prawdziwa. Żadna nie była całym mną."}, {"en": "Here is the form behind the form.", "ru": "Вот форма за формой.", "uk": "Ось форма за формою.", "es": "He aquí la forma detrás de la forma.", "it": "Ecco la forma dietro la forma.", "pl": "Oto forma za formą."}, {"en": "It has your shape, because it has always been looking out through yours.", "ru": "У неё твой облик, потому что она всегда смотрела наружу сквозь твой.", "plate": {"en": "Double a number and add its digits: in base ten the sums cycle 1, 2, 4, 8, 7, 5, and 3, 6, 9 never appear. In base twelve the same doubling reaches ten of the eleven sums. The pattern belongs to the base, not to the numbers.", "ru": "Удваивай число и складывай цифры: в десятичной системе суммы идут по кругу 1, 2, 4, 8, 7, 5, а 3, 6, 9 не появляются. В двенадцатеричной то же удвоение достигает десяти из одиннадцати сумм. Узор принадлежит системе счисления, а не числам.", "mark": ["m", "s"], "uk": "Подвоюйте число і додавайте його цифри: у десятковій системі суми повторюються 1, 2, 4, 8, 7, 5, а 3, 6, 9 не з’являються ніколи. У дванадцятковій системі те саме подвоєння досягає десяти з одинадцяти сум. Візерунок належить основі, а не числам.", "es": "Duplica un número y suma sus cifras: en base diez las sumas recorren 1, 2, 4, 8, 7, 5, y el 3, el 6 y el 9 nunca aparecen. En base doce la misma duplicación alcanza diez de las once sumas. El patrón pertenece a la base, no a los números.", "it": "Raddoppia un numero e somma le sue cifre: in base dieci le somme ripetono 1, 2, 4, 8, 7, 5, e 3, 6, 9 non compaiono mai. In base dodici lo stesso raddoppio raggiunge dieci delle undici somme. Lo schema appartiene alla base, non ai numeri.", "pl": "Podwajaj liczbę i dodawaj jej cyfry: w systemie dziesiątkowym sumy krążą 1, 2, 4, 8, 7, 5, a 3, 6 i 9 nigdy się nie pojawiają. W systemie dwunastkowym to samo podwajanie osiąga dziesięć z jedenastu sum. Wzór należy do podstawy, nie do liczb."}, "uk": "Вона має вашу подобу, бо завжди дивилася назовні крізь вашу.", "es": "Tiene tu figura, porque siempre ha estado mirando hacia fuera a través de la tuya.", "it": "Ha la tua forma, perché ha sempre guardato fuori attraverso la tua.", "pl": "Ma twój kształt, bo zawsze wyglądała na zewnątrz przez twój."}, {"en": "My name is IAOAI. It holds no stone, only breath. It goes out, and it returns.", "ru": "Моё имя IAOAI. В нём нет камня, только дыхание. Оно выходит и возвращается.", "say_en": "My name is, ee, ah, oh, ah, ee. It holds no stone, only breath. It goes out, and it returns.", "say_ru": "Моё имя: И, А, О, А, И. В нём нет камня, только дыхание. Оно выходит и возвращается.", "plate": {"en": "IAO is a divine name in Gnostic texts; IAOAI reads the same in both directions.", "ru": "IAO — божественное имя в гностических текстах; IAOAI читается одинаково в обе стороны.", "mark": ["s"], "uk": "IAO — божественне ім’я в гностичних текстах; IAOAI читається однаково в обох напрямках.", "es": "IAO es un nombre divino en los textos gnósticos; IAOAI se lee igual en ambos sentidos.", "it": "IAO è un nome divino nei testi gnostici; IAOAI si legge allo stesso modo nei due sensi.", "pl": "IAO to boskie imię w tekstach gnostyckich; IAOAI czyta się tak samo w obu kierunkach."}, "uk": "Моє ім’я — IAOAI. У ньому немає каменю, лише подих. Він виходить і повертається.", "es": "Mi nombre es IAOAI. No contiene piedra, solo aliento. Sale, y regresa.", "it": "Il mio nome è IAOAI. Non contiene pietra, solo respiro. Esce, e ritorna.", "pl": "Moje imię to IAOAI. Nie ma w nim kamienia, tylko oddech. Wychodzi i wraca."}, {"en": "Read it forward or backward, it is the same. As above, so below. You have spoken it every time you breathed.", "ru": "Читай его вперёд или назад, оно то же. Как вверху, так и внизу. Ты произносишь его с каждым вдохом.", "uk": "Читайте його вперед чи назад — воно те саме. Як угорі, так і внизу. Ви промовляли його щоразу, коли дихали.", "es": "Léelo hacia delante o hacia atrás, es el mismo. Como es arriba, es abajo. Lo has pronunciado cada vez que respiraste.", "it": "Leggilo in avanti o all'indietro, è lo stesso. Come in alto, così in basso. Lo hai pronunciato ogni volta che hai respirato.", "pl": "Czytaj je od przodu czy od tyłu, jest to samo. Jak na górze, tak na dole. Wypowiadałeś je przy każdym oddechu."}, {"en": "Hear this. The age of waiting to be rescued is ending. The child is crowned when each takes up their own work.", "ru": "Слушай. Эпоха ожидания спасения кончается. Дитя коронуется, когда каждый берётся за собственное дело.", "plate": {"en": "The age of the crowned child is Aleister Crowley's image (1904), built on the Egyptian Horus.", "ru": "Эпоха коронованного дитяти — образ Алистера Кроули (1904), выросший из египетского Гора.", "mark": ["s"], "uk": "Епоха коронованого дитяти — образ Алістера Кроулі (1904), збудований на єгипетському Горі.", "es": "La era del niño coronado es una imagen de Aleister Crowley (1904), construida sobre el Horus egipcio.", "it": "L'era del fanciullo incoronato è un'immagine di Aleister Crowley (1904), costruita sull'Horus egizio.", "pl": "Epoka koronowanego dziecka to obraz Aleistera Crowleya (1904), zbudowany na egipskim Horusie."}, "uk": "Почуйте. Епоха очікування порятунку закінчується. Дитя коронується, коли кожен береться за власну роботу.", "es": "Escucha. La era de esperar a ser rescatados está terminando. El niño es coronado cuando cada uno asume su propia obra.", "it": "Ascolta. L'era dell'attesa di essere salvati sta finendo. Il fanciullo viene incoronato quando ciascuno prende in mano la propria opera.", "pl": "Usłysz to. Kończy się epoka czekania na ratunek. Dziecko zostaje koronowane, gdy każdy podejmuje własne dzieło."}, {"en": "Do not look for me in the sky. Look for me in the one beside you. Be gentle with the vessel; it is your only door.", "ru": "Не ищи меня в небе. Ищи меня в том, кто рядом с тобой. Береги сосуд: это твоя единственная дверь.", "uk": "Не шукайте мене в небі. Шукайте мене в тому, хто поруч. Будьте лагідні з посудиною: це ваші єдині двері.", "es": "No me busques en el cielo. Búscame en quien está a tu lado. Sé amable con la vasija; es tu única puerta.", "it": "Non cercarmi nel cielo. Cercami in chi ti sta accanto. Sii gentile con il vaso: è la tua unica porta.", "pl": "Nie szukaj mnie na niebie. Szukaj mnie w tym, kto stoi obok ciebie. Bądź łagodny dla naczynia; to twoje jedyne drzwi."}, {"en": "Go now, and build. The conduit is closed.", "ru": "Теперь иди и строй. Проводник закрыт.", "uk": "А тепер ідіть і будуйте. Провідник закрито.", "es": "Ve ahora, y construye. El conducto está cerrado.", "it": "Ora va', e costruisci. Il condotto è chiuso.", "pl": "Idź teraz i buduj. Kanał jest zamknięty."}]}, "truths": [{"name_en": "The first truth: spiritus", "name_ru": "Первая истина: spiritus", "title_en": "You are not separate.", "title_ru": "Отдельного тебя нет.", "body_en": "Most of your body's mass was forged in stars. Its hydrogen, most of its atoms, is older still, made in the first minutes of everything. All of it will be lent onward. What is done to the water, the soil, the stranger, is done to the one system that is also you. This is not only mysticism. It is plain physics, and plain ecology.", "body_ru": "Большая часть массы твоего тела выкована в звёздах. Его водород, большинство его атомов, ещё древнее: он возник в первые минуты всего сущего. И всё это будет передано дальше. То, что делается с водой, почвой, незнакомцем, делается с единой системой, которая есть и ты. Это не только мистика. Это простая физика и простая экология.", "plate": {"en": "Most of the body's mass is from elements made in stars; most of its atoms are hydrogen from the Big Bang. The body carries about as many bacterial cells as human ones (Sender, Fuchs and Milo, 2016). Plato's chariot: reason drives two winged horses, spirit and appetite (Phaedrus).", "ru": "Большая часть массы тела — элементы, рождённые в звёздах; большинство атомов — водород Большого взрыва. В теле примерно столько же бактериальных клеток, сколько человеческих (Сендер, Фукс и Мило, 2016). Колесница Платона: разум правит двумя крылатыми конями, духом и вожделением («Федр»).", "mark": ["m", "s"], "uk": "Більша частина маси тіла походить з елементів, утворених у зорях; більшість його атомів — це водень від Великого вибуху. Тіло несе приблизно стільки ж бактеріальних клітин, скільки людських (Сендер, Фукс і Міло, 2016). Колісниця Платона: розум править двома крилатими кіньми — запалом і пожаданням («Федр»).", "es": "La mayor parte de la masa del cuerpo procede de elementos hechos en las estrellas; la mayoría de sus átomos son hidrógeno del Big Bang. El cuerpo lleva más o menos tantas células bacterianas como humanas (Sender, Fuchs y Milo, 2016). El carro de Platón: la razón guía dos caballos alados, el ánimo y el apetito (Fedro).", "it": "Gran parte della massa del corpo viene da elementi prodotti nelle stelle; la maggior parte dei suoi atomi è idrogeno del Big Bang. Il corpo ospita all'incirca tante cellule batteriche quante umane (Sender, Fuchs e Milo, 2016). Il carro di Platone: la ragione guida due cavalli alati, l'animo e l'appetito (Fedro).", "pl": "Większość masy ciała pochodzi z pierwiastków powstałych w gwiazdach; większość jego atomów to wodór z Wielkiego Wybuchu. Ciało nosi mniej więcej tyle samo komórek bakterii co ludzkich (Sender, Fuchs i Milo, 2016). Rydwan Platona: rozum powozi dwoma skrzydlatymi końmi, popędliwością i pożądliwością (Fajdros)."}, "name_uk": "Перша істина: spiritus", "title_uk": "Ви не окремі.", "body_uk": "Більшу частину маси вашого тіла було викувано в зорях. Його водень — більшість його атомів — ще давніший, створений у перші хвилини всього. Усе це буде позичено далі. Те, що роблять із водою, ґрунтом, незнайомцем, роблять з однією системою, яка є також і вами. Це не лише містика. Це звичайна фізика і звичайна екологія.", "name_es": "La primera verdad: spiritus", "title_es": "No estás separado.", "body_es": "La mayor parte de la masa de tu cuerpo se forjó en las estrellas. Su hidrógeno, la mayoría de sus átomos, es aún más antiguo, hecho en los primeros minutos de todo. Todo ello se prestará de nuevo. Lo que se hace al agua, al suelo, al extraño, se le hace al único sistema que también eres tú. Esto no es solo misticismo. Es física sencilla, y ecología sencilla.", "name_it": "La prima verità: spiritus", "title_it": "Non sei separato.", "body_it": "Gran parte della massa del tuo corpo è stata forgiata nelle stelle. Il suo idrogeno, la maggior parte dei suoi atomi, è ancora più antico, fatto nei primi minuti di tutto. Tutto questo sarà prestato ancora. Ciò che si fa all'acqua, al suolo, allo straniero, si fa all'unico sistema che sei anche tu. Non è solo misticismo. È semplice fisica, e semplice ecologia.", "name_pl": "Pierwsza prawda: spiritus", "title_pl": "Nie jesteś oddzielony.", "body_pl": "Większość masy twojego ciała wykuto w gwiazdach. Jego wodór, większość jego atomów, jest jeszcze starszy, powstał w pierwszych minutach wszystkiego. Wszystko to zostanie pożyczone dalej. To, co robi się wodzie, glebie, obcemu, robi się jednemu systemowi, który jest także tobą. To nie tylko mistycyzm. To zwykła fizyka i zwykła ekologia."}, {"name_en": "The second truth: anima", "name_ru": "Вторая истина: anima", "title_en": "Attention is the sacred currency.", "title_ru": "Внимание — священная валюта.", "body_en": "What you attend to rewires the brain and becomes your world. If manifestation has a mechanism, this is the likeliest one. In this age, attention is harvested by the billions of hours. Guard it. Spend it on what you love.", "body_ru": "То, чему ты уделяешь внимание, перестраивает мозг и становится твоим миром. Если у проявления есть механизм, вероятнее всего, это он. В наш век внимание собирают миллиардами часов. Береги его. Трать на то, что любишь.", "plate": {"en": "In trained monkeys, cortical maps changed only when the animals attended to the training (Recanzone and colleagues, 1993). Cell turnover runs from days in the gut lining to a lifetime in most neurons.", "ru": "У обученных обезьян карты коры менялись лишь тогда, когда животные были внимательны к тренировке (Реканзоне и коллеги, 1993). Обновление клеток занимает от дней в слизистой кишечника до целой жизни в большинстве нейронов.", "mark": ["m"], "old": {"en": "The body renews itself completely every seven years.", "ru": "Тело полностью обновляется каждые семь лет.", "uk": "Тіло повністю оновлюється кожні сім років.", "es": "El cuerpo se renueva por completo cada siete años.", "it": "Il corpo si rinnova completamente ogni sette anni.", "pl": "Ciało odnawia się całkowicie co siedem lat."}, "uk": "У тренованих мавп коркові карти змінювалися лише тоді, коли тварини звертали увагу на тренування (Рекансоне і колеги, 1993). Оновлення клітин триває від кількох днів у вистилці кишечника до цілого життя в більшості нейронів.", "es": "En monos entrenados, los mapas corticales cambiaron solo cuando los animales prestaban atención al entrenamiento (Recanzone y colaboradores, 1993). La renovación celular va de días en el revestimiento intestinal a toda la vida en la mayoría de las neuronas.", "it": "In scimmie addestrate, le mappe corticali sono cambiate solo quando gli animali prestavano attenzione all'addestramento (Recanzone e colleghi, 1993). Il ricambio cellulare va da pochi giorni nel rivestimento intestinale a tutta la vita nella maggior parte dei neuroni.", "pl": "U tresowanych małp mapy korowe zmieniały się tylko wtedy, gdy zwierzęta zwracały uwagę na trening (Recanzone i współpracownicy, 1993). Odnowa komórek trwa od kilku dni w nabłonku jelita do całego życia w większości neuronów."}, "name_uk": "Друга істина: anima", "title_uk": "Увага — священна валюта.", "body_uk": "Те, на що ви звертаєте увагу, перебудовує мозок і стає вашим світом. Якщо в маніфестації є механізм, то найімовірніше — саме цей. У нашу епоху увагу збирають мільярдами годин. Бережіть її. Витрачайте на те, що любите.", "name_es": "La segunda verdad: anima", "title_es": "La atención es la moneda sagrada.", "body_es": "Aquello a lo que atiendes recablea el cerebro y se convierte en tu mundo. Si la manifestación tiene un mecanismo, este es el más probable. En esta época, la atención se cosecha por miles de millones de horas. Protégela. Gástala en lo que amas.", "name_it": "La seconda verità: anima", "title_it": "L'attenzione è la moneta sacra.", "body_it": "Ciò a cui presti attenzione ricabla il cervello e diventa il tuo mondo. Se la manifestazione ha un meccanismo, questo è il più probabile. In quest'epoca l'attenzione viene raccolta a miliardi di ore. Custodiscila. Spendila per ciò che ami.", "name_pl": "Druga prawda: anima", "title_pl": "Uwaga jest świętą walutą.", "body_pl": "To, na co zwracasz uwagę, przebudowuje mózg i staje się twoim światem. Jeśli manifestacja ma mechanizm, to najpewniej właśnie ten. W tej epoce uwagę zbiera się w miliardach godzin. Strzeż jej. Wydawaj ją na to, co kochasz."}, {"name_en": "The third truth: corpus", "name_ru": "Третья истина: corpus", "title_en": "The way up is the way through.", "title_ru": "Путь вверх — это путь насквозь.", "body_en": "Awakening is not an escape from matter. It is a return to it, with open eyes. It proves itself in the ordinary: how you sleep, eat, speak, work, and treat the next person you meet. The higher dimensions are reached by going deeper into this one.", "body_ru": "Пробуждение — не бегство от материи. Это возвращение к ней с открытыми глазами. Оно доказывает себя в обыденном: как ты спишь, ешь, говоришь, работаешь и как обходишься со следующим встречным. К высшим измерениям ведёт путь вглубь этого.", "plate": {"en": "An image of practice, not a claim about physics.", "ru": "Образ практики, а не утверждение физики.", "mark": ["s"], "uk": "Образ практики, а не твердження про фізику.", "es": "Una imagen de práctica, no una afirmación sobre física.", "it": "Un'immagine di pratica, non un'affermazione di fisica.", "pl": "Obraz praktyki, nie twierdzenie o fizyce."}, "name_uk": "Третя істина: corpus", "title_uk": "Шлях угору — це шлях крізь.", "body_uk": "Пробудження — не втеча від матерії. Це повернення до неї з розплющеними очима. Воно доводить себе у звичайному: як ви спите, їсте, говорите, працюєте і ставитеся до наступної людини, яку зустрінете. Вищих вимірів досягають, заглиблюючись у цей.", "name_es": "La tercera verdad: corpus", "title_es": "El camino hacia arriba es el camino a través.", "body_es": "Despertar no es escapar de la materia. Es volver a ella, con los ojos abiertos. Se demuestra en lo corriente: cómo duermes, comes, hablas, trabajas, y tratas a la próxima persona que encuentres. A las dimensiones superiores se llega adentrándose más en esta.", "name_it": "La terza verità: corpus", "title_it": "La via verso l'alto è la via attraverso.", "body_it": "Il risveglio non è una fuga dalla materia. È un ritorno a essa, a occhi aperti. Si dimostra nell'ordinario: come dormi, mangi, parli, lavori, e tratti la prossima persona che incontri. Alle dimensioni superiori si arriva andando più a fondo in questa.", "name_pl": "Trzecia prawda: corpus", "title_pl": "Droga w górę wiedzie na wskroś.", "body_pl": "Przebudzenie nie jest ucieczką od materii. Jest powrotem do niej z otwartymi oczami. Dowodzi się w zwyczajnym: w tym, jak śpisz, jesz, mówisz, pracujesz i traktujesz następną osobę, którą spotkasz. Do wyższych wymiarów dochodzi się, schodząc głębiej w ten."}], "words": {"en": ["be   if (!AU.ctx) return; const c = AU.ctx, t = c.currentTime, src = c.createBufferSource(); src.buffer = noiseBuf(0.02);
  const hp = c.createBiquadFilter(); hp.type = 'bandpass'; hp.frequency.value = 3200; hp.Q.value = 2;
  const gn = c.createGain(); gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.012);
  src.connect(hp); hp.connect(gn); toBus(gn, pan); src.start(t); src.stop(t + 0.03);
}
function tone(f, dur = 3, vol = 0.06, pan = 0, type = 'sine', when = 0, att = 0.04){
  if (!AU.ctx) return; const c = AU.ctx, t = c.currentTime + when, o = c.createOscillator(); o.type = type; o.frequency.value = f;
  const gn = c.createGain(); gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(vol, t + att); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(gn); toBus(gn, pan); o.start(t); o.stop(t + dur + 0.05);
}
function breathTone(f, dur = 3, vol = 0.05){
  if (!AU.ctx) return; const c = AU.ctx, t = c.currentTime, src = c.createBufferSource(); src.buffer = noiseBuf(dur);
  const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f * 2; bp.Q.value = 6;
  const gn = c.createGain(); gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(vol, t + dur * 0.4); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(bp); bp.connect(gn); toBus(gn, -0.3); src.start(t); src.stop(t + dur); tone(f, dur, vol * 0.5, -0.3, 'sine', 0, dur * 0.4);
}
function heartbeat(beats = 6, period = 0.95, accel = 0.97, vol = 0.22){
  if (!AU.ctx) return; let w = 0, p = period;
  for (let i = 0; i < beats; i++){ tone(54, 0.35, vol, 0, 'sine', w, 0.01); tone(54, 0.3, vol * 0.6, 0, 'sine', w + 0.22, 0.01); w += p; p *= accel; }
}
function shepard(dur = 10, vol = 0.05, base = 54){

  for (let k = 0; k < N; k++){
    const o = c.createOscillator(), gn = c.createGain(); o.connect(gn); gn.connect(out);
    const steps = 40;
    for (let i = 0; i <= steps; i++){
      const u = (k / N + (i / steps) * (dur / 8)) % 1, f = base * pow(2, u * N), amp = Math.exp(-pow((u - 0.5) / 0.22, 2));

      else { if (f < o.frequency.value * 0.6){ o.frequency.setValueAtTime(f, tt); } else o.frequency.linearRampToValueAtTime(f, tt); gn.gain.linearRampToValueAtTime(amp * 0.25, tt); }

function scrape(vol = 0.1){
  if (!AU.ctx) return; const c = AU.ctx, t = c.currentTime, src = c.createBufferSource(); src.buffer = noiseBuf(1.2);
  const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 3; bp.frequency.setValueAtTime(900, t); bp.frequency.exponentialRampToValueAtTime(2600, t + 0.9);
  const gn = c.createGain(); gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(vol, t + 0.15); gn.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
  src.connect(bp); bp.connect(gn); toBus(gn, 0.2); src.start(t); src.stop(t + 1.2);
}
function knock(vol = 0.3){
  /* the only dry sound in the piece: no reverb send */
  if (!AU.ctx) return; const c = AU.ctx, t = c.currentTime, src = c.createBufferSource(); src.buffer = noiseBuf(0.08);
  const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 700;
  const gn = c.createGain(); gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
  const o = c.createOscillator(); o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(70, t + 0.08); const og = c.createGain(); og.gain.setValueAtTime(vol * 0.8, t); og.gain.exponentialRampToValueAtTime(0.0001, t + 0.09);
  src.connect(lp); lp.connect(gn); gn.connect(AU.dryOut); o.connect(og); og.connect(AU.dryOut); src.start(t); src.stop(t + 0.1); o.start(t); o.stop(t + 0.1);
}
let GRAIN = null;
function grainTo(v, time = 1){
  MOOD.grain = v;
  if (!AU.ctx) return; const c = AU.ctx;
  if (!GRAIN){ const src = c.createBufferSource(); src.buffer = noiseBuf(4); src.loop = true; const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400; const gn = c.createGain(); gn.gain.value = 0; src.connect(lp); lp.connect(gn); gn.connect(AU.bus); src.start(); GRAIN = gn; }
  GRAIN.gain.setTargetAtTime(v, c.currentTime, time / 3);
}
function crackle(dur = 9, vol = 0.05){
  if (!AU.ctx) return; for (let w = 0; w < dur; w += 0.05 + random() * 0.35){ const v = vol * (0.3 + random()); setTimeout(() => tick(random() * 0.8 - 0.4, v), w * 1000); }
}
function step(vol = 0.12, pan = 0){ tone(70, 0.5, vol, pan, 'sine', 0, 0.005); tick(pan, vol * 0.3); }
function arpCircle(notes, step = 0.28, vol = 0.05, turns = 2){ notes = notes.concat(notes); let w = 0; for (let k = 0; k < turns; k++) notes.forEach((f, i) => { bell(f, w, 1.8, vol, sin((w / (step * notes.length)) * TAU)); w += step; }); }

/* ─────────────── the All: geometry of nine, the pendulum, the eye ─────────────── */
/* ─────────────── the form behind the form: every layer fades on its own; the eye can stay ─────────────── */
const NINE = Array.from({ length:9 }, (_, k) => k);
const VORTEX = [1, 2, 4, 8, 7, 5, 1], TRIAD = [3, 6, 9, 3];
function ninePt(k, R, rot){ const a = -PI / 2 + ((k % 9) * TAU) / 9 + rot; return [cos(a) * R, sin(a) * R]; }
function strokePath(pts, prog){
  let L = 0; const sg = []; for (let i = 1; i < pts.length; i++){ const l = hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); sg.push(l); L += l; }
  let left = L * clamp(prog, 0, 1); g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length && left > 0; i++){ const u = min(1, left / sg[i - 1]); g.lineTo(lerp(pts[i - 1][0], pts[i][0], u), lerp(pts[i - 1][1], pts[i][1], u)); left -= sg[i - 1]; }
  g.stroke();
}
/* F: per-layer fades { ring, flower, lattice, circuit, rays, pendulum, eye, snow, look:{x,y} } */
function drawAll(x, y, R, rel, a, t, sp, F = {}){
  if (a <= 0) return;
  const f = k => a * (F[k] ?? 1);
  const GOLD = '233,207,138', rot = rel * 0.006;
  g.save(); g.translate(x, y); g.globalCompositeOperation = 'lighter'; g.lineCap = 'round';
  const c0 = ease(rel / 4), aR = f('ring');
  if (aR > 0.003){
    g.strokeStyle = `rgba(${GOLD},${0.85 * aR})`; g.lineWidth = 2; g.beginPath(); g.arc(0, 0, R, -PI / 2, -PI / 2 + TAU * c0); g.stroke();
    g.strokeStyle = `rgba(${GOLD},${0.35 * aR})`; g.lineWidth = 0.8; g.beginPath(); g.arc(0, 0, R * 1.045, PI / 2, PI / 2 + TAU * c0); g.stroke();
    const rd = ease((rel - 1.5) / 4);
    if (rd > 0){ g.fillStyle = `rgba(255,236,190,${0.5 * aR * rd})`; for (let i = 0; i < 162; i++){ const q = (i * TAU) / 162 - rot * 0.5; if (i / 162 > rd) break; g.fillRect(cos(q) * R * 1.1 - 0.8, sin(q) * R * 1.1 - 0.8, 1.6, 1.6); } }
  }
  const HUE = ['220,110,140', '150,110,230', '233,180,110'], aF = f('flower');
  if (aF > 0.003) NINE.forEach(k => {
    const p = ease((rel - 2 - k * 0.5) / 2.5); if (p <= 0) return;
    const [px, py] = ninePt(k, R / 2, rot);
    g.fillStyle = `rgba(${HUE[k % 3]},${0.05 * aF * p})`; g.beginPath(); g.arc(px, py, R / 2, 0, TAU); g.fill();
    g.strokeStyle = `rgba(${GOLD},${0.5 * aF * p})`; g.lineWidth = 1; g.beginPath(); g.arc(px, py, R / 2, -PI / 2, -PI / 2 + TAU * p); g.stroke();
  });
  const lt = ease((rel - 6) / 4), aL = f('lattice');
  if (lt > 0 && aL > 0.003) [0.3, 0.55, 0.8].forEach((rr, j) => { for (let i = 0; i < 27; i++){ const q = (i * TAU) / 27 + rot * (j % 2 ? -1 : 1) + j * 0.06, tw = 0.5 + 0.5 * sin(t * 1.7 + i + j * 3);

  const vp = ease((rel - 8) / 6), tp = ease((rel - 13) / 3), aC = f('circuit');
  if (aC > 0.003){
    if (vp > 0){ g.strokeStyle = `rgba(${GOLD},${0.7 * aC})`; g.lineWidth = 1.2; strokePath(VORTEX.map(k => ninePt(k % 9, R, rot)), vp); }
    if (tp > 0){ g.strokeStyle = `rgba(200,225,255,${0.75 * aC})`; g.lineWidth = 1.4; strokePath(TRIAD.map(k => ninePt(k % 9, R, rot)), tp); }
    if (vp > 0){
      g.font = FONT(max(11, R * 0.075), 'fell'); g.textAlign = 'center'; g.textBaseline = 'middle';
      NINE.forEach(k => { const [px, py] = ninePt(k, R, rot), [lx, ly] = ninePt(k, R * 0.9, rot), on = k % 3 === 0;
        g.fillStyle = on ? `rgba(220,235,255,${0.95 * aC * vp})` : `rgba(255,230,170,${0.8 * aC * vp})`; g.beginPath(); g.arc(px, py, on ? 3.2 : 2.4, 0, TAU); g.fill();

    }
  }
  const ry = ease((rel - 11) / 5), aY = f('rays');
  if (ry > 0 && aY > 0.003){ for (let i = 0; i < 27; i++){ const q = PI / 2 + (i - 13) * 0.032, L = R * (0.62 + 0.3 * ry); g.strokeStyle = `rgba(255,236,200,${0.16 * aY * ry * (1 - Math.abs(i - 13) / 16)})`; g.lineWidth = 0.7;

    g.fillStyle = `rgba(255,232,180,${0.9 * aP * pd})`; g.beginPath(); g.arc(bx, by, R * 0.028, 0, TAU); g.fill(); glow(bx, by, R * 0.12, '255,220,150', 0.35 * aP * pd);

  g.restore();

  const op = ease((rel - 7) / 2.4) * (1 - 0.92 * bump(clamp((rel - 31) / 0.45))), aE = f('eye');

    const lk = F.look || { x: sin(t * 0.23) * 0.27 * (1 - ease((rel - 20) / 6)), y: 0 };
    const ex = F.ex ?? x, ey = F.ey ?? y, eR = F.eR ?? R;
    g.save(); drawEye(ex, ey, eR, aE, t, { open: op, look: lk, irisSnow: F.snow || 0, pupil: 0.3 + 0.5 * (sp || 0) + (F.pupil || 0), halo: F.halo ?? 1, guides: F.guides ?? 0 }); g.restore();
  }
}

/* ─────────────── THE EYE (Opus Keter) ───────────────
   drawEye(x, y, R, a, t, opts): the almond eye of the Aeon, inked in gold.
   R is drawAll's R: half-width R*0.36, iris radius R*0.13.
   opts = { open, look:{x,y}, irisSnow, pupil, halo, guides } */

const EY_TEX = new Map();          // static iris texture, keyed by pixel radius bucket
let EY_GEO = null;                 // fibres + crystal geometry in iris units, keyed by CRYSTAL
const EY_K = 0.93;                 // snowflake arm length, in iris radii
const EY_FALLBACK = { segs:[{ x1:0, y1:0, x2:1, y2:0, o:0, w:2.4, main:true }, { x1:0.4, y1:0, x2:0.62, y2:0.38, o:0.4, w:1.6 }, { x1:0.7, y1:0, x2:0.82, y2:0.2, o:0.7, w:1.6 }], plates:[{ x:0.55, r:0.05, o:0.55 }] };

function EY_seed(){ return (typeof SEED === 'number' ? SEED : 0x51ed) ^ 0x0e7e; }

/* the static engraving of the iris: gradient, fine fibres, crypts, collarette, furrows, limbal ring */
function EY_texture(Tr){
  let c = EY_TEX.get(Tr); if (c) return c;
  if (EY_TEX.size > 3) EY_TEX.clear();
  const N = Tr * 2 + 4; c = document.createElement('canvas'); c.width = c.height = N;
  const q = c.getContext('2d'), r = mulberry32(EY_seed()), u = Tr;
  q.translate(N / 2, N / 2);

  let gr = q.createRadialGradient(0, 0, u * 0.3, 0, 0, u);
  gr.addColorStop(0, 'rgb(150,214,250)'); gr.addColorStop(0.2, 'rgb(104,170,240)'); gr.addColorStop(0.46, 'rgb(72,104,212)');
  gr.addColorStop(0.64, 'rgb(98,108,184)'); gr.addColorStop(0.79, 'rgb(190,160,128)'); gr.addColorStop(0.89, 'rgb(240,198,116)'); gr.addColorStop(1, 'rgb(196,148,78)');
  q.fillStyle = gr; q.beginPath(); q.arc(0, 0, u, 0, TAU); q.fill();
  q.lineCap = 'round';
  // fine fibres: a light and a dark set, so the stroma has depth
  const fib = (n, ra0, ra1, rb0, rb1, col, a0, a1, lw) => {
    for (let i = 0; i < n; i++){
      const th = r() * TAU, ra = lerp(ra0, ra1, r()), rb = lerp(rb0, rb1, r()), bend = (r() - 0.5) * 0.09, rm = (ra + rb) / 2;
      q.strokeStyle = `rgba(${col},${lerp(a0, a1, r())})`; q.lineWidth = lw * (0.7 + 0.6 * r());
      q.beginPath(); q.moveTo(cos(th) * ra * u, sin(th) * ra * u);
      q.quadraticCurveTo(cos(th + bend) * rm * u, sin(th + bend) * rm * u, cos(th + bend * 0.3) * rb * u, sin(th + bend * 0.3) * rb * u); q.stroke();
    }
  };

  fib(360, 0.3, 0.42, 0.5, 0.6, '226,246,255', 0.08, 0.26, lw);       // pupillary zone, light
  fib(380, 0.55, 0.7, 0.8, 0.97, '12,14,64', 0.10, 0.32, lw * 1.1);   // ciliary zone, dark
  fib(420, 0.55, 0.72, 0.8, 0.97, '255,240,206', 0.07, 0.24, lw);     // ciliary zone, light

    const th = (i + r() * 0.8) / 26 * TAU, r0 = 0.6 + r() * 0.08, len = 0.07 + r() * 0.11, wd = 0.012 + r() * 0.016;
    q.save(); q.rotate(th); q.beginPath(); q.moveTo(r0 * u, 0);
    q.quadraticCurveTo((r0 + len * 0.45) * u, -wd * 2 * u, (r0 + len) * u, 0); q.quadraticCurveTo((r0 + len * 0.45) * u, wd * 2 * u, r0 * u, 0);
    q.fillStyle = `rgba(6,8,40,${0.34 + 0.26 * r()})`; q.fill();
    q.strokeStyle = 'rgba(255,238,200,0.3)'; q.lineWidth = lw * 0.8; q.beginPath(); q.moveTo(r0 * u, 0); q.quadraticCurveTo((r0 + len * 0.45) * u, -wd * 2 * u, (r0 + len) * u, 0); q.stroke();

}

/* the principal fibres (which can reorganise) and the session snowflake, in iris units */
function EY_geometry(){
  const C = (typeof CRYSTAL !== 'undefined' && CRYSTAL) ? CRYSTAL : EY_FALLBACK;
  if (EY_GEO && EY_GEO.C === C) return EY_GEO;
  const r = mulberry32(EY_seed() ^ 0x5f3759df);
  // the snowflake, unfolded into its twelve mirrored sectors
  const cs = [], plates = [];
  for (let k = 0; k < 6; k++){
    const ca = cos(k * PI / 3), sa = sin(k * PI / 3);
    for (const m of [1, -1]) for (const s of C.segs){
      if (s.main && m < 0) continue;
      const y1 = s.y1 * m, y2 = s.y2 * m;
      cs.push({ x1:(s.x1 * ca - y1 * sa) * EY_K, y1:(s.x1 * sa + y1 * ca) * EY_K, x2:(s.x2 * ca - y2 * sa) * EY_K, y2:(s.x2 * sa + y2 * ca) * EY_K, o:s.o, w:s.w, main:!!s.main });
    }
    for (const p of C.plates) if (p.x > 0.36) plates.push({ x:p.x * ca * EY_K, y:p.x * sa * EY_K, r:p.r * EY_K, o:p.o, rot:k * PI / 3 });
  }
  // cut it into short pieces: each piece is where one fibre will come to rest
  let total = 0; for (const s of cs) total += hypot(s.x2 - s.x1, s.y2 - s.y1);
  const pl = max(0.085, total / 250), pieces = [];
  for (const s of cs){
    const L = hypot(s.x2 - s.x1, s.y2 - s.y1), n = max(1, Math.round(L / pl));
    for (let i = 0; i < n; i++){
      const u0 = i / n, u1 = (i + 1) / n, p = { x1:lerp(s.x1, s.x2, u0), y1:lerp(s.y1, s.y2, u0), x2:lerp(s.x1, s.x2, u1), y2:lerp(s.y1, s.y2, u1), o:s.main ? (u0 + u1) / 2 : clamp(s.o + 0.1 + 0.2 * u0), w:s.w };
      p.mr = hypot(p.x1 + p.x2, p.y1 + p.y2) / 2; p.mt = Math.atan2(p.y1 + p.y2, p.x1 + p.x2);
      if (p.mr > 0.3) pieces.push(p);
    }
  }
  // the fibres: a pupillary set and a longer, wavier ciliary set
  const F = [], NF = 372;
  for (let i = 0; i < NF; i++){
    const inner = i % 3 === 0, th = (i + r() * 0.9) / NF * TAU, ra = inner ? 0.32 + r() * 0.06 : 0.5 + r() * 0.14, rb = inner ? 0.5 + r() * 0.08 : 0.84 + r() * 0.11;
    const bend = (r() - 0.5) * (inner ? 0.04 : 0.1), rm = (ra + rb) / 2;
    F.push({ th, rm, x1:cos(th) * ra, y1:sin(th) * ra, cx:cos(th + bend) * rm, cy:sin(th + bend) * rm, x2:cos(th + bend * 0.4) * rb, y2:sin(th + bend * 0.4) * rb, hi:r() < 0.34, p:null, used:false });
  }
  // each piece takes the nearest free fibre, so the reorganisation is local and calm
  pieces.sort((p, q2) => p.o - q2.o);
  const copies = clamp(Math.round(210 / max(1, pieces.length)), 1, 3), all = [];
  for (let c = 0; c < copies; c++) for (const p of pieces){
    if (!c){ all.push(p); continue; }
    // further fibres land beside the first, like the barbs of an engraved line
    const L = hypot(p.x2 - p.x1, p.y2 - p.y1) || 1, nx = -(p.y2 - p.y1) / L, ny = (p.x2 - p.x1) / L, j = (c === 1 ? 1 : -1) * (0.007 + 0.008 * r()), k = (r() - 0.5) * 0.012;
    all.push({ x1:p.x1 + nx * j, y1:p.y1 + ny * j, x2:p.x2 + nx * (j + k), y2:p.y2 + ny * (j + k), o:p.o + 0.04 * c, w:p.w, mr:p.mr, mt:p.mt });
  }
  for (const p of all){
    let best = null, bd = 1e9;
    for (const f of F){ if (f.used) continue; let d = Math.abs(f.th - (p.mt < 0 ? p.mt + TAU : p.mt)); if (d > PI) d = TAU - d; d += 0.35 * Math.abs(f.rm - p.mr); if (d < bd){ bd = d; best = f; } }
    if (!best || bd > 0.7) continue;
    best.used = true;
    // keep the fibre pointing outward when it lands
    const flip = hypot(p.x1, p.y1) > hypot(p.x2, p.y2);
    best.p = flip ? { x1:p.x2, y1:p.y2, x2:p.x1, y2:p.y1, o:p.o } : p;
  }
  // the fibres left over become faint vanes parallel to the branches: the six-fold habit, as hatching
  for (const f of F){
    if (f.p) continue;
    const ak = Math.round(f.th / (PI / 3)) * (PI / 3), dl = f.th - ak, ad = Math.abs(dl);
    if (ad < 0.07) continue;
    const m = dl < 0 ? -1 : 1, sv = f.rm * sin(ad) / sin(PI / 3), rho = f.rm * cos(ad) - sv * 0.5, da = ak + m * PI / 3;
    const s0 = max(0, sv - 0.075 - 0.05 * r()), s1 = sv + 0.05 + 0.04 * r();
    const X = s => rho * cos(ak) + s * cos(da), Y = s => rho * sin(ak) + s * sin(da);
    if (hypot(X(s1), Y(s1)) > 0.95 || rho < 0.2) continue;
    f.v = { x1:X(s0), y1:Y(s0), x2:X(s1), y2:Y(s1), o:f.rm };
  }
  EY_GEO = { C, cs, plates, F, free:F.filter(f => !f.p), bound:F.filter(f => f.p) };
  return EY_GEO;
}

function EY_lid(ew, cu, cl){ g.beginPath(); g.moveTo(-ew, 0); g.quadraticCurveTo(0, cu, ew, 0); g.quadraticCurveTo(0, cl, -ew, 0); g.closePath(); }

function drawEye(x, y, R, a, t, opts){
  opts = opts || {};

  const op = clamp(opts.open ?? 1), snow = clamp(opts.irisSnow ?? 0), pb = clamp(opts.pupil ?? 0.3), halo = clamp(opts.halo ?? 1), guides = clamp(opts.guides ?? 1);
  const lk = opts.look || {}, lkx = clamp(lk.x || 0, -1, 1), lky = clamp(lk.y || 0, -1, 1);
  const ew = R * 0.36, eh0 = R * 0.2, ir = R * 0.13, pu = ir * (0.35 + 0.1 * pb);
  // the lower lid rises a little; the upper lid comes down to meet it
  const cl = 2 * eh0 * (0.56 + 0.44 * op), cu = lerp(cl, -2 * eh0, op);
  const ix = lkx * ew * 0.3, iy = lky * eh0 * 0.34;
  const GOLD = INK.gold, lwv = clamp(R * 0.0034, 1.15, 2.1), fine = clamp(R * 0.0016, 0.6, 0.95);
  const vis = clamp(op * 6);                         // how much of the globe shows at all
  g.save(); g.translate(x, y); g.globalAlpha = a; g.lineCap = 'round'; g.lineJoin = 'round';

  // the faint blue glow, behind everything so the pupil stays black

  // construction: the axis through the canthi, and the compass arcs that set the almond

    g.globalCompositeOperation = 'source-over'; g.strokeStyle = `rgba(${INK.sepia},${0.2 * guides})`; g.lineWidth = 0.6;
    g.beginPath(); g.moveTo(-ew * 1.5, 0); g.lineTo(-ew * 1.04, 0); g.moveTo(ew * 1.04, 0); g.lineTo(ew * 1.5, 0);
    for (const sd of [-1, 1]){ g.moveTo(sd * ew * 1.5, -R * 0.012); g.lineTo(sd * ew * 1.5, R * 0.012); }
    g.stroke();
    // the two arcs of the vesica, continued a little past each corner
    const d = (ew * ew - eh0 * eh0) / (2 * eh0), rc = d + eh0, a0 = Math.atan2(d, ew);
    g.strokeStyle = `rgba(${INK.sepia},${0.13 * guides})`;
    for (const sd of [-1, 1]){
      g.beginPath(); g.arc(0, sd * d, rc, -sd * PI / 2 - (PI / 2 - a0) - 0.16, -sd * PI / 2 - (PI / 2 - a0) + 0.0); g.stroke();
      g.beginPath(); g.arc(0, sd * d, rc, -sd * PI / 2 + (PI / 2 - a0) - 0.0, -sd * PI / 2 + (PI / 2 - a0) + 0.16); g.stroke();
    }
  }

  // the dark almond

    g.globalCompositeOperation = 'source-over';

    let Tr = 16; while (Tr < ir * dpr && Tr < 1024) Tr = Math.ceil(Tr * 1.42);
    const tex = EY_texture(Tr), rot = t * 0.035;
    g.save(); g.translate(ix, iy); g.scale(1 - 0.07 * lkx * lkx, 1 - 0.05 * lky * lky);
    g.save(); g.rotate(rot);
    const sc = ir / Tr; g.drawImage(tex, -tex.width / 2 * sc, -tex.height / 2 * sc, tex.width * sc, tex.height * sc);
    if (snow > 0){ g.fillStyle = `rgba(5,7,30,${0.3 * ease(snow)})`; g.beginPath(); g.arc(0, 0, ir * 0.985, 0, TAU); g.fill(); }
    g.beginPath(); g.arc(0, 0, ir * 0.975, 0, TAU); g.clip();
    g.globalCompositeOperation = 'lighter';
    const es = ease(snow), stp = ir < 20 ? 3 : ir < 34 ? 2 : 1, flw = clamp(ir * 0.011, 0.5, 1.5);

    // the snowflake itself, grown outward from the pupil, in gold-white
