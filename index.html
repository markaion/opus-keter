<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Opus Keter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Old+Standard+TT:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --gold:#e9cf8a; --emerald:#6fe8bd; --sepia:#b08d57; --ox:#6b1e1e; --text:#efe8d8;
  --soft:rgba(239,232,216,.8); --faint:rgba(239,232,216,.55); --rule:rgba(233,207,138,.26);
  --fell:'IM Fell English', Georgia, serif; --fellsc:'IM Fell English SC', Georgia, serif; --corm:'Cormorant Garamond', Georgia, serif;
  color-scheme:dark;
}
/* Made for true black in every theme. */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#000; } }
:root[data-theme="dark"]{ --bg:#000; }
html[lang="ru"], html[lang="uk"], html[lang="pl"]{ --fell:'Old Standard TT', Georgia, serif; --fellsc:'Old Standard TT', Georgia, serif; }
*,*::before,*::after{ box-sizing:border-box; }
html,body{ margin:0; height:100%; background:var(--bg); color:var(--text); overflow:hidden; }
body{ font-family:var(--corm); -webkit-font-smoothing:antialiased; }
body.idle{ cursor:none; }
#c{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }

/* the engraved plate card at the start of each movement, which then settles as the chapter label */
#card{ position:fixed; left:0; right:0; top:50%; transform:translateY(-50%); text-align:center; pointer-events:none; z-index:3;
  opacity:0; transition:opacity 1.4s ease, top 1.6s ease, transform 1.6s ease; padding:0 1rem; }
#card .frame{ display:inline-block; padding:1.1em 2.2em 1em; border:1px solid rgba(233,207,138,.42); outline:1px solid rgba(233,207,138,.16); outline-offset:5px;
  background:radial-gradient(ellipse at center, rgba(40,30,16,.55), rgba(0,0,0,.2) 70%); transition:padding 1.6s, border-color 1.6s, outline-color 1.6s, background 1.6s; }
#card .tab{ font-family:var(--fellsc); letter-spacing:.22em; font-size:clamp(.8rem,1.4vw,1rem); color:var(--sepia); }
#card .ttl{ font-family:var(--fell); font-style:italic; font-size:clamp(1.5rem,3.6vw,2.5rem); color:var(--gold); margin-top:.25em; transition:font-size 1.6s; }
#card.on{ opacity:1; }
#card.top{ top:calc(env(safe-area-inset-top,0px) + 3.2vh); transform:translateY(0); }
#card.top .frame{ padding:.2em .8em; border-color:transparent; outline-color:transparent; background:none; }
#card.top .ttl{ font-size:clamp(.95rem,1.6vw,1.15rem); font-style:normal; font-family:var(--fellsc); letter-spacing:.08em; }
#card.top .tab{ font-size:.72rem; opacity:.7; }
#card.on.top.dim{ opacity:.34; } #card.top:not(.on){ opacity:0; }

#line{ position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 10vh); transform:translateX(-50%); width:min(88vw,44rem); text-align:center;
  font-size:clamp(1.15rem,2.4vw,1.8rem); line-height:1.45; font-weight:300; opacity:0; filter:blur(7px); transition:opacity 1.2s ease, filter 1.2s ease;
  text-shadow:0 0 14px #000, 0 0 32px #000, 0 0 50px #000; pointer-events:none; z-index:4; }
#line{ text-wrap:balance; }
#line::before{ content:''; position:absolute; inset:-1.6em -3em; z-index:-1; background:radial-gradient(ellipse at center, rgba(0,0,0,.72), rgba(0,0,0,.45) 45%, rgba(0,0,0,0) 72%); pointer-events:none; }
#line.on{ opacity:1; filter:blur(0); }
#line.long{ font-size:clamp(1.02rem,2vw,1.45rem); }
#line.boom{ font-family:var(--fell); font-weight:400; color:#f3e0a8; font-size:clamp(1.25rem,2.8vw,2.1rem); line-height:1.35; bottom:calc(env(safe-area-inset-bottom,0px) + 8vh); }
#line.boom.long{ font-size:clamp(1.08rem,2.2vw,1.6rem); }
body.nosubs #line, body.nosubs #truth{ display:none; }

/* plate notes: the science, marked by the Assay */
#plate{ position:fixed; right:max(2.2vw,14px); top:calc(env(safe-area-inset-top,0px) + 14vh); width:min(300px,28vw); z-index:3; pointer-events:auto;
  font-family:var(--corm); font-size:1.02rem; line-height:1.42; color:var(--soft); opacity:0; transform:translateX(12px); transition:opacity 1s ease, transform 1s ease; }
#plate.on{ opacity:1; transform:none; }
#plate .mk{ display:flex; align-items:center; gap:.45em; font-family:var(--fellsc); letter-spacing:.14em; font-size:.74rem; text-transform:uppercase; margin-bottom:.35em; cursor:help; }
#plate .mk svg{ width:15px; height:15px; flex:none; }
#plate .tx{ border-left:1px solid var(--rule); padding-left:.75em; }
#plate{ background:radial-gradient(ellipse at 40% 50%, rgba(0,0,0,.7), rgba(0,0,0,.35) 60%, rgba(0,0,0,0) 80%); padding:.6em .7em; border-radius:10px; }
#plate svg{ width:15px; height:15px; flex:none; }
#plate .old{ margin-bottom:.5em; color:var(--faint); font-size:.92em; }
#plate .mk2{ display:flex; gap:.45em; align-items:center; font-family:var(--fellsc); letter-spacing:.14em; font-size:.74rem; text-transform:uppercase; margin:.2em 0 .3em; }
#plate .old s{ display:block; text-decoration-color:rgba(192,86,76,.75); text-decoration-thickness:1px; margin-top:.15em; }
#plate.retired .tx{ border-left-color:rgba(160,50,44,.7); }
#plate .why{ display:none; font-size:.86rem; color:var(--faint); margin-top:.4em; padding-left:.85em; font-style:italic; }
#plate.why .why{ display:block; }
body.noplates #plate{ display:none; }
.m-measured{ color:#e9cf8a; } .m-theory{ color:#cfd6e2; } .m-symbol{ color:#9fd8c6; } .m-testimony{ color:#d9946a; } .m-retired{ color:#c0564c; }

#truth::before{ content:''; position:absolute; inset:-2em -3em; z-index:-1; background:radial-gradient(ellipse at center, rgba(0,0,0,.75), rgba(0,0,0,.4) 50%, rgba(0,0,0,0) 75%); pointer-events:none; }
#truth{ text-wrap:balance; }
#truth{ position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 8vh); transform:translateX(-50%); width:min(90vw,40rem); text-align:center;
  opacity:0; filter:blur(8px); transition:opacity 1.6s ease, filter 1.6s ease; text-shadow:0 0 14px #000, 0 0 32px #000; pointer-events:none; z-index:4; }
#truth.on{ opacity:1; filter:blur(0); }
#truth .tn{ font-family:var(--fellsc); color:var(--gold); font-size:clamp(.95rem,1.7vw,1.2rem); margin-bottom:.4em; letter-spacing:.06em; }
#truth .tt{ font-family:var(--fell); font-style:italic; font-size:clamp(1.6rem,4vw,2.7rem); line-height:1.12; margin-bottom:.5em; }
#truth .tb{ font-size:clamp(1rem,1.9vw,1.32rem); line-height:1.55; color:var(--soft); }

/* gate */
.veil{ position:fixed; inset:0; z-index:6; transition:opacity 2.2s ease; }
#gate{ display:grid; grid-template-columns:1fr 1fr; overflow-y:auto; }
#gate .art{ min-height:100vh; }
#gate .gin{ align-self:center; padding:4vh 6vw 4vh 2vw; max-width:40rem; }
#gate.gone{ opacity:0; pointer-events:none; }
h1{ font-family:var(--fell); font-weight:400; font-size:clamp(3rem,7.5vw,5.6rem); line-height:.95; margin:0; color:var(--gold); letter-spacing:.005em; }
.sub{ font-family:var(--fell); font-style:italic; font-size:clamp(1.05rem,1.7vw,1.3rem); color:var(--text); margin:.45em 0 0; }
.epi{ font-family:var(--fell); font-style:italic; font-size:clamp(1.05rem,1.6vw,1.22rem); line-height:1.5; color:var(--gold); margin:1.5em 0 0; padding:1em 0; border-top:1px solid var(--rule); border-bottom:1px solid var(--rule); opacity:.92; }
.desc{ font-size:clamp(1.02rem,1.5vw,1.16rem); line-height:1.55; color:var(--soft); margin:1.1em 0 .6em; }
.legend{ display:flex; flex-wrap:wrap; gap:.35rem 1rem; margin:.4em 0 1.1em; font-family:var(--fellsc); font-size:.74rem; letter-spacing:.12em; text-transform:uppercase; }
.legend span{ display:inline-flex; align-items:center; gap:.38em; }
.legend svg{ width:14px; height:14px; }
.opts{ display:flex; flex-wrap:wrap; gap:.55rem 1.2rem; align-items:center; margin:.2em 0 1.3em; font-size:1.04rem; color:var(--soft); }
.seg{ display:inline-flex; flex-wrap:wrap; border:1px solid rgba(233,207,138,.35); border-radius:14px; overflow:hidden; }
.nv{ display:none; font-style:italic; font-size:.9rem; color:var(--faint); margin:-.6em 0 1.1em; }
body.novox .nv{ display:block; }
body.novox #bVoice{ opacity:.4; }
.seg button{ border:0; border-radius:0; padding:.32em .95em; font-size:.95rem; }
.seg button.on{ background:rgba(233,207,138,.16); color:#fff3d0; }
label{ display:inline-flex; gap:.5em; align-items:center; cursor:pointer; }
input[type=checkbox]{ accent-color:#e9cf8a; width:1.05em; height:1.05em; }
.intent{ font-family:var(--fell); font-style:italic; font-size:1rem; color:var(--faint); margin:1.1em 0 0; line-height:1.5; }
.intent b{ font-family:var(--fellsc); font-style:normal; font-weight:400; color:var(--sepia); letter-spacing:.1em; margin-right:.4em; }
.small{ font-size:.96rem; color:var(--faint); margin-top:1em; line-height:1.55; }
.small a, .lnk{ color:var(--gold); background:none; border:0; padding:0; font:inherit; text-decoration:underline; text-underline-offset:3px; cursor:pointer; letter-spacing:0; }
button{ font-family:var(--fellsc); font-size:1.12rem; letter-spacing:.05em; background:transparent; color:var(--gold); border:1px solid rgba(233,207,138,.5); border-radius:999px;
  padding:.65em 2em; cursor:pointer; transition:background .4s, box-shadow .4s; }
button:hover{ background:rgba(233,207,138,.08); box-shadow:0 0 30px rgba(233,207,138,.18); }
button:focus-visible{ outline:2px solid var(--emerald); outline-offset:4px; }
#enter{ font-size:1.25rem; padding:.7em 2.6em; }
@media (max-width:900px){
  #gate{ grid-template-columns:1fr; grid-template-rows:46vh auto; }
  #gate .art{ min-height:46vh; }
  #gate .gin{ padding:1vh 7vw 6vh; margin:0 auto; }
  h1{ font-size:clamp(2.6rem,12vw,3.6rem); }
}

/* the closing page sits low, so the eye stays visible above it */
#end{ display:flex; align-items:flex-end; justify-content:center; text-align:center; padding:0 1.5rem calc(env(safe-area-inset-bottom,0px) + 7vh); opacity:0; pointer-events:none; }
#end.on{ opacity:1; pointer-events:auto; }
#end h2{ font-family:var(--fell); font-weight:400; font-style:italic; font-size:clamp(2rem,5vw,3rem); margin:0 0 .2em; color:var(--gold); }
#end .desc{ margin:.5em auto; max-width:34rem; }
#end .row{ display:flex; gap:.8rem; justify-content:center; flex-wrap:wrap; margin-top:1em; }

/* controls, with the Tree of Life as progress */
#ctl{ position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 1.8vh); transform:translateX(-50%); display:none; gap:.4rem; align-items:center; opacity:0; transition:opacity 1s; z-index:7; }
#ctl.live{ display:flex; } #ctl.show{ opacity:1; }
#ctl button{ font-size:.84rem; padding:.28em .8em; border-color:rgba(233,207,138,.28); }
#ctl button.off{ opacity:.38; }
#tree{ width:44px; height:62px; margin:0 .35rem; cursor:pointer; }
#tree circle{ cursor:pointer; }
#treeTip{ position:fixed; bottom:calc(env(safe-area-inset-bottom,0px) + 9vh); left:50%; transform:translateX(-50%); font-family:var(--fellsc); letter-spacing:.1em; font-size:.8rem; color:var(--gold); opacity:0; transition:opacity .4s; pointer-events:none; z-index:7; text-shadow:0 0 10px #000; }
#treeTip.on{ opacity:.9; }
@media (max-width:480px){ #ctl{ flex-wrap:wrap; justify-content:center; width:calc(100vw - 24px); row-gap:.4rem; } #bFs{ display:none; } }
@media (max-width:620px){ #ctl{ gap:.2rem; } #ctl button{ padding:.28em .5em; font-size:.78rem; } #tree{ width:34px; height:48px; margin:0 .15rem; } #plate{ left:14px; right:14px; width:auto; top:calc(env(safe-area-inset-top,0px) + 9vh); font-size:.92rem; background:rgba(0,0,0,.72); padding:.55em .7em; border-radius:6px; box-shadow:0 0 24px 12px rgba(0,0,0,.6); } }

/* atlas */
#atlas{ position:fixed; inset:0; z-index:9; background:rgba(4,3,2,.97); overflow-y:auto; display:none; }
#atlas.on{ display:block; }
#atlas .in{ max-width:46rem; margin:0 auto; padding:7vh 6vw 10vh; }
#atlas h2{ font-family:var(--fell); font-style:italic; font-weight:400; color:var(--gold); font-size:clamp(2rem,5vw,3rem); margin:0 0 .2em; }
#atlas h3{ font-family:var(--fellsc); letter-spacing:.14em; font-weight:400; color:var(--sepia); font-size:.95rem; margin:2.2em 0 .6em; border-bottom:1px solid var(--rule); padding-bottom:.35em; }
#atlas .it{ display:grid; grid-template-columns:20px 1fr; gap:.2em .7em; margin:.8em 0; font-size:1.02rem; line-height:1.45; color:var(--soft); }
#atlas .it svg{ width:16px; height:16px; margin-top:.25em; }
#atlas .it .q{ font-style:italic; color:var(--faint); font-size:.92rem; }
#atlas .it .o{ color:var(--faint); font-size:.94rem; margin-bottom:.15em; } #atlas .it .o s{ text-decoration-color:rgba(192,86,76,.7); }
#atlas .close{ position:fixed; top:calc(env(safe-area-inset-top,0px) + 2vh); right:3vw; font-size:.9rem; padding:.35em 1em; background:#000; }
#atlas .note{ color:var(--faint); font-size:1rem; line-height:1.55; }
@media (prefers-reduced-motion: reduce){ #line,#truth,#card,#plate{ transition-duration:.5s; } }
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<div id="card" aria-live="polite"><div class="frame"><div class="tab"></div><div class="ttl"></div></div></div>
<div id="line" aria-live="polite"></div>
<div id="truth" aria-live="polite"><div class="tn"></div><div class="tt"></div><div class="tb"></div></div>
<div id="plate" aria-live="polite"><div class="mk"></div><div class="tx"></div><div class="why"></div></div>

<div id="gate" class="veil">
  <div class="art" aria-hidden="true"></div>
  <div class="gin">
    <h1 data-i="title"></h1>
    <p class="sub" data-i="subtitle"></p>
    <p class="epi" data-i="epigraph"></p>
    <p class="desc" data-i="desc"></p>
    <div class="legend" id="legend"></div>
    <div class="opts">
      <span class="seg" role="group" aria-label="Language"><button data-l="en" class="on">English</button><button data-l="uk">Українська</button><button data-l="es">Español</button><button data-l="it">Italiano</button><button data-l="pl">Polski</button><button data-l="ru">Русский</button></span>
      <label><input type="checkbox" id="voiceChk"> <span data-i="voice"></span></label>
      <label><input type="checkbox" id="subsChk" checked> <span data-i="subs"></span></label>
      <label><input type="checkbox" id="platesChk" checked> <span data-i="plates"></span></label>
    </div>
    <p class="nv" data-i="novoice"></p>
    <button id="enter" data-i="enter"></button>
    <p class="intent"><b>Intentio</b><span data-i="intent"></span></p>
    <p class="small"><span data-i="small"></span><br><span data-i="hint"></span><br><button class="lnk" id="atlasLink" data-i="atlas"></button></p>
  </div>
</div>

<div id="end" class="veil">
  <div>
    <h2>Finis</h2>
    <p class="desc" id="endStamp"></p>
    <p class="desc" data-i="endline"></p>
    <div class="row"><button id="again" data-i="again"></button><button id="atlasBtn2" data-i="atlas"></button></div>
  </div>
</div>

<div id="atlas" role="dialog" aria-label="Atlas"><button class="close" id="atlasClose" data-i="close"></button><div class="in" id="atlasIn"></div></div>

<div id="treeTip"></div>
<div id="ctl">
  <button id="bPrev" aria-label="Previous movement">‹</button>
  <button id="bBack" aria-label="Previous line">«</button>
  <button id="bPlay" aria-label="Pause" data-i="pause"></button>
  <button id="bFwd" aria-label="Next line">»</button>
  <button id="bNext" aria-label="Next movement">›</button>
  <svg id="tree" viewBox="-14 -8 28 64" aria-label="Movements"></svg>
  <button id="bLang">RU</button>
  <button id="bVoice" data-i="voiceS"></button>
  <button id="bSubs" data-i="subsS"></button>
  <button id="bPlates" data-i="platesS"></button>
  <button id="bSnd" data-i="sound"></button>
  <button id="bFs" data-i="full"></button>
</div>

<script type="application/json" id="script">{"titles": [{"num": "I", "latin": "LUX INDIVISA", "en": "The Undivided Light and the Prism", "ru": "Неразделённый свет и призма", "uk": "Неподілене світло і призма", "es": "La luz indivisa y el prisma", "it": "La luce indivisa e il prisma", "pl": "Niepodzielone światło i pryzmat"}, {"num": "II", "latin": "CRYSTALLISATIO", "en": "Crystallization", "ru": "Кристаллизация", "uk": "Кристалізація", "es": "Cristalización", "it": "Cristallizzazione", "pl": "Krystalizacja"}, {"num": "III", "latin": "SOLVE ET COAGULA", "en": "Solve et Coagula", "ru": "Solve et Coagula", "uk": "Solve et coagula", "es": "Solve et coagula", "it": "Solve et coagula", "pl": "Solve et coagula"}, {"num": "IV", "latin": "DOMUS NOCTURNA", "en": "The House at Night", "ru": "Дом ночью", "uk": "Дім уночі", "es": "La casa de noche", "it": "La casa di notte", "pl": "Dom nocą"}, {"num": "V", "latin": "SIGNA IN TENEBRIS", "en": "The Signs in the Dark", "ru": "Знаки во тьме", "uk": "Знаки в темряві", "es": "Los signos en la oscuridad", "it": "I segni nel buio", "pl": "Znaki w ciemności"}, {"num": "VI", "latin": "FILUM ARIADNAE", "en": "Ariadne's Thread", "ru": "Нить Ариадны", "uk": "Нитка Аріадни", "es": "El hilo de Ariadna", "it": "Il filo di Arianna", "pl": "Nić Ariadny"}, {"num": "VII", "latin": "DUAE LENTES", "en": "The Two Lenses", "ru": "Две линзы", "uk": "Дві лінзи", "es": "Las dos lentes", "it": "Le due lenti", "pl": "Dwie soczewki"}, {"num": "VIII", "latin": "TRIA PRIMA", "en": "The Three Truths", "ru": "Три истины", "uk": "Три істини", "es": "Las tres verdades", "it": "Le tre verità", "pl": "Trzy prawdy"}, {"num": "IX", "latin": "PROIECTIO", "en": "Projection", "ru": "Проекция", "uk": "Проєкція", "es": "Proyección", "it": "Proiezione", "pl": "Projekcja"}, {"num": "X", "latin": "AEON", "en": "The Aeon", "ru": "Эон", "uk": "Еон", "es": "El Eón", "it": "L'Eone", "pl": "Eon"}], "lines": {"M1": [{"en": "Before the first division, there is only light, and nothing it is not.", "ru": "До первого разделения есть только свет, и нет ничего, что не было бы им.", "plate": {"en": "The oldest light still reaching us left its source about 380,000 years after the beginning: the cosmic microwave background.", "ru": "Древнейший свет, который ещё доходит до нас, отделился примерно через 380 000 лет после начала: реликтовое излучение.", "mark": ["m"], "uk": "Найдавніше світло, що досі доходить до нас, вирушило приблизно через 380 000 років після початку: реліктове мікрохвильове випромінювання.", "es": "La luz más antigua que aún nos alcanza partió de su fuente unos 380 000 años después del comienzo: el fondo cósmico de microondas.", "it": "La luce più antica che ancora ci raggiunge è partita circa 380.000 anni dopo l'inizio: la radiazione cosmica di fondo a microonde.", "pl": "Najstarsze światło, które wciąż do nas dociera, wyruszyło około 380 000 lat po początku: mikrofalowe promieniowanie tła."}, "uk": "Перед першим поділом є лише світло — і нічого, чим воно не є.", "es": "Antes de la primera división solo hay luz, y nada que ella no sea.", "it": "Prima della prima divisione c'è soltanto luce, e nulla che essa non sia.", "pl": "Przed pierwszym podziałem jest tylko światło i nic, czym ono nie jest."}, {"en": "The Kabbalists named this crown Keter. The alchemists called it the One Thing.", "ru": "Каббалисты назвали этот венец Кетер. Алхимики называли его Единой Вещью.", "say_en": "The Kabbalists named this crown, Keh-ter. The alchemists called it the One Thing.", "plate": {"en": "Keter: the first of the ten spheres of the Tree of Life. The One Thing: the Emerald Tablet's name for the source of all.", "ru": "Кетер: первая из десяти сфер Древа Жизни. Единая Вещь: так Изумрудная скрижаль называет источник всего.", "mark": ["s"], "uk": "Кетер — перша з десяти сфер Дерева Життя. Єдина Річ — так Смарагдова скрижаль називає джерело всього.", "es": "Keter: la primera de las diez esferas del Árbol de la Vida. La Cosa Única: el nombre que la Tabla Esmeralda da a la fuente de todo.", "it": "Keter: la prima delle dieci sfere dell'Albero della Vita. La Cosa Unica: il nome che la Tavola di Smeraldo dà alla fonte di tutto.", "pl": "Keter: pierwsza z dziesięciu sefir Drzewa Życia. Jedna Rzecz: tak Szmaragdowa Tablica nazywa źródło wszystkiego."}, "uk": "Каббалісти назвали цей вінець Кетер. Алхіміки називали його Єдиною Річчю.", "es": "Los cabalistas llamaron Keter a esta corona. Los alquimistas la llamaron la Cosa Única.", "it": "I cabalisti chiamarono Keter questa corona. Gli alchimisti la chiamavano la Cosa Unica.", "pl": "Kabaliści nazwali tę koronę Keter. Alchemicy nazywali ją Jedną Rzeczą."}, {"en": "Physics tells it another way. Fields fill all of space, and every particle is a ripple in one of them.", "ru": "Физика рассказывает об этом иначе. Поля заполняют всё пространство, и каждая частица — рябь в одном из них.", "plate": {"en": "Quantum field theory, the framework of the Standard Model: each kind of particle is an excitation of its own field.", "ru": "Квантовая теория поля, основа Стандартной модели: каждый вид частиц — возбуждение своего поля.", "mark": ["m"], "uk": "Квантова теорія поля, основа Стандартної моделі: кожен вид частинок — це збудження власного поля.", "es": "La teoría cuántica de campos, el marco del Modelo Estándar: cada tipo de partícula es una excitación de su propio campo.", "it": "La teoria quantistica dei campi, il quadro del Modello Standard: ogni tipo di particella è un'eccitazione del proprio campo.", "pl": "Kwantowa teoria pola, podstawa Modelu Standardowego: każdy rodzaj cząstki jest wzbudzeniem własnego pola."}, "uk": "Фізика розповідає це інакше. Поля заповнюють увесь простір, і кожна частинка — це брижі в одному з них.", "es": "La física lo cuenta de otro modo. Los campos llenan todo el espacio, y cada partícula es una onda en uno de ellos.", "it": "La fisica lo racconta in un altro modo. I campi riempiono tutto lo spazio, e ogni particella è un'increspatura in uno di essi.", "pl": "Fizyka opowiada to inaczej. Pola wypełniają całą przestrzeń, a każda cząstka jest zmarszczką w jednym z nich."}, {"en": "Send light through two slits, one photon at a time. Each arrives as a single point, yet together they paint a wave's stripes. Find out which slit each one took, and the stripes vanish.", "ru": "Пропусти свет через две щели, по одному фотону. Каждый приходит одной точкой, но вместе они рисуют полосы волны. Узнай, через какую щель прошёл каждый, — и полосы исчезнут.", "plate": {"en": "Single-photon interference. What counts as a measurement is still argued; most physicists hold that any interaction recording the path is enough, and no mind is required.", "ru": "Интерференция одиночных фотонов. Что считать измерением, всё ещё спорят; большинство физиков считает, что достаточно любого взаимодействия, записывающего путь, и сознание не требуется.", "mark": ["m", "t"], "uk": "Однофотонна інтерференція. Що вважати вимірюванням, досі сперечаються; більшість фізиків вважає, що досить будь-якої взаємодії, яка фіксує шлях, і свідомість для цього не потрібна.", "es": "Interferencia de fotones individuales. Qué cuenta como medición aún se discute; la mayoría de los físicos sostiene que basta cualquier interacción que registre el camino, y que no hace falta una mente.", "it": "Interferenza a singolo fotone. Che cosa conti come misura è ancora dibattuto; la maggior parte dei fisici ritiene che basti qualsiasi interazione che registri il percorso, e che non serva una mente.", "pl": "Interferencja pojedynczych fotonów. O to, co liczy się jako pomiar, wciąż się spiera; większość fizyków uważa, że wystarczy każde oddziaływanie rejestrujące drogę, i umysł nie jest potrzebny."}, "uk": "Пропустіть світло крізь дві щілини, по одному фотону. Кожен прибуває однією точкою, але разом вони малюють смуги хвилі. Дізнайтеся, крізь яку щілину пройшов кожен, — і смуги зникають.", "es": "Haz pasar luz por dos rendijas, un fotón cada vez. Cada uno llega como un solo punto, y sin embargo juntos pintan las franjas de una onda. Averigua por qué rendija pasó cada uno, y las franjas desaparecen.", "it": "Fai passare la luce attraverso due fenditure, un fotone alla volta. Ognuno arriva come un singolo punto, eppure insieme dipingono le frange di un'onda. Scopri da quale fenditura è passato ciascuno, e le frange svaniscono.", "pl": "Przepuść światło przez dwie szczeliny, po jednym fotonie. Każdy dociera jako pojedynczy punkt, a jednak razem malują prążki fali. Sprawdź, przez którą szczelinę przeszedł każdy, a prążki znikają."}, {"en": "Everything that follows is this light, looking at itself through narrower and narrower windows.", "ru": "Всё, что дальше, — этот свет, глядящий на себя сквозь всё более узкие окна.", "uk": "Усе, що буде далі, — це те саме світло, яке дивиться на себе крізь дедалі вужчі вікна.", "es": "Todo lo que sigue es esta luz, mirándose a sí misma a través de ventanas cada vez más estrechas.", "it": "Tutto ciò che segue è questa luce, che guarda se stessa attraverso finestre sempre più strette.", "pl": "Wszystko, co nastąpi, to to samo światło, patrzące na siebie przez coraz węższe okna."}, {"en": "One signal. Countless channels.", "ru": "Один сигнал. Бесчисленные каналы.", "plate": {"en": "A second prism cannot split a single colour again: Newton's crucial experiment.", "ru": "Вторая призма уже не делит отдельный цвет: решающий опыт Ньютона.", "mark": ["m"], "uk": "Друга призма не може знову розкласти один колір: вирішальний експеримент Ньютона.", "es": "Un segundo prisma no puede volver a dividir un solo color: el experimento crucial de Newton.", "it": "Un secondo prisma non può scomporre di nuovo un singolo colore: l'esperimento cruciale di Newton.", "pl": "Drugi pryzmat nie rozszczepi ponownie jednej barwy: rozstrzygający eksperyment Newtona."}, "uk": "Один сигнал. Безліч каналів.", "es": "Una señal. Incontables canales.", "it": "Un solo segnale. Innumerevoli canali.", "pl": "Jeden sygnał. Niezliczone kanały."}, {"en": "Each vessel receives a narrow band of it, and calls that band the world.", "ru": "Каждый сосуд принимает узкую полосу и называет эту полосу миром.", "plate": {"en": "Umwelt: each species lives inside its own perceptual world (von Uexküll, 1909). Visible light is a sliver of the electromagnetic spectrum.", "ru": "Умвельт: каждый вид живёт в собственном мире восприятия (фон Икскюль, 1909). Видимый свет — узкая щель в спектре.", "mark": ["m"], "uk": "Умвельт: кожен вид живе у власному світі сприйняття (фон Юкскюль, 1909). Видиме світло — лише вузька скибка електромагнітного спектра.", "es": "Umwelt: cada especie vive dentro de su propio mundo perceptivo (von Uexküll, 1909). La luz visible es una franja mínima del espectro electromagnético.", "it": "Umwelt: ogni specie vive dentro il proprio mondo percettivo (von Uexküll, 1909). La luce visibile è una sottile fetta dello spettro elettromagnetico.", "pl": "Umwelt: każdy gatunek żyje we własnym świecie percepcji (von Uexküll, 1909). Światło widzialne to wąski skrawek widma elektromagnetycznego."}, "uk": "Кожна посудина приймає вузьку смугу і називає цю смугу світом.", "es": "Cada vasija recibe una banda estrecha de ella, y a esa banda la llama el mundo.", "it": "Ogni vaso ne riceve una banda stretta, e chiama quella banda il mondo.", "pl": "Każde naczynie odbiera jego wąskie pasmo i to pasmo nazywa światem."}, {"en": "A bee sees the ultraviolet road painted on a flower. A pit viper feels the warmth of a mouse in the dark. Neither sees all of it.", "ru": "Пчела видит ультрафиолетовую дорожку, нарисованную на цветке. Гремучая змея чувствует тепло мыши в темноте. Ни одна не видит всего.", "plate": {"en": "Bees see ultraviolet nectar guides; pit vipers sense infrared through pit organs in the face.", "ru": "Пчёлы видят ультрафиолетовые метки нектара; гремучие змеи и другие ямкоголовые чувствуют инфракрасное излучение ямками на морде.", "mark": ["m"], "uk": "Бджоли бачать ультрафіолетові нектарні мітки; ямкоголові змії відчувають інфрачервоне ямковими органами на морді.", "es": "Las abejas ven guías de néctar ultravioletas; las víboras de foseta perciben el infrarrojo con los órganos de foseta de la cara.", "it": "Le api vedono le guide al nettare ultraviolette; i crotalini percepiscono l'infrarosso con le fossette sensoriali del muso.", "pl": "Pszczoły widzą ultrafioletowe drogowskazy do nektaru; grzechotniki i inne węże jamkogłowe wyczuwają podczerwień narządami jamkowymi na pysku."}, "uk": "Бджола бачить ультрафіолетову доріжку, намальовану на квітці. Ямкоголова змія відчуває тепло миші в темряві. Жодна не бачить усього.", "es": "Una abeja ve el camino ultravioleta pintado en una flor. Una víbora de foseta siente el calor de un ratón en la oscuridad. Ninguna lo ve todo.", "it": "Un'ape vede la strada ultravioletta dipinta su un fiore. Un crotalino sente il calore di un topo nel buio. Nessuno dei due vede tutto.", "pl": "Pszczoła widzi ultrafioletową drogę namalowaną na kwiecie. Grzechotnik czuje w ciemności ciepło myszy. Żadne z nich nie widzi wszystkiego."}, {"en": "A brain does the same work in reverse. One world goes in, and comes out as a body, a pulse, a mood, a thought, a hunch.", "ru": "Мозг делает ту же работу наоборот. Внутрь входит один мир, а выходит тело, пульс, настроение, мысль, предчувствие.", "plate": {"en": "Fludd's 1619 engraving of the head ties the senses, imagination, reason and memory to worlds of sense, image and intellect.", "ru": "Гравюра Фладда 1619 года связывает чувства, воображение, разум и память с мирами ощущения, образа и интеллекта.", "mark": ["s"], "old": {"en": "The mind's faculties live in the brain's fluid ventricles.", "ru": "Способности ума живут в желудочках мозга.", "uk": "Здібності розуму містяться в заповнених рідиною шлуночках мозку.", "es": "Las facultades de la mente residen en los ventrículos llenos de líquido del cerebro.", "it": "Le facoltà della mente risiedono nei ventricoli del cervello, pieni di liquido.", "pl": "Władze umysłu mieszczą się w wypełnionych płynem komorach mózgu."}, "uk": "Гравюра Фладда 1619 року із зображенням голови пов’язує відчуття, уяву, розум і пам’ять зі світами чуттів, образів та інтелекту.", "es": "El grabado de la cabeza de Fludd, de 1619, une los sentidos, la imaginación, la razón y la memoria a los mundos del sentido, la imagen y el intelecto.", "it": "L'incisione della testa di Fludd, del 1619, lega i sensi, l'immaginazione, la ragione e la memoria ai mondi del senso, dell'immagine e dell'intelletto.", "pl": "Rycina głowy Fludda z 1619 roku łączy zmysły, wyobraźnię, rozum i pamięć ze światami zmysłów, obrazów i intelektu."}, "uk": "Мозок робить ту саму роботу навпаки. Один світ входить і виходить тілом, пульсом, настроєм, думкою, передчуттям.", "es": "Un cerebro hace el mismo trabajo a la inversa. Un solo mundo entra, y sale convertido en un cuerpo, un pulso, un ánimo, un pensamiento, una corazonada.", "it": "Un cervello fa lo stesso lavoro al contrario. Un solo mondo entra, ed esce come un corpo, un battito, un umore, un pensiero, un presentimento.", "pl": "Mózg wykonuje tę samą pracę na odwrót. Jeden świat wchodzi, a wychodzi jako ciało, puls, nastrój, myśl, przeczucie."}, {"en": "Some vessels receive many bands at once: more signal than words were built to carry.", "ru": "Некоторые сосуды принимают много полос сразу: больше сигнала, чем способны вместить слова.", "uk": "Деякі посудини приймають багато смуг одразу: більше сигналу, ніж здатні вмістити слова.", "es": "Algunas vasijas reciben muchas bandas a la vez: más señal de la que las palabras se hicieron para llevar.", "it": "Alcuni vasi ricevono molte bande insieme: più segnale di quanto le parole siano fatte per portarne.", "pl": "Niektóre naczynia odbierają wiele pasm naraz: więcej sygnału, niż słowa potrafią unieść."}, {"en": "That is not a broken receiver. It is a wider aperture, still learning its own tuning.", "ru": "Это не сломанный приёмник. Это более широкая апертура, которая ещё учится собственной настройке.", "plate": {"en": "An image, not a diagnosis.", "ru": "Образ, а не диагноз.", "mark": ["s"], "uk": "Образ, а не діагноз.", "es": "Una imagen, no un diagnóstico.", "it": "Un'immagine, non una diagnosi.", "pl": "Obraz, nie diagnoza."}, "uk": "Це не зламаний приймач. Це ширша апертура, яка ще вчиться власного налаштування.", "es": "Eso no es un receptor roto. Es una apertura más amplia, que aún está aprendiendo su propia sintonía.", "it": "Non è un ricevitore guasto. È un'apertura più ampia, che sta ancora imparando la propria sintonia.", "pl": "To nie jest zepsuty odbiornik. To szersza apertura, która wciąż uczy się własnego strojenia."}, {"en": "The mantis shrimp has twelve kinds of colour receptor, and still tells colours apart worse than we do. More channels are not more sight.", "ru": "У рака-богомола двенадцать видов цветовых рецепторов, и всё же цвета он различает хуже нас. Больше каналов ещё не значит больше зрения.", "plate": {"en": "Mantis shrimp discriminate colours poorly despite 12 photoreceptor types (Thoen and colleagues, 2014). What a nervous system does with its channels matters more than how many it has.", "ru": "Раки-богомолы плохо различают цвета, несмотря на 12 типов фоторецепторов (Тун и коллеги, 2014). Важнее не число каналов, а то, что с ними делает нервная система.", "mark": ["m"], "uk": "Раки-богомоли погано розрізняють кольори, попри 12 типів фоторецепторів (Тоен і колеги, 2014). Важить те, що нервова система робить зі своїми каналами, а не їхня кількість.", "es": "Los camarones mantis distinguen mal los colores pese a tener 12 tipos de fotorreceptor (Thoen y colaboradores, 2014). Importa más lo que un sistema nervioso hace con sus canales que cuántos tiene.", "it": "I gamberi mantide distinguono male i colori nonostante 12 tipi di fotorecettore (Thoen e colleghi, 2014). Conta più ciò che un sistema nervoso fa con i suoi canali che quanti ne ha.", "pl": "Krewetki modliszkowe słabo rozróżniają barwy mimo 12 typów fotoreceptorów (Thoen i współpracownicy, 2014). Liczy się bardziej to, co układ nerwowy robi ze swoimi kanałami, niż ile ich ma."}, "uk": "У рака-богомола дванадцять видів колірних рецепторів, а розрізняє він кольори гірше за нас. Більше каналів — ще не більше зору.", "es": "El camarón mantis tiene doce tipos de receptor del color, y aun así distingue los colores peor que nosotros. Más canales no es más vista.", "it": "Il gambero mantide ha dodici tipi di recettore del colore, eppure distingue i colori peggio di noi. Più canali non significa vedere di più.", "pl": "Krewetka modliszkowa ma dwanaście rodzajów receptorów barwy, a mimo to rozróżnia kolory gorzej od nas. Więcej kanałów to nie więcej widzenia."}, {"en": "Every band arrives at the same gate first: a small, deep relay called the thalamus. Every band but one.", "ru": "Каждая полоса сначала приходит к одним воротам: небольшому глубокому реле, таламусу. Каждая, кроме одной.", "plate": {"en": "Sight, hearing, touch and taste relay through the thalamus on their way to cortex.", "ru": "Зрение, слух, осязание и вкус проходят через таламус на пути к коре.", "mark": ["m"], "uk": "Зір, слух, дотик і смак проходять через таламус на шляху до кори.", "es": "La vista, el oído, el tacto y el gusto pasan por el tálamo de camino a la corteza.", "it": "Vista, udito, tatto e gusto passano per il talamo prima di raggiungere la corteccia.", "pl": "Wzrok, słuch, dotyk i smak przechodzą przez wzgórze w drodze do kory."}, "uk": "Кожна смуга спершу приходить до тих самих воріт: невеликого глибокого реле, що зветься таламусом. Кожна, крім однієї.", "es": "Cada banda llega primero a la misma puerta: un relevo pequeño y profundo llamado tálamo. Cada banda menos una.", "it": "Ogni banda arriva prima alla stessa porta: una piccola stazione profonda chiamata talamo. Ogni banda tranne una.", "pl": "Każde pasmo trafia najpierw do tej samej bramy: małej, głęboko położonej stacji przekaźnikowej zwanej wzgórzem. Każde pasmo oprócz jednego."}, {"en": "Smell takes its own road, straight to the oldest cortex. It is why one scent can return a whole year at once.", "ru": "Запах идёт своей дорогой, прямо к древнейшей коре. Поэтому один аромат может вернуть целый год.", "plate": {"en": "Smell reaches its cortex, and the amygdala, without a thalamic relay first.", "ru": "Запах достигает своей коры и миндалины, минуя таламус.", "mark": ["m"], "uk": "Нюх досягає своєї кори та мигдалеподібного тіла без попереднього перемикання в таламусі.", "es": "El olfato llega a su corteza, y a la amígdala, sin pasar antes por el tálamo.", "it": "L'olfatto raggiunge la sua corteccia, e l'amigdala, senza passare prima per il talamo.", "pl": "Węch dociera do swojej kory i do ciała migdałowatego bez wcześniejszego przełączenia we wzgórzu."}, "uk": "Нюх іде власною дорогою, просто до найдавнішої кори. Тому один запах може повернути цілий рік одразу.", "es": "El olfato toma su propio camino, directo a la corteza más antigua. Por eso un solo aroma puede devolver un año entero de golpe.", "it": "L'olfatto prende la sua strada, dritto alla corteccia più antica. Per questo un solo profumo può restituire un anno intero in un istante.", "pl": "Węch idzie własną drogą, prosto do najstarszej kory. Dlatego jeden zapach potrafi przywrócić cały rok naraz."}, {"en": "At the back of the head, the world arrives upside down and split in half. You have never once seen it that way.", "ru": "В затылке мир приходит перевёрнутым и разделённым надвое. Ни разу он не предстал тебе таким.", "plate": {"en": "The primary visual cortex holds an inverted, divided map of the visual field.", "ru": "Первичная зрительная кора хранит перевёрнутую и разделённую карту поля зрения.", "mark": ["m"], "uk": "Первинна зорова кора містить перевернуту, розділену карту поля зору.", "es": "La corteza visual primaria contiene un mapa invertido y dividido del campo visual.", "it": "La corteccia visiva primaria contiene una mappa capovolta e divisa del campo visivo.", "pl": "Pierwszorzędowa kora wzrokowa zawiera odwróconą, podzieloną mapę pola widzenia."}, "uk": "На потилиці світ прибуває догори дриґом і розрізаним навпіл. Ви жодного разу не бачили його таким.", "es": "En la parte posterior de la cabeza, el mundo llega boca abajo y partido por la mitad. Nunca lo has visto así ni una sola vez.", "it": "Nella parte posteriore della testa, il mondo arriva capovolto e diviso a metà. Non l'hai mai visto così, nemmeno una volta.", "pl": "W tylnej części głowy świat dociera do góry nogami i przecięty na pół. Ani razu nie widziałeś go w ten sposób."}, {"en": "Light enters the eye as wavelength and leaves the cortex as colour. Why it is felt as colour, no one can yet say.", "ru": "Свет входит в глаз как длина волны и выходит из коры как цвет. Почему он ощущается как цвет, пока не может сказать никто.", "plate": {"en": "Where colour is computed is well mapped. Why any of it is felt is the hard problem (Chalmers, 1995).", "ru": "Где вычисляется цвет, хорошо изучено. Почему всё это вообще ощущается — трудная проблема (Чалмерс, 1995).", "mark": ["t"], "uk": "Де обчислюється колір, добре з’ясовано. Чому щось із цього відчувається — це важка проблема свідомості (Чалмерс, 1995).", "es": "Dónde se calcula el color está bien cartografiado. Por qué algo de ello se siente es el problema difícil (Chalmers, 1995).", "it": "Dove il colore venga calcolato è ben mappato. Perché qualcosa di tutto ciò sia sentito è il problema difficile (Chalmers, 1995).", "pl": "Gdzie barwa jest obliczana, dobrze wiadomo. Dlaczego cokolwiek z tego jest odczuwane, to trudny problem świadomości (Chalmers, 1995)."}, "uk": "Світло входить в око як довжина хвилі, а виходить із кори як колір. Чому воно відчувається як колір, ще ніхто не може сказати.", "es": "La luz entra en el ojo como longitud de onda y sale de la corteza como color. Por qué se siente como color, nadie sabe decirlo todavía.", "it": "La luce entra nell'occhio come lunghezza d'onda ed esce dalla corteccia come colore. Perché sia sentita come colore, nessuno sa ancora dirlo.", "pl": "Światło wpada do oka jako długość fali, a opuszcza korę jako barwa. Dlaczego odczuwa się je jako barwę, nikt jeszcze nie umie powiedzieć."}, {"en": "The rainbow is a line. The mind closes it into a ring, inventing a colour no single light contains.", "ru": "Радуга — это линия. Разум замыкает её в кольцо, изобретая цвет, которого нет ни в одном отдельном луче.", "plate": {"en": "Magenta matches no single wavelength; the brain builds it from red and blue together. The ear does the same with pitch at the octave.", "ru": "Пурпурному не соответствует ни одна длина волны; мозг строит его из красного и синего. Слух так же замыкает высоту звука в октаве.", "mark": ["m"], "uk": "Пурпуровому не відповідає жодна окрема довжина хвилі; мозок будує його з червоного й синього разом. Вухо робить те саме з висотою звуку на октаві.", "es": "El magenta no corresponde a ninguna longitud de onda; el cerebro lo construye con el rojo y el azul juntos. El oído hace lo mismo con la altura del sonido en la octava.", "it": "Il magenta non corrisponde a nessuna lunghezza d'onda; il cervello lo costruisce dal rosso e dal blu insieme. L'orecchio fa lo stesso con l'altezza dei suoni all'ottava.", "pl": "Magencie nie odpowiada żadna pojedyncza długość fali; mózg buduje ją z czerwieni i błękitu naraz. Ucho robi to samo z wysokością dźwięku w oktawie."}, "uk": "Веселка — це лінія. Розум замикає її в кільце, вигадуючи колір, якого немає в жодному окремому світлі.", "es": "El arcoíris es una línea. La mente la cierra en un anillo, inventando un color que ninguna luz contiene por sí sola.", "it": "L'arcobaleno è una linea. La mente la chiude in un anello, inventando un colore che nessuna luce singola contiene.", "pl": "Tęcza jest linią. Umysł zamyka ją w pierścień, wymyślając barwę, której nie zawiera żadne pojedyncze światło."}, {"en": "So is the brain the source of the light it sees, or the lens it passes through?", "ru": "Так источник ли мозг того света, что видит, или линза, сквозь которую он проходит?", "plate": {"en": "Production view: experience arises from brain activity (mainstream). Filter view: the brain narrows a wider awareness (William James, 1898; Aldous Huxley, 1954).", "ru": "Продукционная гипотеза: переживание возникает из активности мозга (основное течение). Фильтрационная гипотеза: мозг сужает более широкое осознание (Уильям Джеймс, 1898; Олдос Хаксли, 1954).", "mark": ["t", "s"], "uk": "Погляд породження: досвід виникає з активності мозку (основний погляд). Погляд фільтра: мозок звужує ширше усвідомлення (Вільям Джеймс, 1898; Олдос Гакслі, 1954).", "es": "Visión de la producción: la experiencia surge de la actividad cerebral (la corriente principal). Visión del filtro: el cerebro estrecha una conciencia más amplia (William James, 1898; Aldous Huxley, 1954).", "it": "Visione della produzione: l'esperienza nasce dall'attività cerebrale (la posizione prevalente). Visione del filtro: il cervello restringe una consapevolezza più ampia (William James, 1898; Aldous Huxley, 1954).", "pl": "Pogląd wytwarzania: doświadczenie powstaje z aktywności mózgu (główny nurt). Pogląd filtra: mózg zawęża szerszą świadomość (William James, 1898; Aldous Huxley, 1954)."}, "uk": "То мозок — джерело світла, яке він бачить, чи лінза, крізь яку воно проходить?", "es": "Entonces, ¿es el cerebro la fuente de la luz que ve, o la lente por la que pasa?", "it": "Allora il cervello è la fonte della luce che vede, o la lente attraverso cui essa passa?", "pl": "Czy zatem mózg jest źródłem światła, które widzi, czy soczewką, przez którą ono przechodzi?"}, {"en": "Some people brought back from the edge of death describe the same thing: the body somewhere below, and themselves still there, still looking.", "ru": "Некоторые люди, вернувшиеся с края смерти, описывают одно и то же: тело где-то внизу, а сами они всё ещё здесь и всё ещё смотрят.", "plate": {"en": "In a Dutch study of 344 cardiac-arrest survivors, 18% reported a near-death experience, and about a quarter of those described leaving the body (van Lommel, 2001). Stimulating the temporoparietal junction can produce that feeling (Blanke, 2002). No study has yet confirmed sight of a hidden target.", "ru": "В голландском исследовании 344 переживших остановку сердца 18% сообщили о переживании на пороге смерти, и около четверти из них описали выход из тела (ван Ломмель, 2001). Стимуляция височно-теменного стыка может вызвать это ощущение (Бланке, 2002). Ни одно исследование пока не подтвердило, что скрытая мишень была увидена.", "mark": ["m", "w"], "uk": "У нідерландському дослідженні 344 людей, що пережили зупинку серця, 18% повідомили про передсмертний досвід, і приблизно чверть із них описували вихід із тіла (ван Ломмель, 2001). Стимуляція скронево-тім’яного вузла може викликати таке відчуття (Бланке, 2002). Жодне дослідження поки не підтвердило, що хтось побачив прихований об’єкт.", "es": "En un estudio neerlandés de 344 supervivientes de paro cardíaco, el 18 % relató una experiencia cercana a la muerte, y cerca de una cuarta parte de ellos describió salir del cuerpo (van Lommel, 2001). Estimular la unión temporoparietal puede producir esa sensación (Blanke, 2002). Ningún estudio ha confirmado aún la visión de un objetivo oculto.", "it": "In uno studio olandese su 344 sopravvissuti all'arresto cardiaco, il 18% ha riferito un'esperienza di pre-morte, e circa un quarto di loro ha descritto l'uscita dal corpo (van Lommel, 2001). Stimolare la giunzione temporo-parietale può produrre questa sensazione (Blanke, 2002). Nessuno studio ha ancora confermato la visione di un bersaglio nascosto.", "pl": "W holenderskim badaniu 344 osób, które przeżyły zatrzymanie krążenia, 18% opisało doświadczenie bliskie śmierci, a około jednej czwartej z nich opuszczenie ciała (van Lommel, 2001). Stymulacja złącza skroniowo-ciemieniowego może wywołać takie wrażenie (Blanke, 2002). Żadne badanie nie potwierdziło dotąd zobaczenia ukrytego celu."}, "uk": "Дехто з тих, кого повернули з межі смерті, описує одне й те саме: тіло десь унизу, а вони самі досі тут і досі дивляться.", "es": "Algunas personas traídas de vuelta desde el borde de la muerte describen lo mismo: el cuerpo en algún lugar abajo, y ellas mismas todavía ahí, todavía mirando.", "it": "Alcune persone riportate indietro dal limite della morte descrivono la stessa cosa: il corpo da qualche parte sotto, e loro stesse ancora lì, ancora a guardare.", "pl": "Niektórzy z tych, których przywrócono z krawędzi śmierci, opisują to samo: ciało gdzieś w dole, a siebie wciąż tam, wciąż patrzących."}, {"en": "Either way, it arrives here: one point behind the eyes that calls itself I.", "ru": "Так или иначе, он приходит сюда: в одну точку за глазами, которая называет себя «я».", "uk": "Хай там як, воно приходить сюди: одна точка за очима, що називає себе «я».", "es": "De un modo u otro, llega aquí: un punto detrás de los ojos que se llama a sí mismo yo.", "it": "In ogni caso, arriva qui: un punto dietro gli occhi che chiama se stesso io.", "pl": "Tak czy inaczej, dociera tutaj: do jednego punktu za oczami, który nazywa siebie ja."}], "M2": [{"en": "Then the world speaks into the vessel: names, rules, fears, hopes.", "ru": "Затем мир говорит в сосуд: имена, правила, страхи, надежды.", "uk": "Тоді світ промовляє в посудину: імена, правила, страхи, надії.", "es": "Entonces el mundo habla dentro de la vasija: nombres, reglas, miedos, esperanzas.", "it": "Poi il mondo parla dentro il vaso: nomi, regole, paure, speranze.", "pl": "Potem świat mówi do naczynia: imiona, zasady, lęki, nadzieje."}, {"en": "Each word freezes into structure. The self crystallizes.", "ru": "Каждое слово застывает в структуру. Личность кристаллизуется.", "plate": {"en": "Repeated signals strengthen the connections that carry them: cells that fire together wire together (after Hebb, 1949).", "ru": "Повторяющиеся сигналы укрепляют связи, которые их несут: клетки, что возбуждаются вместе, связываются вместе (по Хеббу, 1949).", "mark": ["m"], "uk": "Повторювані сигнали зміцнюють зв’язки, які їх передають: клітини, що збуджуються разом, з’єднуються разом (за Гебом, 1949).", "es": "Las señales repetidas refuerzan las conexiones que las transmiten: las células que se activan juntas se conectan juntas (a partir de Hebb, 1949).", "it": "I segnali ripetuti rafforzano le connessioni che li trasportano: le cellule che si attivano insieme si collegano insieme (da Hebb, 1949).", "pl": "Powtarzane sygnały wzmacniają połączenia, które je przenoszą: komórki, które pobudzają się razem, łączą się razem (za Hebbem, 1949)."}, "uk": "Кожне слово замерзає в структуру. «Я» кристалізується.", "es": "Cada palabra se congela en estructura. El yo se cristaliza.", "it": "Ogni parola si congela in struttura. L'io si cristallizza.", "pl": "Każde słowo zamarza w strukturę. Ja się krystalizuje."}, {"en": "A snowflake's arms record every moment of its fall: each change of cold, each breath of damp.", "ru": "Лучи снежинки хранят каждое мгновение её падения: каждую перемену холода, каждое дыхание влаги.", "plate": {"en": "Snow crystal shape follows the temperature and humidity met during growth (Nakaya's diagram).", "ru": "Форма снежного кристалла следует температуре и влажности, встреченным при росте (диаграмма Накая).", "mark": ["m"], "uk": "Форма снігового кристала залежить від температури й вологості під час росту (діаграма Накаї).", "es": "La forma de un cristal de nieve sigue la temperatura y la humedad que encuentra al crecer (el diagrama de Nakaya).", "it": "La forma di un cristallo di neve segue la temperatura e l'umidità incontrate durante la crescita (il diagramma di Nakaya).", "pl": "Kształt kryształu śniegu zależy od temperatury i wilgotności napotkanych podczas wzrostu (diagram Nakai)."}, "uk": "Промені сніжинки записують кожну мить її падіння: кожну зміну холоду, кожен подих вологи.", "es": "Los brazos de un copo de nieve registran cada momento de su caída: cada cambio de frío, cada aliento de humedad.", "it": "I bracci di un fiocco di neve registrano ogni momento della sua caduta: ogni cambio di freddo, ogni respiro di umidità.", "pl": "Ramiona płatka śniegu zapisują każdą chwilę jego spadania: każdą zmianę chłodu, każdy oddech wilgoci."}, {"en": "No two alike. Every one of them beautiful.", "ru": "Нет двух одинаковых. Каждая прекрасна.", "uk": "Жодних двох однакових. І кожна прекрасна.", "es": "No hay dos iguales. Y cada uno de ellos es hermoso.", "it": "Non ce ne sono due uguali. E ognuno è bello.", "pl": "Nie ma dwóch jednakowych. Każdy jest piękny."}, {"en": "But a crystal is only water that has forgotten it can move.", "ru": "Но кристалл — лишь вода, забывшая, что может двигаться.", "plate": {"en": "An image, held as an image.", "ru": "Образ, принятый как образ.", "mark": ["s"], "uk": "Образ, і тримаємо його як образ.", "es": "Una imagen, sostenida como imagen.", "it": "Un'immagine, tenuta come immagine.", "pl": "Obraz, traktowany jako obraz."}, "uk": "Але кристал — це лише вода, яка забула, що може рухатися.", "es": "Pero un cristal es solo agua que ha olvidado que puede moverse.", "it": "Ma un cristallo è soltanto acqua che ha dimenticato di potersi muovere.", "pl": "Ale kryształ to tylko woda, która zapomniała, że może się poruszać."}], "M3": [{"en": "Solve et coagula. Dissolve, and bind again.", "ru": "Solve et coagula. Растворяй и связывай вновь.", "say_en": "Solvay et coagoola. Dissolve, and bind again.", "say_ru": "Сольве эт коагула. Растворяй и связывай вновь.", "plate": {"en": "The alchemists' two operations: dissolve a substance, then fix it in a new form.", "ru": "Две операции алхимиков: растворить вещество, затем закрепить его в новой форме.", "mark": ["s"], "uk": "Дві операції алхіміків: розчинити речовину, а тоді закріпити її в новій формі.", "es": "Las dos operaciones de los alquimistas: disolver una sustancia y después fijarla en una forma nueva.", "it": "Le due operazioni degli alchimisti: sciogliere una sostanza, poi fissarla in una forma nuova.", "pl": "Dwie operacje alchemików: rozpuścić substancję, a potem utrwalić ją w nowej postaci."}, "uk": "Solve et coagula. Розчини — і знову зв’яжи.", "es": "Solve et coagula. Disuelve, y vuelve a unir.", "it": "Solve et coagula. Sciogli, e lega di nuovo.", "pl": "Solve et coagula. Rozpuść i zwiąż na nowo."}, {"en": "Unconditioning does not destroy the crystal. It remembers the water.", "ru": "Освобождение от обусловленности не разрушает кристалл. Оно напоминает ему о воде.", "plate": {"en": "Liquid water holds no lasting memory; its hydrogen bonds re-form in about a trillionth of a second. The line is an image.", "ru": "Жидкая вода не хранит долгой памяти: её водородные связи перестраиваются примерно за триллионную долю секунды. Строка — образ.", "mark": ["m", "s"], "old": {"en": "Water keeps a memory of what was dissolved in it (1988; failed to replicate).", "ru": "Вода помнит то, что в ней растворяли (1988; не подтвердилось).", "uk": "Вода пам’ятає, що в ній було розчинено (1988; не відтворено).", "es": "El agua guarda memoria de lo que se disolvió en ella (1988; no se pudo replicar).", "it": "L'acqua conserva memoria di ciò che vi è stato sciolto (1988; non replicato).", "pl": "Woda pamięta, co było w niej rozpuszczone (1988; nie udało się powtórzyć)."}, "uk": "Рідка вода не зберігає тривалої пам’яті; її водневі зв’язки перебудовуються приблизно за трильйонну частку секунди. Цей рядок — образ.", "es": "El agua líquida no guarda memoria duradera; sus enlaces de hidrógeno se rehacen en una billonésima de segundo. La línea es una imagen.", "it": "L'acqua liquida non conserva una memoria duratura; i suoi legami a idrogeno si riformano in circa un millesimo di miliardesimo di secondo. La frase è un'immagine.", "pl": "Ciekła woda nie przechowuje trwałej pamięci; jej wiązania wodorowe odtwarzają się w około bilionową część sekundy. Ten wers jest obrazem."}, "uk": "Розкондиціювання не руйнує кристал. Воно пригадує воду.", "es": "Descondicionarse no destruye el cristal. Recuerda el agua.", "it": "Decondizionarsi non distrugge il cristallo. Ricorda l'acqua.", "pl": "Oduczanie się nie niszczy kryształu. Przypomina mu wodę."}, {"en": "The brain does this too. Each time a memory is recalled it softens, and is stored again, a little changed.", "ru": "Мозг делает то же самое. Каждый раз, когда воспоминание вызывается, оно размягчается и сохраняется заново, чуть изменённым.", "plate": {"en": "Recalled memories become briefly unstable and must be re-stored (Nader, Schafe and LeDoux, 2000, in rats; growing evidence in people).", "ru": "Вызванные воспоминания ненадолго становятся нестабильными и должны сохраниться заново (Надер, Шейф и Леду, 2000, на крысах; данных о людях всё больше).", "mark": ["m"], "uk": "Пригадані спогади ненадовго стають нестійкими, і їх треба зберегти наново (Надер, Шафе і Леду, 2000, на щурах; у людей докази накопичуються).", "es": "Los recuerdos evocados se vuelven inestables por un tiempo y deben volver a almacenarse (Nader, Schafe y LeDoux, 2000, en ratas; con pruebas crecientes en personas).", "it": "I ricordi richiamati diventano per breve tempo instabili e devono essere riconsolidati (Nader, Schafe e LeDoux, 2000, nei ratti; prove crescenti nelle persone).", "pl": "Przywołane wspomnienia na krótko stają się nietrwałe i muszą zostać ponownie utrwalone (Nader, Schafe i LeDoux, 2000, u szczurów; u ludzi przybywa dowodów)."}, "uk": "Мозок робить те саме. Щоразу, коли спогад пригадують, він м’якне і зберігається знову, трохи змінений.", "es": "El cerebro también lo hace. Cada vez que se evoca un recuerdo, se ablanda y se guarda de nuevo, un poco cambiado.", "it": "Anche il cervello lo fa. Ogni volta che un ricordo viene richiamato si ammorbidisce, e viene salvato di nuovo, un po' cambiato.", "pl": "Mózg też to robi. Za każdym razem, gdy wspomnienie zostaje przywołane, mięknie i zapisuje się na nowo, trochę zmienione."}, {"en": "Suspended in its original substance, the form remains, but it can move again.", "ru": "Взвешенная в своей исходной субстанции, форма остаётся, но снова может двигаться.", "plate": {"en": "Under psilocybin the default mode network loosens and distant regions connect more (2012; 2014). One model compares it to annealing, where heat lets a rigid metal re-settle (Carhart-Harris and Friston, 2019).", "ru": "Под псилоцибином сеть пассивного режима ослабевает, а далёкие области связываются сильнее (2012; 2014). Одна модель сравнивает это с отжигом, когда нагрев позволяет жёсткому металлу перестроиться (Кархарт-Харрис и Фристон, 2019).", "mark": ["m", "t"], "uk": "Під дією псилоцибіну мережа пасивного режиму послаблюється, а віддалені ділянки з’єднуються більше (2012; 2014). Одна модель порівнює це з відпалом, коли нагрівання дає жорсткому металу перебудуватися (Кархарт-Гарріс і Фрістон, 2019).", "es": "Bajo la psilocibina, la red neuronal por defecto se afloja y regiones distantes se conectan más (2012; 2014). Un modelo lo compara con el recocido, en el que el calor deja que un metal rígido vuelva a asentarse (Carhart-Harris y Friston, 2019).", "it": "Sotto psilocibina la rete di modalità predefinita si allenta e regioni lontane si connettono di più (2012; 2014). Un modello lo paragona alla ricottura, in cui il calore lascia che un metallo rigido si riassesti (Carhart-Harris e Friston, 2019).", "pl": "Pod wpływem psylocybiny sieć domyślna się rozluźnia, a odległe obszary łączą się silniej (2012; 2014). Jeden z modeli porównuje to do wyżarzania, w którym ciepło pozwala sztywnemu metalowi ułożyć się na nowo (Carhart-Harris i Friston, 2019)."}, "uk": "Зависла у своїй первинній речовині, форма лишається, але знову може рухатися.", "es": "Suspendida en su sustancia original, la forma permanece, pero puede volver a moverse.", "it": "Sospesa nella sua sostanza originaria, la forma resta, ma può muoversi di nuovo.", "pl": "Zawieszona w swojej pierwotnej substancji forma trwa, ale znów może się poruszać."}, {"en": "Many are waking this way, each through their own door: an addiction left behind, a grief survived, a veil worn thin.", "ru": "Многие пробуждаются так, каждый через свою дверь: оставленная зависимость, пережитое горе, истончившаяся завеса.", "plate": {"en": "Testimony, not statistics.", "ru": "Свидетельство, а не статистика.", "mark": ["w"], "uk": "Свідчення, а не статистика.", "es": "Testimonio, no estadística.", "it": "Testimonianza, non statistica.", "pl": "Świadectwo, nie statystyka."}, "uk": "Багато хто прокидається так, кожен крізь власні двері: залишена позаду залежність, пережите горе, стоншена завіса.", "es": "Muchos están despertando así, cada uno por su propia puerta: una adicción dejada atrás, un duelo superado, un velo que se adelgaza.", "it": "Molti si stanno svegliando così, ciascuno dalla propria porta: una dipendenza lasciata alle spalle, un lutto attraversato, un velo assottigliato.", "pl": "Wielu budzi się w ten sposób, każdy przez własne drzwi: nałóg zostawiony za sobą, przetrwana żałoba, zasłona, która stała się cienka."}, {"en": "Every story is different. The return is the same.", "ru": "У каждой истории свой путь. Возвращение одно и то же.", "uk": "Кожна історія інша. Повернення — те саме.", "es": "Cada historia es distinta. El regreso es el mismo.", "it": "Ogni storia è diversa. Il ritorno è lo stesso.", "pl": "Każda historia jest inna. Powrót jest ten sam."}], "M4": [{"en": "Picture the self as a house at night.", "ru": "Представь личность как дом ночью.", "plate": {"en": "An image to think with.", "ru": "Образ для размышления.", "mark": ["s"], "uk": "Образ, щоб ним думати.", "es": "Una imagen con la que pensar.", "it": "Un'immagine con cui pensare.", "pl": "Obraz, którym można myśleć."}, "uk": "Уявіть себе як дім уночі.", "es": "Imagina el yo como una casa de noche.", "it": "Immagina il sé come una casa di notte.", "pl": "Wyobraź sobie siebie jako dom nocą."}, {"en": "A few windows are lit. Most of a life is lived in two or three rooms, until they feel like the whole house.", "ru": "Светятся лишь несколько окон. Большая часть жизни проходит в двух-трёх комнатах, пока они не начинают казаться всем домом.", "uk": "Світиться кілька вікон. Більшу частину життя проживають у двох-трьох кімнатах, доки вони не здаються цілим домом.", "es": "Unas pocas ventanas están encendidas. Casi toda una vida se vive en dos o tres habitaciones, hasta que parecen la casa entera.", "it": "Poche finestre sono accese. Quasi tutta una vita si vive in due o tre stanze, finché non sembrano l'intera casa.", "pl": "Świeci się kilka okien. Większość życia upływa w dwóch, trzech pokojach, aż zaczynają wyglądać jak cały dom."}, {"en": "Someone passing sees one window and names what is inside. Someone else sees another. Both are right. Neither has seen the house.", "ru": "Прохожий видит одно окно и называет то, что внутри. Другой видит другое. Оба правы. Ни один не видел дома.", "uk": "Перехожий бачить одне вікно і називає те, що всередині. Інший бачить інше. Обидва мають рацію. Жоден не бачив дому.", "es": "Alguien que pasa ve una ventana y nombra lo que hay dentro. Otro ve otra. Los dos tienen razón. Ninguno ha visto la casa.", "it": "Chi passa vede una finestra e dà un nome a ciò che c'è dentro. Un altro ne vede un'altra. Hanno ragione entrambi. Nessuno dei due ha visto la casa.", "pl": "Przechodzień widzi jedno okno i nazywa to, co w środku. Ktoś inny widzi inne. Obaj mają rację. Żaden nie widział domu."}, {"en": "People are steady in pattern, not in behaviour: if this place, then this self.", "ru": "Люди постоянны в узоре, а не в поведении: если это место, то это «я».", "plate": {"en": "Personality shows as stable situation-by-behaviour signatures (Mischel and Shoda, 1995).", "ru": "Личность проявляется как устойчивые сочетания ситуации и поведения (Мишел и Шода, 1995).", "mark": ["m"], "uk": "Особистість проявляється як стійкі сигнатури «ситуація — поведінка» (Мішел і Шода, 1995).", "es": "La personalidad se muestra como firmas estables de situación y conducta (Mischel y Shoda, 1995).", "it": "La personalità si mostra come firme stabili di situazione e comportamento (Mischel e Shoda, 1995).", "pl": "Osobowość przejawia się jako stałe sygnatury sytuacji i zachowania (Mischel i Shoda, 1995)."}, "uk": "Люди сталі у візерунку, а не в поведінці: якщо це місце, то це «я».", "es": "Las personas son constantes en el patrón, no en la conducta: si este lugar, entonces este yo.", "it": "Le persone sono costanti nello schema, non nel comportamento: se questo luogo, allora questo sé.", "pl": "Ludzie są stali we wzorcu, nie w zachowaniu: jeśli to miejsce, to to ja."}, {"en": "Long pressure can keep one window lit for years, until an adaptation passes for a nature.", "ru": "Долгое давление может годами держать светлым одно окно, пока приспособление не начнёт выдавать себя за природу.", "plate": {"en": "Chronic stress reshapes neurons in the prefrontal cortex and the amygdala (McEwen).", "ru": "Хронический стресс перестраивает нейроны префронтальной коры и миндалины (Макьюэн).", "mark": ["m"], "uk": "Хронічний стрес змінює нейрони префронтальної кори та мигдалеподібного тіла (Мак’юен).", "es": "El estrés crónico remodela las neuronas de la corteza prefrontal y de la amígdala (McEwen).", "it": "Lo stress cronico rimodella i neuroni della corteccia prefrontale e dell'amigdala (McEwen).", "pl": "Przewlekły stres przebudowuje neurony kory przedczołowej i ciała migdałowatego (McEwen)."}, "uk": "Тривалий тиск може роками тримати освітленим одне вікно, доки пристосування не почне здаватися природою.", "es": "Una presión prolongada puede mantener una ventana encendida durante años, hasta que una adaptación pasa por naturaleza.", "it": "Una pressione prolungata può tenere accesa una finestra per anni, finché un adattamento passa per natura.", "pl": "Długotrwały nacisk potrafi latami utrzymywać zapalone jedno okno, aż przystosowanie zaczyna uchodzić za naturę."}, {"en": "Jung once dreamed of a house whose floors went down through the centuries, to a cave beneath the cellar. He took it as a map of the mind.", "ru": "Однажды Юнгу приснился дом, этажи которого уходили вниз сквозь века, к пещере под погребом. Он принял его за карту психики.", "say_en": "Yoong once dreamed of a house whose floors went down through the centuries, to a cave beneath the cellar. He took it as a map of the mind.", "plate": {"en": "Jung's house dream, 1909, told in Memories, Dreams, Reflections.", "ru": "Сон Юнга о доме, 1909 год, рассказан в «Воспоминаниях, сновидениях, размышлениях».", "mark": ["s"], "uk": "Сон Юнга про дім, 1909 рік, розказаний у «Спогадах, сновидіннях, роздумах».", "es": "El sueño de la casa de Jung, de 1909, contado en Recuerdos, sueños, pensamientos.", "it": "Il sogno della casa di Jung, 1909, raccontato in Ricordi, sogni, riflessioni.", "pl": "Sen Junga o domu z 1909 roku, opisany we Wspomnieniach, snach, myślach."}, "uk": "Юнгові якось наснився дім, поверхи якого спускалися крізь століття — до печери під льохом. Він сприйняв це як карту психіки.", "es": "Jung soñó una vez con una casa cuyos pisos descendían a través de los siglos, hasta una cueva bajo el sótano. La tomó como un mapa de la mente.", "it": "Jung sognò una volta una casa i cui piani scendevano attraverso i secoli, fino a una grotta sotto la cantina. La prese come una mappa della psiche.", "pl": "Jungowi przyśnił się kiedyś dom, którego piętra schodziły w dół przez stulecia, aż do jaskini pod piwnicą. Uznał to za mapę psychiki."}, {"en": "Then a stone lifts, and there is a stair.", "ru": "Потом поднимается камень, и под ним лестница.", "plate": {"en": "Brains evolved by reorganising, not by adding floors.", "ru": "Мозг развивался, перестраиваясь, а не надстраивая этажи.", "mark": ["m"], "old": {"en": "The 'three-storey brain': reptile, mammal and human layers stacked in order.", "ru": "«Трёхэтажный мозг»: слои рептилии, млекопитающего и человека один над другим.", "uk": "«Триповерховий мозок»: шари рептилії, ссавця й людини, складені по черзі.", "es": "El «cerebro de tres pisos»: capas de reptil, mamífero y humano apiladas en orden.", "it": "Il «cervello a tre piani»: strati di rettile, mammifero e umano impilati in ordine.", "pl": "„Trzypiętrowy mózg”: warstwy gada, ssaka i człowieka ułożone po kolei."}, "uk": "Мозок еволюціонував, перебудовуючись, а не надбудовуючи поверхи.", "es": "Los cerebros evolucionaron reorganizándose, no añadiendo pisos.", "it": "I cervelli si sono evoluti riorganizzandosi, non aggiungendo piani.", "pl": "Mózgi ewoluowały, przebudowując się, a nie dobudowując piętra."}, "uk": "Тоді піднімається камінь — і там сходи.", "es": "Entonces se levanta una piedra, y hay una escalera.", "it": "Poi una pietra si solleva, e c'è una scala.", "pl": "Wtedy unosi się kamień i są tam schody."}, {"en": "In quantum physics, the instrument belongs to what it measures. Perhaps a person is partly made of who is looking.", "ru": "В квантовой физике прибор — часть того, что он измеряет. Возможно, и человек отчасти состоит из того, кто на него смотрит.", "plate": {"en": "Bohr: the experimental arrangement is part of the phenomenon. The extension to people is an image.", "ru": "Бор: экспериментальная установка — часть явления. Перенос на людей — образ.", "mark": ["t", "s"], "uk": "Бор: експериментальна установка є частиною явища. Перенесення на людей — образ.", "es": "Bohr: el dispositivo experimental es parte del fenómeno. La extensión a las personas es una imagen.", "it": "Bohr: l'apparato sperimentale fa parte del fenomeno. L'estensione alle persone è un'immagine.", "pl": "Bohr: układ doświadczalny jest częścią zjawiska. Przeniesienie na ludzi to obraz."}, "uk": "У квантовій фізиці прилад належить до того, що він вимірює. Можливо, людина почасти складається з того, хто на неї дивиться.", "es": "En la física cuántica, el instrumento forma parte de lo que mide. Quizá una persona esté hecha en parte de quien la mira.", "it": "Nella fisica quantistica, lo strumento appartiene a ciò che misura. Forse una persona è fatta in parte di chi la guarda.", "pl": "W fizyce kwantowej przyrząd należy do tego, co mierzy. Może człowiek jest po części zrobiony z tego, kto na niego patrzy."}, {"en": "Do we uncover who we are, or make it? Remember the memory that softens each time it is recalled. Every finding is also a rebuilding.", "ru": "Мы находим себя или создаём? Вспомни воспоминание, которое размягчается всякий раз, когда к нему возвращаются. Каждая находка — это и перестройка.", "uk": "Ми відкриваємо, хто ми є, чи творимо це? Згадайте спогад, що м’якне щоразу, коли його пригадують. Кожне знаходження — також і перебудова.", "es": "¿Descubrimos quiénes somos, o lo hacemos? Recuerda el recuerdo que se ablanda cada vez que se evoca. Cada hallazgo es también una reconstrucción.", "it": "Scopriamo chi siamo, o lo facciamo? Ricorda il ricordo che si ammorbidisce ogni volta che viene richiamato. Ogni scoperta è anche una ricostruzione.", "pl": "Odkrywamy, kim jesteśmy, czy to tworzymy? Pamiętaj o wspomnieniu, które mięknie przy każdym przywołaniu. Każde odkrycie jest też przebudową."}], "M5": [{"en": "Below the cellar, the stair goes on, into a dark with no candle at all.", "ru": "Ниже погреба лестница продолжается, во тьму, где нет ни одной свечи.", "plate": {"en": "VITRIOL: visit the interior of the earth; by rectifying, you will find the hidden stone. An alchemists' acrostic.", "ru": "VITRIOL: посети недра земли; очищая, найдёшь сокрытый камень. Алхимический акростих.", "mark": ["s"], "uk": "VITRIOL: відвідай нутро землі; очищаючи, знайдеш прихований камінь. Акровірш алхіміків.", "es": "VITRIOL: visita el interior de la tierra; rectificando, hallarás la piedra oculta. Un acróstico de los alquimistas.", "it": "VITRIOL: visita l'interno della terra; rettificando, troverai la pietra nascosta. Un acrostico degli alchimisti.", "pl": "VITRIOL: odwiedź wnętrze ziemi; oczyszczając, znajdziesz ukryty kamień. Akrostych alchemików."}, "uk": "Під льохом сходи тягнуться далі, у темряву, де немає жодної свічки.", "es": "Bajo el sótano, la escalera continúa, hacia una oscuridad sin ninguna vela.", "it": "Sotto la cantina, la scala continua, in un buio senza nessuna candela.", "pl": "Pod piwnicą schody biegną dalej, w ciemność bez żadnej świecy."}, {"en": "In perfect dark the eye still sees. First a drifting grain, then shapes: tunnels, spirals, lattices, webs.", "ru": "В полной темноте глаз всё равно видит. Сначала дрожащее зерно, затем формы: туннели, спирали, решётки, паутины.", "plate": {"en": "Klüver sorted them into four form constants (1926): tunnels and funnels, spirals, lattices, cobwebs.", "ru": "Клювер свёл их к четырём константам формы (1926): туннели и воронки, спирали, решётки, паутины.", "mark": ["m"], "uk": "Клювер розподілив їх на чотири константи форми (1926): тунелі й лійки, спіралі, ґратки, павутиння.", "es": "Klüver las clasificó en cuatro constantes de forma (1926): túneles y embudos, espirales, retículas, telarañas.", "it": "Klüver le ordinò in quattro costanti di forma (1926): tunnel e imbuti, spirali, reticoli, ragnatele.", "pl": "Klüver podzielił je na cztery stałe formy (1926): tunele i leje, spirale, kratownice, pajęczyny."}, "uk": "У цілковитій темряві око все одно бачить. Спершу пливке зерно, тоді форми: тунелі, спіралі, ґратки, павутиння.", "es": "En la oscuridad total el ojo sigue viendo. Primero un grano a la deriva, después formas: túneles, espirales, retículas, telarañas.", "it": "Nel buio perfetto l'occhio vede ancora. Prima una grana che fluttua, poi forme: tunnel, spirali, reticoli, ragnatele.", "pl": "W zupełnej ciemności oko wciąż widzi. Najpierw dryfujące ziarno, potem kształty: tunele, spirale, kratownice, pajęczyny."}, {"en": "They come in darkness, at the edge of sleep, in migraine, in flicker and under certain drugs, in every century and every land. They do not move when the eyes move.", "ru": "Они приходят в темноте, на грани сна, при мигрени, при мерцании и под некоторыми веществами, в каждом веке и в каждой земле. Они не сдвигаются, когда двигаются глаза.", "plate": {"en": "Because they stay put as the eyes move, they are thought to arise in the brain rather than the eye.", "ru": "Поскольку они не смещаются вместе с глазами, считается, что они возникают в мозге, а не в глазу.", "mark": ["m"], "uk": "Оскільки вони лишаються на місці, коли рухаються очі, вважають, що вони виникають у мозку, а не в оці.", "es": "Como no se desplazan cuando los ojos se mueven, se piensa que surgen en el cerebro y no en el ojo.", "it": "Poiché restano ferme quando gli occhi si muovono, si ritiene che nascano nel cervello e non nell'occhio.", "pl": "Ponieważ zostają na miejscu, gdy oczy się poruszają, uważa się, że powstają w mózgu, a nie w oku."}, "uk": "Вони приходять у темряві, на межі сну, під час мігрені, у мерехтінні й під дією деяких речовин, у кожному столітті й у кожному краї. Вони не рухаються, коли рухаються очі.", "es": "Aparecen en la oscuridad, al borde del sueño, en la migraña, con el parpadeo de la luz y bajo ciertas drogas, en todos los siglos y en todas las tierras. No se mueven cuando se mueven los ojos.", "it": "Vengono nel buio, al confine del sonno, nell'emicrania, nella luce intermittente e sotto certe droghe, in ogni secolo e in ogni terra. Non si muovono quando si muovono gli occhi.", "pl": "Przychodzą w ciemności, na granicy snu, w migrenie, w migotaniu światła i pod wpływem niektórych substancji, w każdym stuleciu i w każdym kraju. Nie poruszają się, gdy poruszają się oczy."}, {"en": "Between eye and cortex the picture is unrolled. Rings around the centre of gaze become straight lines. Rays become straight lines the other way. Spirals become diagonals.", "ru": "Между глазом и корой изображение разворачивается. Кольца вокруг центра взгляда становятся прямыми линиями. Лучи становятся прямыми в другую сторону. Спирали становятся диагоналями.", "plate": {"en": "The map from retina to primary visual cortex is close to a complex logarithm, w = log z (Schwartz, 1977).", "ru": "Отображение сетчатки на первичную зрительную кору близко к комплексному логарифму, w = log z (Шварц, 1977).", "mark": ["m"], "uk": "Відображення сітківки на первинну зорову кору близьке до комплексного логарифма, w = log z (Шварц, 1977).", "es": "La correspondencia entre la retina y la corteza visual primaria se aproxima a un logaritmo complejo, w = log z (Schwartz, 1977).", "it": "La mappa dalla retina alla corteccia visiva primaria è vicina a un logaritmo complesso, w = log z (Schwartz, 1977).", "pl": "Odwzorowanie siatkówki na pierwszorzędową korę wzrokową jest bliskie logarytmowi zespolonemu, w = log z (Schwartz, 1977)."}, "uk": "Між оком і корою картину розгортають. Кола навколо центру погляду стають прямими лініями. Промені стають прямими лініями в іншому напрямку. Спіралі стають діагоналями.", "es": "Entre el ojo y la corteza, la imagen se desenrolla. Los anillos alrededor del centro de la mirada se vuelven líneas rectas. Los rayos se vuelven líneas rectas en el otro sentido. Las espirales se vuelven diagonales.", "it": "Tra l'occhio e la corteccia l'immagine viene srotolata. Gli anelli intorno al centro dello sguardo diventano linee rette. I raggi diventano linee rette nell'altro verso. Le spirali diventano diagonali.", "pl": "Między okiem a korą obraz zostaje rozwinięty. Pierścienie wokół środka spojrzenia stają się prostymi liniami. Promienie stają się prostymi liniami w drugą stronę. Spirale stają się przekątnymi."}, {"en": "So when the cortex, left alone, ripples into simple stripes and cells, the mind sees tunnels, spirals and honeycombs. In the dark, the eye looks at the shape of its own cortex.", "ru": "И когда кора, предоставленная себе, покрывается простыми полосами и ячейками, разум видит туннели, спирали и соты. В темноте глаз смотрит на форму собственной коры.", "plate": {"en": "A mathematical model of the visual cortex reproduces all four forms (Ermentrout and Cowan, 1979; Bressloff, Cowan, Golubitsky and colleagues, 2001).", "ru": "Математическая модель зрительной коры воспроизводит все четыре формы (Эрментраут и Коуэн, 1979; Бресслофф, Коуэн, Голубицкий и коллеги, 2001).", "mark": ["m"], "uk": "Математична модель зорової кори відтворює всі чотири форми (Ермантраут і Коуен, 1979; Бресслофф, Коуен, Голубицький і колеги, 2001).", "es": "Un modelo matemático de la corteza visual reproduce las cuatro formas (Ermentrout y Cowan, 1979; Bressloff, Cowan, Golubitsky y colaboradores, 2001).", "it": "Un modello matematico della corteccia visiva riproduce tutte e quattro le forme (Ermentrout e Cowan, 1979; Bressloff, Cowan, Golubitsky e colleghi, 2001).", "pl": "Matematyczny model kory wzrokowej odtwarza wszystkie cztery formy (Ermentrout i Cowan, 1979; Bressloff, Cowan, Golubitsky i współpracownicy, 2001)."}, "uk": "Тож коли кора, полишена сама на себе, брижиться простими смугами й комірками, розум бачить тунелі, спіралі й стільники. У темряві око дивиться на форму власної кори.", "es": "Así que cuando la corteza, a solas, se riza en franjas y celdas simples, la mente ve túneles, espirales y panales. En la oscuridad, el ojo mira la forma de su propia corteza.", "it": "Così, quando la corteccia, lasciata a sé, si increspa in semplici strisce e celle, la mente vede tunnel, spirali e favi. Nel buio, l'occhio guarda la forma della propria corteccia.", "pl": "Więc gdy kora, pozostawiona sama sobie, marszczy się w proste pasy i komórki, umysł widzi tunele, spirale i plastry miodu. W ciemności oko patrzy na kształt własnej kory."}, {"en": "The same signs are pressed into rock on every inhabited continent: dots, grids, zigzags, nested arcs.", "ru": "Те же знаки выбиты в камне на каждом обитаемом континенте: точки, сетки, зигзаги, вложенные дуги.", "plate": {"en": "The oldest known drawing, on a stone flake from Blombos Cave, South Africa, about 73,000 years old, is a crosshatch (Henshilwood and colleagues, 2018). That such signs record altered states (Lewis-Williams and Dowson, 1988) is argued, not settled.", "ru": "Древнейший известный рисунок, на каменном отщепе из пещеры Бломбос в Южной Африке, возрастом около 73 000 лет, — штриховая сетка (Хеншилвуд и коллеги, 2018). Что такие знаки фиксируют изменённые состояния (Льюис-Уильямс и Доусон, 1988), спорно.", "mark": ["m", "t"], "uk": "Найдавніший відомий малюнок, на кам’яному відщепі з печери Бломбос у Південній Африці, віком близько 73 000 років, — це перехресна штриховка (Геншилвуд і колеги, 2018). Те, що такі знаки фіксують змінені стани (Льюїс-Вільямс і Доусон, 1988), — предмет суперечки, а не встановлений факт.", "es": "El dibujo más antiguo que se conoce, en una lasca de piedra de la cueva de Blombos, en Sudáfrica, de unos 73 000 años, es un sombreado cruzado (Henshilwood y colaboradores, 2018). Que esos signos registren estados alterados (Lewis-Williams y Dowson, 1988) se discute, no está resuelto.", "it": "Il disegno più antico che si conosca, su una scheggia di pietra della grotta di Blombos, in Sudafrica, vecchio di circa 73.000 anni, è un tratteggio incrociato (Henshilwood e colleghi, 2018). Che questi segni registrino stati alterati (Lewis-Williams e Dowson, 1988) è dibattuto, non accertato.", "pl": "Najstarszy znany rysunek, na kamiennym odłupku z jaskini Blombos w Republice Południowej Afryki, liczący około 73 000 lat, to kreskowanie krzyżowe (Henshilwood i współpracownicy, 2018). To, że takie znaki zapisują odmienne stany świadomości (Lewis-Williams i Dowson, 1988), jest przedmiotem sporu, a nie ustaleniem."}, "uk": "Ті самі знаки викарбувано на камені на кожному заселеному континенті: крапки, сітки, зиґзаґи, вкладені дуги.", "es": "Los mismos signos están grabados en la roca en todos los continentes habitados: puntos, cuadrículas, zigzags, arcos anidados.", "it": "Gli stessi segni sono impressi nella roccia in ogni continente abitato: punti, griglie, zigzag, archi concentrici.", "pl": "Te same znaki wyryto w skale na każdym zamieszkanym kontynencie: kropki, siatki, zygzaki, zagnieżdżone łuki."}, {"en": "Plato imagined prison
