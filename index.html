      const grw = snow * 1.3;
      for (const pass of [0, 1]){
        for (const wv of [2.4, 1.6, 1]){
          g.beginPath();
          for (const s of geo.cs){ if (s.w !== wv) continue; const f = s.main ? clamp(grw * 1.15) : clamp((grw - s.o) / 0.3); if (f <= 0) continue; g.moveTo(s.x1 * ir, s.y1 * ir); g.lineTo(lerp(s.x1, s.x2, f) * ir, lerp(s.y1, s.y2, f) * ir); }
          if (pass === 0){ g.strokeStyle = `rgba(255,214,150,${0.09 * es})`; g.lineWidth = flw * wv * 2.4; }
          else { g.strokeStyle = `rgba(255,232,186,${0.3 * es})`; g.lineWidth = flw * (0.5 + wv * 0.22); }
          g.stroke();
        }
      }
      g.strokeStyle = `rgba(255,240,208,${0.42 * es})`; g.lineWidth = flw * 0.7;
      for (const p of geo.plates){ const f = clamp((grw - p.o) / 0.25); if (f <= 0) continue; g.save(); g.translate(p.x * ir, p.y * ir); g.rotate(p.rot); hex(0, 0, p.r * ir * f); g.stroke(); g.restore(); }
    }
    // the principal fibres, inked: those with no place in the crystal become its faint hatching
    g.globalCompositeOperation = 'source-over';
    for (const hi of [false, true]){
      g.beginPath();
      for (let i = 0; i < geo.free.length; i += stp){
        const f = geo.free[i]; if (f.hi !== hi) continue; const p = f.v, s = (snow <= 0 || !p) ? 0 : ease(clamp(snow * 1.55 - p.o * 0.55));
        if (s <= 0){ g.moveTo(f.x1 * ir, f.y1 * ir); g.quadraticCurveTo(f.cx * ir, f.cy * ir, f.x2 * ir, f.y2 * ir); continue; }
        g.moveTo(lerp(f.x1, p.x1, s) * ir, lerp(f.y1, p.y1, s) * ir);
        g.quadraticCurveTo(lerp(f.cx, (p.x1 + p.x2) / 2, s) * ir, lerp(f.cy, (p.y1 + p.y2) / 2, s) * ir, lerp(f.x2, p.x2, s) * ir, lerp(f.y2, p.y2, s) * ir);
      }
      g.strokeStyle = `rgba(255,${Math.round(lerp(242, 232, es))},${Math.round(lerp(214, 188, es))},${(hi ? 0.46 : 0.26) * (1 - 0.22 * es)})`; g.lineWidth = flw * (hi ? 0.95 : 0.8); g.stroke();
      // and those that do, travel to it: inner ones first
      g.beginPath();
      for (let i = 0; i < geo.bound.length; i += stp){
        const f = geo.bound[i]; if (f.hi !== hi) continue; const p = f.p, s = snow <= 0 ? 0 : ease(clamp(snow * 1.55 - p.o * 0.55));
        if (s <= 0){ g.moveTo(f.x1 * ir, f.y1 * ir); g.quadraticCurveTo(f.cx * ir, f.cy * ir, f.x2 * ir, f.y2 * ir); continue; }
        g.moveTo(lerp(f.x1, p.x1, s) * ir, lerp(f.y1, p.y1, s) * ir);
        g.quadraticCurveTo(lerp(f.cx, (p.x1 + p.x2) / 2, s) * ir, lerp(f.cy, (p.y1 + p.y2) / 2, s) * ir, lerp(f.x2, p.x2, s) * ir, lerp(f.y2, p.y2, s) * ir);

    g.globalCompositeOperation = 'lighter'; glow(-ir * 0.3, -ir * 0.32, ir * 0.34, '225,238,255', 0.26);

  // the thin outer brow arc
  g.strokeStyle = `rgba(${GOLD},0.32)`; g.lineWidth = clamp(R * 0.002, 0.8, 1.1);
  g.beginPath(); g.moveTo(-ew * 1.25, 0); g.quadraticCurveTo(0, -eh0 * 2.7 * (0.9 + 0.1 * op) - R * 0.04, ew * 1.25, 0); g.stroke();

  g.fillStyle = `rgba(${GOLD},${0.62 * (0.45 + 0.55 * op)})`;

  }

  g.restore();

/* harness demo: opens 0–2 s, gaze settles by 8, blinks at 5, iris becomes the snowflake 8–12 */
function demoEye(t, dt, opts){
  opts = opts || {};

/* Catmull-Rom through points, sampled */
function GA_spline(pts, sub = 10){
  const out = [], n = pts.length;
  for (let i = 0; i < n - 1; i++){
    const p0 = pts[max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[min(n - 1, i + 2)];
    for (let k = 0; k < sub; k++){
      const u = k / sub, u2 = u * u, u3 = u2 * u;
      out.push([
        0.5 * (2 * p1[0] + (p2[0] - p0[0]) * u + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * u2 + (3 * p1[0] - p0[0] - 3 * p2[0] + p3[0]) * u3),
        0.5 * (2 * p1[1] + (p2[1] - p0[1]) * u + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * u2 + (3 * p1[1] - p0[1] - 3 * p2[1] + p3[1]) * u3)]);
    }
  }
  out.push(pts[n - 1].slice()); return out;
}
/* the engraver's hand: a small perpendicular meander along a polyline */
function GA_wobble(poly, amp, wl, ph, taper){
  const out = [], n = poly.length; let arc = 0, total = 0;
  for (let i = 1; i < n; i++) total += hypot(poly[i][0] - poly[i - 1][0], poly[i][1] - poly[i - 1][1]);
  for (let i = 0; i < n; i++){
    const a = poly[max(0, i - 1)], b = poly[min(n - 1, i + 1)];
    if (i) arc += hypot(poly[i][0] - poly[i - 1][0], poly[i][1] - poly[i - 1][1]);
    const dx = b[0] - a[0], dy = b[1] - a[1], L = hypot(dx, dy) || 1;
    const tp = taper ? min(1, min(arc, total - arc) / (wl * 0.6)) : 1;
    const d = amp * tp * (sin(arc / wl * TAU + ph) + 0.45 * sin(arc / wl * TAU * 2.3 + ph * 1.7));
    out.push([poly[i][0] - dy / L * d, poly[i][1] + dx / L * d]);
  }
  return out;
}
/* fill the cortex with evenly spaced secondary folds: streamlines that run beside

    const a = poly[max(0, i - 1)], b = poly[min(poly.length - 1, i + 1)], L = hypot(b[0] - a[0], b[1] - a[1]) || 1;
    const k = floor(poly[i][0] / cell) + ',' + floor(poly[i][1] / cell);

    for (let i = -2; i <= 2; i++) for (let j = -2; j <= 2; j++){ const arr = grid.get((cx + i) + ',' + (cy + j)); if (!arr) continue;
      for (const q of arr){ if (q[4] === skip) continue; const d = hypot(q[0] - x, q[1] - y); if (d < bd){ bd = d; best = q; } } }
    return [bd, best]; };
  const inside = (x, y) => { let c = false; for (let i = 0, j = outline.length - 1; i < outline.length; j = i++){
    const a = outline[i], b = outline[j]; if ((a[1] > y) !== (b[1] > y) && x < (b[0] - a[0]) * (y - a[1]) / (b[1] - a[1]) + a[0]) c = !c; } return c; };

    const x = -1 + 2 * rnd(), y = -0.75 + 1.4 * rnd();

/* the EEG: alpha spindles; on hover, flat, then a gamma burst, then a brighter calm */

/* ═══════════════ Movement IV · THE HOUSE AT NIGHT · DOMUS NOCTURNA ═══════════════

   World units: street at y = 0, y grows downward, house centred on x = 0.                      */
let HO_C = null;
const HO_F = [-18, -128, -233, -328, -423];            /* floor surfaces, ground to attic */

/* ─────────────── small ctx helpers (the lib's helpers are bound to g) ─────────────── */
function HO_st(c, a, lw, rgb){ c.strokeStyle = `rgba(${rgb || INK.gold},${a})`; c.lineWidth = lw * HO_C.u; }

function HO_hat(c, x0, y0, x1, y1, step, ang, rgb, a, lw, rule){

/* cut masonry: outline and diagonal poché */

/* coursed stone, for the old work below ground */
function HO_stone(c, x0, y0, x1, y1, ch, rnd){
  HO_st(c, 0.75, 0.9); HO_box(c, x0, y0, x1, y1); c.stroke(); HO_st(c, 0.4, 0.55, INK.sepia);

function HO_sprite(rgb){
  const C = HO_C; if (C.spr[rgb]) return C.spr[rgb];

/* ─────────────── build: geometry, camera keys, the engraved house ─────────────── */
function HO_build(){

  C.vS = portrait ? { x:-75, y:-105, s:sA * 1.7 } : { x:-30, y:-92, s:sA * 1.45 }; C.vW = { x:0, y:-186, s:sW };

    { x:-min(250, hw - 46), f:1, rgb:HRGB[0], kind:0, tx:-80, ty:-62 },
    { x:-min(345, hw - 13), f:1, rgb:HRGB[5], kind:1, tx:-66, ty:-277 },

  C.hue = [HRGB[0], HRGB[5], HRGB[6]].map(s => s.split(',').map(Number));
  C.rooms = [];
  for (let i = 0; i < 4; i++) for (let sd = 0; sd < 2; sd++) C.rooms.push({ x0:sd ? 34 : -136, x1:sd ? 136 : -34, y0:HO_F[i + 1] + 8, y1:HO_F[i], lx:sd ? 85 : -85, ly:HO_F[i] - 62, rgb:HO_LAMP });
  C.rooms[0].ly = -98; C.rooms[3].lx = 72; C.rooms[3].ly = -171; C.rooms[3].rgb = HO_WARM; C.rooms[4].lx = -86; C.rooms[4].ly = -262;
  C.rooms.push({ x0:-150, x1:150, y0:-584, y1:-423, lx:0, ly:-470, rgb:HO_LAMP });       /* 8 attic */
  C.rooms.push({ x0:-26, x1:26, y0:-423, y1:-18, lx:0, ly:-220, rgb:HO_LAMP });           /* 9 stair hall */

  }

function HO_inCave(x, y, m){ const dx = (x - 10) / (118 * m), dy = (y - 165) / ((y < 165 ? 42 : 40) * m); return dx * dx + dy * dy < 1; }

  for (let i = 1; i < 14; i++){ const u = i / 14; if (u > e) break; const x = lerp(x0, x1, u), y = lerp(y0, y1, u); seg(x - nx, y - ny, x + nx, y + ny); }
}

/* ─────────────── THE TEST: the three-storey brain, retired ─────────────── */
function HO_brain(t, px){
  const C = HO_C, r = HO_r, oa = r(t, 52.9, 53.4) * (1 - r(t, 57.7, 58.3)); if (oa <= 0) return;
  const m = r(t, 53, 53.9) * (1 - r(t, 57.1, 58.1)), M = C.outM, A = C.outH, B = C.outB;
  for (let i = 0; i < 360; i++) M[i] = lerp(A[i], B[i], m);
  const path = () => { g.beginPath(); g.moveTo(M[0], M[1]); for (let i = 2; i < 360; i += 2) g.lineTo(M[i], M[i + 1]); g.closePath(); };
  const U = (x, y) => [C.BX + x * C.BS, C.BY + y * C.BS], bs = C.BS;
  const det = r(t, 53.5, 54.1) * (1 - r(t, 57, 57.5)), cut = r(t, 55.25, 56), fl = m * (1 - cut);
  g.fillStyle = `rgba(0,0,0,${0.6 * oa * m})`; path(); g.fill();
  g.save(); path(); g.clip();
  /* the two "floors" (morphing from real floor lines) */
  if (fl > 0.01){
    g.strokeStyle = `rgba(${INK.gold},${0.45 * fl})`; g.lineWidth = 0.7 * px;
    for (const [yh, yb] of [[HO_F[1], 0.38], [HO_F[3], -0.1]]){ const y = lerp(yh, C.BY + yb * bs, m); seg(-170, y, 170, y); seg(-170, y + lerp(4.2, 2, m), 170, y + lerp(4.2, 2, m)); }
  }
  /* sulci, and the folia of the cerebellum */
  if (det > 0.01){
    g.strokeStyle = `rgba(${INK.sepia},${0.38 * det})`; g.lineWidth = 0.55 * px; g.beginPath();
    const q = (a, b, c, d, e, f) => { const p0 = U(a, b), p1 = U(c, d), p2 = U(e, f); g.moveTo(p0[0], p0[1]); g.quadraticCurveTo(p1[0], p1[1], p2[0], p2[1]); };
    q(-0.56, 0.23, -0.2, 0.2, 0.26, -0.03); q(-0.08, -0.69, 0.06, -0.4, -0.04, -0.08); q(-0.34, -0.65, -0.2, -0.42, -0.3, -0.16); q(0.2, -0.66, 0.3, -0.42, 0.2, -0.2);
    q(-0.7, -0.5, -0.56, -0.3, -0.62, -0.08); q(0.5, -0.56, 0.56, -0.34, 0.46, -0.14); q(0.74, -0.38, 0.72, -0.16, 0.6, 0.02); q(-0.5, 0.32, -0.1, 0.32, 0.3, 0.2); q(-0.88, -0.2, -0.76, -0.06, -0.8, 0.1); q(0.34, 0.0, 0.6, 0.06, 0.84, 0.2);
    for (let i = 0; i < 6; i++) q(0.46, 0.5 + i * 0.02, 0.66, 0.36 + i * 0.055, 0.88, 0.4 + i * 0.045);
    g.stroke();
  }
  /* after the seal: three networks, each running through every former floor */
  const np = r(t, 55.5, 56.9) , na = np > 0 ? (1 - r(t, 57.2, 58)) : 0;
  if (na > 0.01){
    const cols = [INK.gold, INK.ice, INK.bone];
    for (let k = 0; k < 3; k++){
      const N = C.nets[k], ne = N.ed.length; g.strokeStyle = `rgba(${cols[k]},${(k ? 0.4 : 0.55) * na})`; g.lineWidth = 0.5 * px; g.fillStyle = `rgba(${cols[k]},${0.85 * na})`;
      for (let e = 0; e < ne; e++){
        const f = clamp(np * (ne + 4) - e - k * 0.6); if (f <= 0) continue;
        const p0 = U(N.nd[N.ed[e][0]][0], N.nd[N.ed[e][0]][1]), p2 = U(N.nd[N.ed[e][1]][0], N.nd[N.ed[e][1]][1]), dx = p2[0] - p0[0], dy = p2[1] - p0[1], b = N.ed[e][2];
        const cxp = (p0[0] + p2[0]) / 2 - dy * b, cyp = (p0[1] + p2[1]) / 2 + dx * b;
        g.beginPath(); g.moveTo(p0[0], p0[1]);
        for (let i = 1; i <= 14; i++){ const u = i / 14 * f, v = 1 - u; g.lineTo(v * v * p0[0] + 2 * u * v * cxp + u * u * p2[0], v * v * p0[1] + 2 * u * v * cyp + u * u * p2[1]); }
        g.stroke();
        g.beginPath(); g.arc(p0[0], p0[1], 0.6, 0, TAU); g.fill(); if (f >= 1){ g.beginPath(); g.arc(p2[0], p2[1], 0.6, 0, TAU); g.fill(); }
      }
    }
  }
  g.restore();
  g.strokeStyle = `rgba(${INK.gold},${lerp(0.5, 0.58, m) * oa})`; g.lineWidth = 0.85 * px; g.lineJoin = 'round'; path(); g.stroke();
  /* labels (screen space) */
  const la = r(t, 53.55, 54) * (1 - r(t, 56.9, 57.4)); if (la <= 0.01) return;
  const fs = clamp(0.1 * bs * C.s, 9, 13), struck = r(t, 55.2, 55.7), ta = la * (1 - 0.55 * struck);
  const L = [[tx('human', 'человек'), -0.04, -0.4], [tx('mammal', 'млекопитающее'), -0.06, 0.15], [tx('reptile', 'рептилия'), -0.42, 0.8]];
  g.save(); g.setTransform(C.DPR, 0, 0, C.DPR, 0, 0);
  for (let i = 0; i < 3; i++){
    const p = U(L[i][1], L[i][2]), x = HO_sx(p[0]), y = HO_sy(p[1]);
    label(L[i][0], x, y, fs, 0.7 * ta, { fam:'fellsc', ls:0.14 });
    g.font = FONT(fs, 'fellsc'); const w = g.measureText(L[i][0]).width * 1.16 + fs * 0.6;
    if (struck > 0){ g.strokeStyle = `rgba(${INK.oxblood.replace('107,30,30', '170,60,52')},${0.9 * la})`; g.lineWidth = 1.1; seg(x - w / 2, y + 1, x - w / 2 + w * struck, y + 1); }
    if (i === 2){ const e = U(0.2, 0.76); g.strokeStyle = `rgba(${INK.sepia},${0.6 * ta})`; g.lineWidth = 0.7; seg(x + w / 2 + 2, y, HO_sx(e[0]), HO_sy(e[1])); g.beginPath(); g.arc(HO_sx(e[0]), HO_sy(e[1]), 1.6, 0, TAU); g.stroke(); }
  }
  g.restore();
}

/* ─────────────── entry ─────────────── */
function drawHouse(t, dt, opts){
  if (!HO_C || HO_C.W !== W || HO_C.H !== H || HO_C.LANG !== LANG || HO_C.DPR !== DPR) HO_build();
  const C = HO_C, r = HO_r, L = C.L;
  t = clamp(t, 0, 78); HO_cam(t); HO_lights(t);
  const s = C.s, px = C.px = 1 / s;
  g.save(); g.lineCap = 'round'; g.lineJoin = 'round';
  g.translate(C.ax, C.ay); g.scale(s, s); g.translate(-C.cx, -C.cy);

  const rev = lerp(-608, 242, r(t, 2.6, 8.2)), end = C.end, test = C.test;
  const zoomOut = 1 - r(t, 72.6, 74.6);                      /* the plate leaves as the descent begins */

  /* construction lines: axis, floor levels, roof pitch, the compass round the rose */
  const ca = r(t, 2.0, 3.6) * lerp(0.2, 0.07, r(t, 5, 10)) * end * (1 - 0.6 * r(t, 42, 46));
  if (ca > 0.004){
    g.strokeStyle = `rgba(${INK.gold},${ca})`; g.lineWidth = 0.6 * px; g.beginPath();
    g.moveTo(0, -618); g.lineTo(0, -18);
    for (const f of HO_F){ g.moveTo(-178, f); g.lineTo(178, f); g.moveTo(-178, f - 3); g.lineTo(-178, f + 3); g.moveTo(178, f - 3); g.lineTo(178, f + 3); }
    g.moveTo(-196, -400.7); g.lineTo(0, -592); g.lineTo(196, -400.7);
    g.moveTo(40, -486); g.arc(0, -486, 40, 0, TAU);
    g.stroke();
  }

  /* the street */
  const sa = r(t, 7.4, 9) * end * (0.45 + 0.55 * test);
  if (sa > 0.01){
    const xl = C.cx - C.ax / s - 4, xr = C.cx + (W - C.ax) / s + 4;
    g.strokeStyle = `rgba(${INK.sepia},${0.75 * sa})`; g.lineWidth = 0.9 * px; seg(xl, 0, -158, 0); seg(158, 0, xr, 0);
    g.strokeStyle = `rgba(${INK.sepia},${0.3 * sa})`; g.lineWidth = 0.6 * px; g.beginPath();
    for (let i = 0; i < C.cob.length; i += 2){ const x = C.cob[i]; if (x < xl || x > xr) continue; g.moveTo(x, 1.6); g.quadraticCurveTo(x + C.cob[i + 1] * 0.5, 0.4, x + C.cob[i + 1], 1.6); }
    g.stroke();
  }

  /* the plate: dim engraving, then each lit room re-struck in light */
  g.save(); g.beginPath(); g.rect(-400, -640, 800, rev + 640); g.clip();
  const base = 0.42 * end * zoomOut * (0.42 + 0.58 * test) * (1 - 0.22 * C.press);
  HO_blit(C.X0, C.Y0, C.X1, -6, base); HO_blit(C.X0, -6, C.X1, C.Y1, base * 0.36);
  if (rev < 240 && rev > -606){ g.strokeStyle = `rgba(${INK.gold},0.35)`; g.lineWidth = 0.6 * px; seg(-180, rev - 0.5, 180, rev - 0.5); }
  g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 12; i++){
    const l = L[i]; if (l <= 0.012) continue; const q = C.rooms[i];
    HO_blit(q.x0, q.y0, q.x1, q.y1 + (i < 8 ? 1 : 0), min(1, (i > 9 ? 1.15 : 0.72) * l) * zoomOut);
    g.save(); g.beginPath(); if (i === 8){ g.moveTo(-158, -423); g.lineTo(0, -584); g.lineTo(158, -423); g.closePath(); } else g.rect(q.x0, q.y0, q.x1 - q.x0, q.y1 - q.y0); g.clip();
    const fl = i === 3 ? 1 + 0.035 * sin(t * 7.3) + 0.025 * sin(t * 12.1 + 1) : 1;
    if (i < 10){
      g.fillStyle = `rgba(${q.rgb},${0.045 * l})`; g.fillRect(q.x0, q.y0, q.x1 - q.x0, q.y1 - q.y0);
      if (i === 9){ g.fillStyle = `rgba(${q.rgb},${0.05 * l})`; g.fillRect(q.x0, q.y0, 52, 405); }
      else HO_glow(q.lx, q.ly, 96 * fl, q.rgb, (i === 3 ? 0.36 : 0.27) * l);
      if (l > 1) HO_glow(q.lx, q.ly + 20, 120, '255,236,206', (l - 1) * 0.7);
    } else if (i === 10){ g.fillStyle = `rgba(${q.rgb},${0.04 * l})`; g.fillRect(-136, -6, 272, 98); }
    g.restore();
  }
  /* an over-lit window spills into the street */
  if (C.press > 0.01) HO_glow(-100, -66, 150, '255,214,168', 0.22 * C.press * L[0]);
  /* how each watcher's regard colours its part of the house (58 s on) */
  const fan = r(t, 58.6, 62.5) * end;
  if (fan > 0.01) for (let k = 0; k < 3; k++){ const q = C.reg[k]; g.fillStyle = `rgba(${C.pas[k].rgb},${0.085 * fan})`; g.fillRect(q[0], q[1], q[2] - q[0], q[3] - q[1]); }
  /* lamps and the candle */
  if (L[0] > 0.02) HO_glow(-85, -99.5, 9, '255,226,180', 0.75 * min(1, L[0]));
  if (L[4] > 0.02) HO_glow(-86.3, -259, 8, '255,226,180', 0.7 * L[4]);
  if (L[3] > 0.02){
    const fx = 72 + 0.22 * sin(t * 5.1) * sin(t * 1.7), fh = 3.3 * (1 + 0.1 * sin(t * 7.3) + 0.06 * sin(t * 12.1 + 1));
    HO_glow(72, -169.6, 10, '255,214,150', 0.8 * L[3]);
    g.fillStyle = `rgba(255,232,180,${min(1, L[3])})`; g.beginPath(); g.moveTo(72, -168.4); g.quadraticCurveTo(73.25, -169.6, fx, -168.4 - fh); g.quadraticCurveTo(70.75, -169.6, 72, -168.4); g.fill();
  }
  g.globalCompositeOperation = 'source-over';

  /* the figure in its rooms */
  {
    const fa = end * (0.3 + 0.7 * test), h = 50;
    /* study, first visit */
    HO_fig(lerp(45, 53, r(t, 6.6, 9.4)), -128, h, 2, 1, r(t, 6.6, 7.4) * (1 - r(t, 8.9, 9.7)), HO_FIG.join(','), 0.035 * sin(t * 2.4) * (1 - r(t, 9, 9.4)));
    /* hall (red): walks in, stands; stays as an impression; then the one room of the long pressure */
    const xa = lerp(-43, -80, r(t, 10.1, 13)), wa = r(t, 10.6, 11.6) * (1 - 0.75 * r(t, 26, 28.5));
    const aa = r(t, 9.9, 10.7) * lerp(1, 0.34, r(t, 13.4, 14.2) * (1 - r(t, 26, 27.6)));
    HO_fig(xa, -18, h, 0, -1, aa * fa, HO_mix(wa, 0), 0.04 * sin(xa * 0.42) * (1 - r(t, 12.6, 13.1)));
    /* bedroom (blue) */
    const xc = lerp(-43, -66, r(t, 14.6, 17)), wc = r(t, 14.6, 15.4) * (1 - 0.75 * r(t, 26, 28.5));
    const ac = r(t, 14.3, 15.1) * lerp(1, 0.34, r(t, 17.5, 18.3) * (1 - r(t, 26, 27.6))) * (1 - r(t, 33.2, 34.6));
    HO_fig(xc, -233, h, 2, -1, ac * fa, HO_mix(wc, 1), 0.04 * sin(xc * 0.42) * (1 - r(t, 16.6, 17.1)));
    /* study (violet): enters, then sits to the desk */
    const xb = lerp(43, 51, r(t, 18.8, 20.4)), sit = r(t, 20.8, 21.8), wb = r(t, 18.8, 19.6) * (1 - 0.75 * r(t, 26, 28.5)), ab = r(t, 18.5, 19.3) * (1 - r(t, 33.2, 34.6));
    HO_fig(xb, -128, h, 2, 1, ab * (1 - sit) * fa, HO_mix(wb, 2), 0.035 * sin(xb * 0.5) * (1 - r(t, 20, 20.4)));
    HO_fig(54.5, -128, h, 1, 1, ab * sit * fa, HO_mix(wb, 2), 0);
  }
  g.restore();                                               /* end of the reveal clip */

  HO_stair(t, px); HO_trap(t, px);

  /* the rose, and the hexagon of the last movement settling into it */
  HO_rose(r(t, 2.7, 4.4) * end * zoomOut * (0.4 + 0.6 * test) * (0.55 + 0.45 * C.roseL), C.roseL, px);

  /* passers-by and their sight-lines */
  const pa = end * zoomOut * (1 - r(t, 52.7, 53.5) * (1 - r(t, 57.5, 58.5)));
  if (pa > 0.01 && t > 8.4) for (let k = 0; k < 3; k++){
    const P = C.pas[k], a = r(t, 8.6 + k * 0.5, 9.8 + k * 0.5) * pa, h = 48; if (a <= 0.01) continue;
    g.save(); g.translate(P.x, 0); g.scale(P.f * h, h); g.globalAlpha = a;
    HO_figPath(3, 0, P.kind); g.strokeStyle = `rgb(${INK.sepia})`; g.lineWidth = 2.1 * px / h; g.stroke(); g.fillStyle = 'rgb(9,7,5)'; g.fill(); g.restore();
    const ex = P.x + P.f * 0.035 * h, ey = -0.925 * h, d = r(t, 10.2 + k * 0.6, 11.7 + k * 0.6), q = C.reg[k];
    if (d <= 0) continue;
    g.globalCompositeOperation = 'lighter';
    /* the fan: from one window to a whole part of the house */
    let c0 = [P.tx, P.ty], c1 = [P.tx, P.ty];
    if (fan > 0.01){
      let lo = 9, hi = -9, plo, phi;
      for (const cn of P.f > 0 ? [[q[0], q[1]], [q[0], q[3]]] : [[q[2], q[1]], [q[2], q[3]]]){ let an = Math.atan2(cn[1] - ey, (cn[0] - ex) * P.f); if (an < lo){ lo = an; plo = cn; } if (an > hi){ hi = an; phi = cn; } }
      c0 = [lerp(P.tx, plo[0], fan), lerp(P.ty, plo[1], fan)]; c1 = [lerp(P.tx, phi[0], fan), lerp(P.ty, phi[1], fan)];
      g.fillStyle = `rgba(${P.rgb},${0.05 * fan * a})`; g.beginPath(); g.moveTo(ex, ey); g.lineTo(c0[0], c0[1]); g.lineTo(c1[0], c1[1]); g.closePath(); g.fill();
    }
    g.strokeStyle = `rgba(${P.rgb},${0.9 * a})`; g.lineWidth = 1.05 * px;
    seg(ex, ey, lerp(ex, c0[0], d), lerp(ey, c0[1], d)); if (fan > 0.01) seg(ex, ey, c1[0], c1[1]);
    const ra = r(t, 11.4 + k * 0.6, 12.2 + k * 0.6) * (1 - fan) * a;
    if (ra > 0.01){ g.strokeStyle = `rgba(${P.rgb},${0.7 * ra})`; g.beginPath(); g.arc(P.tx, P.ty, 5.5, 0, TAU); g.stroke(); HO_glow(P.tx, P.ty - 8, 26, P.rgb, 0.16 * ra); }
    g.fillStyle = `rgba(${P.rgb},${0.9 * a})`; g.beginPath(); g.arc(ex, ey, 0.9, 0, TAU); g.fill();
    g.globalCompositeOperation = 'source-over';
  }

  HO_brain(t, px);

  /* ── screen-space lettering ── */
  g.restore(); g.save();
  /* the hexagon of the snowflake: shrinks and rises into the rose */
  const ha = 0.24 * (1 - r(t, 3.5, 5.2));
  if (ha > 0.004){
    const m = r(t, 0.35, 3.7);
    g.strokeStyle = `rgba(${INK.ice},${ha})`; g.lineWidth = lerp(1.2, 0.9, m);
    hex(lerp(W / 2, HO_sx(0), m), lerp(H * 0.48, HO_sy(-486), m), lerp(S * 0.3, 23.5 * s, m)); g.stroke();
  }
  /* the centuries of the dream, written down the margin as on a section drawing */
  const da = r(t, 44, 47) * (1 - r(t, 50.2, 52)) + 0.55 * r(t, 62.5, 65) * end;
  if (da > 0.01){
    const xm = HO_sx(170), rows = [[-128, -18, tx('xv c.', 'XV век')], [-6, 100, tx('roman', 'Рим')], [122, 206, tx('before history', 'до истории')], [-233, -128, tx('xviii c.', 'XVIII век')]];
    g.strokeStyle = `rgba(${INK.sepia},${0.5 * da})`; g.lineWidth = 0.7;
    for (const [y0, y1, s2] of rows){
      const a0 = HO_sy(y0), a1 = HO_sy(y1); seg(xm, a0 + 3, xm, a1 - 3); seg(xm - 3, a0 + 3, xm + 3, a0 + 3); seg(xm - 3, a1 - 3, xm + 3, a1 - 3);
      g.save(); g.translate(xm + clamp(S * 0.016, 8, 13), (a0 + a1) / 2); g.rotate(-PI / 2); label(s2, 0, 0, clamp(S * 0.0135, 9.5, 12), 0.8 * da, { fam:'fell', italic:true, rgb:INK.gold, ls:0.12 }); g.restore();
    }
    label(tx('specus', 'specus'), HO_sx(-96), HO_sy(213), clamp(S * 0.011, 8, 10), 0.2 * da, { fam:'fell', italic:true, mirror:true, rgb:INK.sepia });
  }
  /* VITRIOL: on the wall above the first flight, then again far down the stair */
  const v1 = r(t, 52.5, 53.6) * lerp(1, test, 0.7) * (1 - r(t, 72.2, 73.6));
  if (v1 > 0.01) label(tx('VITRIOL', 'VITRIOL'), HO_sx(-68), HO_sy(31), max(6.5, 5.6 * s), 0.8 * v1, { fam:'fellsc', ls:0.34, rgb:INK.sepia });
  const v2 = r(t, 75, 77.3);
  if (v2 > 0.01){
    const fx = -131.4 + HO_NEND * HO_RUN + (C.portrait ? 0.15 * W : 0.17 * W) / C.sEnd, fy = -8 + HO_NEND * HO_RISE - (C.portrait ? 0.25 * H : 0.2 * H) / C.sEnd;
    const fs = min(0.05 * H, 0.068 * W) * s / C.sEnd, x = HO_sx(fx), y = HO_sy(fy);
    label(tx('VITRIOL', 'VITRIOL'), x + 1, y + 1.2, fs, 0.2 * v2, { fam:'fellsc', ls:0.5, rgb:'60,44,24' });
    label(tx('VITRIOL', 'VITRIOL'), x, y, fs, 0.3 * v2, { fam:'fellsc', ls:0.5, rgb:INK.sepia });
    g.strokeStyle = `rgba(${INK.sepia},${0.1 * v2})`; g.lineWidth = 0.8; seg(x - fs * 4.6, y + fs * 1.1, x + fs * 4.6, y + fs * 1.1); seg(x - fs * 3.4, y - fs * 1.15, x + fs * 5.2, y - fs * 1.15);
  }
  /* the seal */
  const wa = r(t, 55, 55.4) * (1 - r(t, 57.3, 58));
  if (wa > 0.01) waxSeal(HO_sx(C.BX + 0.8 * C.BS), HO_sy(C.BY - 0.42 * C.BS), clamp(0.36 * C.BS * s, 30, 46), wa);
  g.restore(); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
}

/* ═══════════════════════════════════════════════════════════════════════
   OPUS KETER · Movement V · SIGNA IN TENEBRIS · "The Signs in the Dark"
   entry: drawSigns(t, dt, opts)   local t 0..98 s   prefix SI_
   Everything is a pure function of t (dt is not used), so holds are safe.
   The retino-cortical map is w = log z; every pattern in the field is the
   true image z = exp(w) of a pattern on the cortex sheet.
   ═══════════════════════════════════════════════════════════════════════ */
let SI_K = null;
const SI_L = 3.5;                         /* cortex spans ln r in [-L, 0]: r from e^-3.5 = 0.03 to 1 */
const SI_SAND = '222,200,160', SI_SMOKE = '196,190,180', SI_FIRE = '255,176,92';
const SI_HEXN = 12;                       /* hexagonal lattice: 12 spots round the circle (2π-periodic) */

function SI_mk(w, h, sc){
  const c = document.createElement('canvas'); c.width = max(1, Math.round(w * sc)); c.height = max(1, Math.round(h * sc));

/* draw the first `p` (0..1) of a polyline, by length */

  for (let i = 1; i < pts.length; i++){ const l = hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); ls.push(l); tot += l; }

/* ─────────────── the signs as geometry (shared by cave paint and Plato's wall) ─────────────── */
function SI_signPts(kind, x, y, s){
  const lines = [], dots = [];
  if (kind === 0){ for (let k = 1; k <= 4; k++){ const p = []; for (let i = 0; i <= 30; i++){ const a = i / 30 * TAU; p.push([x + cos(a) * s * k / 4, y + sin(a) * s * k / 4]); } lines.push(p); } }
  else if (kind === 1){ for (let i = -2; i <= 2; i++){ lines.push([[x + i * s * 0.42 - s * 0.06, y - s], [x + i * s * 0.42 + s * 0.06, y + s]]); lines.push([[x - s, y + i * s * 0.42 + s * 0.05], [x + s, y + i * s * 0.42 - s * 0.05]]); } }
  else if (kind === 2){ for (const r of [-0.34, 0.34]){ const p = []; for (let i = 0; i <= 8; i++) p.push([x - s * 1.3 + i * s * 0.325, y + r * s + (i % 2 ? -1 : 1) * s * 0.26]); lines.push(p); } }
  else if (kind === 3){ for (let j = 0; j < 3; j++) for (let i = 0; i < 6; i++) dots.push([x + (i - 2.5) * s * 0.44 + (j % 2) * s * 0.1, y + (j - 1) * s * 0.46, s * 0.11]); }
  else if (kind === 4){ const p = []; for (let i = 0; i <= 90; i++){ const a = i / 90 * 3.25 * TAU; p.push([x + cos(a) * s * a / (3.25 * TAU), y + sin(a) * s * a / (3.25 * TAU)]); } lines.push(p); }
  else if (kind === 6){ for (let i = 0; i < 8; i++) lines.push([[x + (i - 3.5) * s * 0.3, y - s * 0.4 + (i % 3) * s * 0.05], [x + (i - 3.5) * s * 0.3 + s * 0.06, y + s * 0.4]]); }
  else if (kind === 5){ for (let k = 1; k <= 4; k++){ const p = []; for (let i = 0; i <= 20; i++){ const a = PI + i / 20 * PI; p.push([x + cos(a) * s * k * 0.27, y + s * 0.45 + sin(a) * s * k * 0.27]); } lines.push(p); } }
  return { lines, dots };
}

/* ─────────────── the classical seven-circuit labyrinth, from its seed ───────────────
   Seed on a 5×5 grid (unit u, y down): a cross, an angle in each quadrant, a dot in each corner:
   sixteen ends. Joined in order by arcs struck from five centres (T and the four dots).
   Wall k (0..7) runs from the left end, over the top, to the right end.                */
function SI_labWalls(){
  const T = [0.5, -2], DL = [-2, -2], DR = [2, -2], BR = [2, 2], BL = [-2, 2], walls = [];
  for (let k = 0; k < 8; k++){
    const arcs = [];
    if (k === 7) arcs.push([BL, 1, 0, PI / 2]);
    if (k >= 3) arcs.push([DL, k - 2, PI / 2, PI]);
    arcs.push([T, k + 0.5, PI, TAU]);
    if (k >= 2) arcs.push([DR, k - 1, 0, PI / 2]);
    if (k === 6) arcs.push([BR, 1, PI / 2, PI]);
    if (k === 7) arcs.push([BR, 2, PI / 2, PI]);
    const pts = [];
    for (const [c, r, a0, a1] of arcs){
      const n = max(4, Math.ceil(r * (a1 - a0) / 0.09));
      for (let i = pts.length ? 1 : 0; i <= n; i++){ const a = lerp(a0, a1, i / n); pts.push([c[0] + cos(a) * r, c[1] + sin(a) * r]); }
    }

    let tot = 0; const f = [0]; for (let i = 1; i < pts.length; i++){ tot += hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); f.push(tot); }
    for (let i = 0; i < f.length; i++) f[i] /= tot;
    walls.push({ pts, f });
  }

}
const SI_SEED = { cross: [[[0, -2], [0, 2]], [[-2, 0], [2, 0]]],
  angles: [[[-1, -2], [-1, -1], [-2, -1]], [[1, -2], [1, -1], [2, -1]], [[-1, 2], [-1, 1], [-2, 1]], [[1, 2], [1, 1], [2, 1]]],
  dots: [[-2, -2], [2, -2], [2, 2], [-2, 2]] };

function SI_labGeo(){
  const u = S * 0.38 / 7.5; return { u, sx: W / 2 - 0.5 * u, sy: H * 0.5 + 2.75 * u, tx: W / 2, ty: H * 0.5 + 0.75 * u };

/* THE closing image; the next movement can call this to begin on the identical figure */

/* ─────────────── build (once per size and language) ─────────────── */

/* ═══════════════ 0–10 · the stair, the candle, the dark ═══════════════ */

      g.strokeStyle = `rgba(${INK.sepia},${0.16 * min(1, l * 2.4)})`; g.lineWidth = 0.6; seg(vx - px * 4.6, vy + px * 0.85, vx + px * 4.6, vy + px * 0.85); } }

    }

/* ═══════════════ 10–28 · phosphenes and Klüver's four form constants ═══════════════ */

  for (let b = 0; b < 4; b++){ const q = B[b]; if (!q.length) continue; g.fillStyle = `rgba(206,212,228,${AL[b] * a})`; g.beginPath(); for (let i = 0; i < q.length; i += 3) g.rect(q[i], q[i + 1], q[i + 2], q[i + 2]); g.fill(); }

/* each form, engraved once. All four are images under z = exp(w) of a plain cortical pattern. */
function SI_formCanvas(kind, R){

  c.translate(sz / 2, sz / 2); c.lineCap = 'round'; c.lineJoin = 'round';
  /* construction: guide circle, axes, degree ticks */
  c.strokeStyle = `rgba(${Sp},0.4)`; c.lineWidth = 0.6; c.beginPath(); c.arc(0, 0, R * 1.05, 0, TAU); c.stroke();
  c.strokeStyle = `rgba(${Sp},0.24)`; c.beginPath(); c.moveTo(-R * 1.14, 0); c.lineTo(R * 1.14, 0); c.moveTo(0, -R * 1.14); c.lineTo(0, R * 1.14); c.stroke();
  c.strokeStyle = `rgba(${Sp},0.5)`; c.beginPath(); for (let i = 0; i < 24; i++){ const a = i * TAU / 24, l = i % 6 ? 0.022 : 0.045; c.moveTo(cos(a) * R * 1.05, sin(a) * R * 1.05); c.lineTo(cos(a) * R * (1.05 + l), sin(a) * R * (1.05 + l)); } c.stroke();

    c.strokeStyle = `rgba(${Sp},0.34)`; c.lineWidth = 0.5; c.beginPath(); for (let i = 0; i < 24; i++){ const a = i * TAU / 24; c.moveTo(cos(a) * R * r0, sin(a) * R * r0); c.lineTo(cos(a) * R, sin(a) * R); } c.stroke();
    for (let k = 0; k < 15; k++){ const rr = pow(0.8, k); if (rr < r0) break; c.strokeStyle = `rgba(${G},${0.3 + 0.62 * sqrt(rr)})`; c.lineWidth = 0.55 + 0.8 * rr; c.beginPath(); c.arc(0, 0, R * rr, 0, TAU); c.stroke(); }
  } else if (kind === 1){ /* logarithmic spirals: straight diagonal stripes on the cortex */
    c.strokeStyle = `rgba(${Sp},0.26)`; c.lineWidth = 0.5; for (const q of [0.5, 0.25, 0.125]){ c.beginPath(); c.arc(0, 0, R * q, 0, TAU); c.stroke(); }

  if (a < 0.01) return;

  g.strokeStyle = `rgba(${INK.gold},${0.16 * a})`; g.lineWidth = 0.8; seg(x - 5, y0 + 10, x - 5, y1 - 10); seg(x + 5, y0 + 10, x + 5, y1 - 10);
  for (let i = 0; i < 6; i++){
    LAD.lit[i] += (LAD.tgt[i] - LAD.lit[i]) * min(1, dt * 1.6);
    const y = lerp(y0, y1, i / 5), l = LAD.lit[i];
    g.strokeStyle = `rgba(${INK.gold},${(0.18 + 0.62 * l) * a})`; g.lineWidth = 0.8 + l; seg(x - 6, y, x + 6, y);
    if (l > 0.05){ g.globalCompositeOperation = 'lighter'; glow(x, y, 14 + 10 * l, i === 5 ? '255,250,235' : INK.gold, 0.22 * l * a); g.globalCompositeOperation = 'source-over'; }
    if (W > 1000) label(RUNGS[i], x + 14, y, 9, (0.12 + 0.4 * l) * a, { align:'left', ls:0.18, rgb:INK.sepia });
  }
  /* a travelling pulse shows which way the signal is moving */
  const u = (T * 0.35) % 1, py = LAD.dir > 0 ? lerp(y0, y1, u) : lerp(y1, y0, u);
  g.globalCompositeOperation = 'lighter'; glow(x, py, 6, INK.gold, 0.35 * a * max(...LAD.tgt)); g.restore();
}
function ladder(arr, dir = 1){ LAD.tgt = [0, 1, 2, 3, 4, 5].map(i => arr.includes(i) ? 1 : 0); LAD.dir = dir; }

/* ─────────────── the Tree of Life as progress ─────────────── */
const SEPH = [[0, 0], [9, 6], [-9, 6], [9, 18], [-9, 18], [0, 24], [9, 30], [-9, 30], [0, 36], [0, 47]];
const PATHS = [[0,1],[0,2],[0,5],[1,2],[1,3],[1,5],[2,4],[2,5],[3,4],[3,5],[3,6],[4,5],[4,7],[5,6],[5,7],[5,8],[6,7],[6,8],[6,9],[7,8],[7,9],[8,9]];
function buildTree(){
  const sv = $('tree');
  sv.innerHTML = PATHS.map(([a, b]) => `<line x1="${SEPH[a][0]}" y1="${SEPH[a][1]}" x2="${SEPH[b][0]}" y2="${SEPH[b][1]}" stroke="rgba(233,207,138,.22)" stroke-width=".6"/>`).join('') +
    SEPH.map(([x, y], i) => `<circle data-k="${i}" cx="${x}" cy="${y}" r="3.1" fill="#000" stroke="rgba(233,207,138,.5)" stroke-width=".7"><title></title></circle>`).join('');
  $$('#tree circle').forEach(c => {
    const k = +c.dataset.k;
    c.addEventListener('click', e => { e.stopPropagation(); if (started) go(k); });
    c.addEventListener('mouseenter', () => { const t = SCRIPT.titles[k]; $('treeTip').textContent = `${t.num} · ${tl(t)}`; $('treeTip').classList.add('on'); });
    c.addEventListener('mouseleave', () => $('treeTip').classList.remove('on'));
  });
}
function paintTree(){ $$('#tree circle').forEach(c => { const k = +c.dataset.k; c.setAttribute('fill', k < si ? 'rgba(233,207,138,.55)' : k === si ? '#ffe9b0' : '#000'); c.setAttribute('r', k === si ? 3.8 : 3.1); }); }

/* ─────────────── language ─────────────── */
function applyLang(){
  document.documentElement.lang = LANG;
  $$('[data-i]').forEach(el => { const v = ui(el.dataset.i); if (typeof v === 'string') el.textContent = v; });
  $('legend').innerHTML = ['m', 't', 's', 'w', 'r'].map(m => `<span class="m-${MARKS[m]}">${glyphSVG(m)}${ui(m)}</span>`).join('');
  $$('.seg [data-l]').forEach(b => b.classList.toggle('on', b.dataset.l === LANG));
  $('bLang').textContent = (SCRIPT.langs?.[LANG]?.code) || LANG.toUpperCase(); $('bLang').title = LANGS.map(l => l.toUpperCase()).join(' · ') + ' (L)';
  document.body.classList.toggle('novox', !hasVox()); $('bVoice').title = hasVox() ? '' : ui('novoice');
  $('bPlay').textContent = paused ? ui('play') : ui('pause');
  [['bBack', 'back', '←'], ['bFwd', 'fwd', '→'], ['bPrev', 'prevM', 'Shift ←'], ['bNext', 'nextM', 'Shift →']].forEach(([id, k, key]) => { const b = $(id); b.title = `${ui(k)} (${key})`; b.setAttribute('aria-label', ui(k)); });
  if (started && si >= 0){
    const t = SCRIPT.titles[si]; cardEl.querySelector('.tab').textContent = `${ui('tab')} ${t.num} · ${t.latin}`; cardEl.querySelector('.ttl').textContent = tl(t);
    if (curCue && curCue.truth === undefined && lineEl.classList.contains('on')){ lineEl.textContent = cueText(curCue); if (curCue.plate) showPlate(curCue.plate); }
    if (curCue && curCue.truth !== undefined && truthEl.classList.contains('on')){ const T = SCRIPT.truths[curCue.truth], L = T['name_' + LANG] ? LANG : 'en'; truthEl.querySelector('.tn').textContent = T['name_' + L]; truthEl.querySelector('.tt').textContent = T['title_' + L]; truthEl.querySelector('.tb').textContent = T['body_' + L]; }
  }
  if ($('atlas').classList.contains('on')) buildAtlas();
}
function setLang(l){ if (l === LANG) return; LANG = l; try { localStorage.setItem('ok-lang', l); } catch (e) {} if (!hasVox()) stopVoice(0.3); applyLang(); }

/* ─────────────── the Atlas ─────────────── */
function linkify(s){ let out = s.replace(/[&<>]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[c])); for (const [k, u] of SRC) if (out.includes(k)){ out = out.replace(k, `<a href="${u}" target="_blank" rel="noopener" style="color:var(--gold)">${k}</a>`); } return out; }
function buildAtlas(){
  const L = LANG, rows = [], ret = [];
  const item = (p, line) => { const ms = p.mark || []; const old = p.old ? `<div class="o"><s>${linkify(tl(p.old))}</s> <span class="m-retired">${ui('r')}</span></div>` : '';
    const h = `<div class="it">${ms.length ? glyphSVG(ms[0]) : '<span></span>'}<div>${old}<div class="t">${linkify(tl(p))}</div><div class="q">${line ? '“' + line + '” ' : ''}${ms.map(ui).join(' · ')}</div></div></div>`;
    if (p.old) ret.push(`<div class="it">${glyphSVG('r')}<div><div class="o"><s>${linkify(tl(p.old))}</s></div><div class="t">${linkify(tl(p))}</div></div></div>`); return h; };
  SCRIPT.titles.forEach((t, i) => {
    const key = 'M' + (i + 1); let h = '';
    if (key === 'M8') SCRIPT.truths.forEach(T => { h += item(T.plate, T['title_' + L]); });
    else (SCRIPT.lines[key] || []).forEach(c => { if (c.plate) h += item(c.plate, tl(c).slice(0, 80) + (tl(c).length > 80 ? '…' : '')); });
    if (h) rows.push(`<h3>${t.num} · ${t.latin} · ${tl(t)}</h3>${h}`);
  });
  $('atlasIn').innerHTML = `<h2>${ui('atlasTitle')}</h2><p class="note">${ui('atlasNote')}</p><div class="legend" style="margin-top:1em">${['m', 't', 's', 'w', 'r'].map(m => `<span class="m-${MARKS[m]}" title="${ui('w' + m)}">${glyphSVG(m)}${ui(m)}</span>`).join('')}</div>${rows.join('')}<h3>${ui('retired')}</h3>${ret.join('')}`;
}
function openAtlas(){ buildAtlas(); $('atlas').classList.add('on'); if (started && !paused){ setPause(true); openAtlas.paused = true; } }
function closeAtlas(){ $('atlas').classList.remove('on'); if (openAtlas.paused){ setPause(false); openAtlas.paused = false; } }

/* ─────────────── the loop ─────────────── */
let si = -1, st = 0, T = 0, paused = false, started = false, ended = false, lastTS = performance.now();
let GH = 0, GHt = 0; const POINTER = { x:0, y:0 };
function buildCues(sc, k){
  const L = SCRIPT.lines[sc.key] || [];
  sc.cues = (sc.at || []).map((t, j) => L[j] ? Object.assign({ t, id: `${sc.key}.${j}` }, L[j]) : null).filter(Boolean);
}
/* pacing: each line (or truth) owns a segment of the movement clock, from its cue to the next.
   If the segment is shorter than the line needs — the narration clip when the voice is on,
   a calm reading time when it is off — the movement clock slows for that segment, so pictures,
   score and text all keep together and nothing is cut off or rushed. */
function segList(sc){
  if (sc._seg) return sc._seg;
  let s;
  if (sc.key === 'M8'){ const ts = [3, 28, 53, 75.5]; s = SCRIPT.truths.map((T, i) => ({ t:ts[i], e:ts[i + 1], id:'T' + i, truth:T })); }
  else { const c = sc.cues || []; s = c.map((q, i) => ({ t:q.t, e:i < c.length - 1 ? c[i + 1].t : sc.dur - 2.2, id:q.id, cue:q })); }
  return sc._seg = s;
}
function segNeed(q){
  const ru = CYR(), cps = ru ? 13.5 : 15, lead = q.truth ? 0.9 : 0.7;
  const pl = q.truth ? q.truth.plate : q.cue.plate;
  const txt = q.truth ? q.truth['title_' + LANG] + ' ' + q.truth['body_' + LANG] : cueText(q.cue);
  const pn = (PLATES && pl) ? tl(pl).length + (pl.old ? tl(pl.old).length : 0) : 0;
  if (VOICE && AU.on){ const d = (VOXDUR[LANG] || {})[q.id]; if (d) return max(lead + d + 0.9, lead + 3.5); }
  if (SUBS || q.truth) return lead + max(3.5, 1 + txt.length / cps) + pn / 45;
  return pn ? lead + 2.5 + pn / 30 : 0;
}
function curSeg(sc){ let q = null; for (const x of segList(sc)) if (st >= x.t) q = x; return q && st < q.e ? q : null; }
let PACE = 1, SEGQ = null, SEGT = 0;
function nextCueTime(sc){ for (const q of segList(sc)){ if (q.t > st + 0.05) return q.t; if (q.e > st + 0.05) return q.e; } return sc.dur - 2.2; }
function go(i, soft = false){
  hush(); stopVoice(0.2); hideTruth(); hidePlate();
  si = clamp(i, 0, SC.length - 1); st = 0; ended = false;
  $('end').classList.remove('on');
  const sc = SC[si]; sc._li = -1; sc._e = 0; if (!sc.cues) buildCues(sc, si);
  lineEl.classList.remove('on'); clearTimeout(lineTO); curCue = null;
  starTarget = sc.star ?? 0.2; lineEl.classList.toggle('boom', !!sc.boom); LAD.fade = 1; LAD.off = false;
  if (sc.enter) sc.enter();
  if (!soft) showCard(si); paintTree();
  prefetch((sc.cues || []).slice(0, 2).map(c => c.id).concat(sc.key === 'M8' ? ['T0'] : []));
}
function fmt(d){ return d.toLocaleTimeString(LANG === 'ru' ? 'ru-RU' : (SCRIPT.langs?.[LANG]?.locale || []), { hour:'2-digit', minute:'2-digit' }); }
function finish(){
  ended = true; stopVoice(0.5); lineEl.classList.remove('on'); cardEl.classList.remove('on'); hidePlate();
  $('endStamp').textContent = ui('stamp')(fmt(OPENED_AT), fmt(new Date()));
  setTimeout(() => { if (ended) $('end').classList.add('on'); }, 900); starTarget = 0;
}
function gateBox(){ return W > 900 ? { x:0, y:0, w:W * 0.5, h:H } : { x:0, y:0, w:W, h:H * 0.46 }; }
function frame(ts){
  const dt = min(0.05, (ts - lastTS) / 1000); lastTS = ts;
  if (!paused) T += dt;
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1; g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  drawStars(T);
  if (!started){ g.save(); try { drawGateArt(T, dt, { hover:GH, hoverAge:T - GHt, box:gateBox() }); } catch (e) { console.error(e); } g.restore(); }
  else if (si >= 0){
    const sc = SC[si], q = curSeg(sc);
    if (q !== SEGQ){ SEGQ = q; SEGT = T; }
    const need = q ? segNeed(q) : 0, tgt = q && need > q.e - q.t ? max(0.35, (q.e - q.t) / need) : 1;
    PACE += (tgt - PACE) * min(1, dt * 2.5);
    let adv = paused ? 0 : dt * PACE;
    if (adv && !ended && st + adv >= nextCueTime(sc) - 0.02){
      if (VOICE && voiceBusy()) adv = 0;                         /* voice hold: never cut a line off */
      else if (q && T - SEGT < need - 0.05) adv = 0;            /* reading hold: a line stays until it can be read */
    }
    if (ended) adv = 0;
    st += adv;
    if (!ended && sc.cues && sc.cues.length){
      let idx = -1; for (let k = 0; k < sc.cues.length; k++) if (st >= sc.cues[k].t) idx = k;
      if (st > sc.dur - 2.2) idx = -2;
      if (idx !== sc._li){ sc._li = idx; showLine(idx >= 0 ? sc.cues[idx] : null); if (idx >= 0) prefetch([sc.cues[idx + 1]?.id, sc.cues[idx + 2]?.id, sc.cues[idx + 3]?.id]); }
    }
    if (sc.ev && !ended) while (sc._e < sc.ev.length && st >= sc.ev[sc._e][0]){ try { sc.ev[sc._e][1](); } catch (e) { console.error(e); } sc._e++; }
    g.save(); try { sc.draw(st, adv); } catch (e) { console.error(e); } g.restore();
    drawLadder(adv || dt * 0.5);
    if (!ended && st >= sc.dur){ if (si < SC.length - 1) go(si + 1); else finish(); }
  }
  requestAnimationFrame(frame);
}

/* ─────────────── stepping line by line, so any line can be read again ─────────────── */
function cueTimes(sc){ if (!sc.cues) buildCues(sc); return sc.key === 'M8' ? [3, 28, 53] : sc.cues.map(c => c.t); }
function seekTo(i, t){
  stopVoice(0.1); hush();
  const sameMove = i === si, live = AU.ctx; AU.ctx = null;           /* silent while fast-forwarding */
  try {
    go(i, sameMove); const sc = SC[si], stateful = sc.key === 'M2';
    g.save(); g.beginPath(); g.rect(0, 0, 0, 0); g.clip();             /* the replay draws nothing */
    while (st < t - 1e-6){
      const d = min(0.1, t - st); st += d;
      if (sc.ev) while (sc._e < sc.ev.length && st >= sc.ev[sc._e][0]){ try { sc.ev[sc._e][1](); } catch (err) {} sc._e++; }
      if (stateful){ try { sc.draw(st, d); } catch (err) {} }
    }
    g.restore();
  } finally { AU.ctx = live; }
  if (AU.ctx){ if (MOOD.drone) droneTo(MOOD.drone[0], MOOD.drone[1], MOOD.drone[2], 1.2); roomTo(MOOD.room, 1); if (GRAIN || MOOD.grain) grainTo(MOOD.grain, 1); }
  SC[si]._li = -99; poke();
}
function stepLine(dir){
  if (!started) return;
  if (ended){ if (dir < 0){ const ts = cueTimes(SC[SC.length - 1]); $('end').classList.remove('on'); seekTo(SC.length - 1, ts[ts.length - 1]); } return; }
  const sc = SC[si], ts = cueTimes(sc); let idx = -1; ts.forEach((t, k) => { if (st >= t) idx = k; });
  if (dir < 0){
    const target = (idx >= 0 && st - ts[idx] > 2.5) ? idx : idx - 1;
    if (target >= 0) seekTo(si, ts[target]);
    else if (si > 0){ const pt = cueTimes(SC[si - 1]); seekTo(si - 1, pt.length ? pt[pt.length - 1] : 0); }
    else seekTo(0, 0);
  } else {
    if (idx + 1 < ts.length) seekTo(si, ts[idx + 1]); else if (si < SC.length - 1) go(si + 1);
  }
}

/* ─────────────── controls ─────────────── */
const ctl = $('ctl'); let idleTO = null;
function poke(){ if (!started) return; ctl.classList.add('show'); document.body.classList.remove('idle'); clearTimeout(idleTO); idleTO = setTimeout(() => { ctl.classList.remove('show'); document.body.classList.add('idle'); }, 2800); }
['mousemove', 'touchstart', 'keydown'].forEach(e => addEventListener(e, poke, { passive:true }));
addEventListener('pointermove', e => { POINTER.x = (e.clientX / W) * 2 - 1; POINTER.y = (e.clientY / H) * 2 - 1; }, { passive:true });
function setPause(p){
  paused = p; $('bPlay').textContent = p ? ui('play') : ui('pause'); $('bPlay').setAttribute('aria-label', p ? 'Play' : 'Pause');
  if (AU.ctx){ try { p ? AU.ctx.suspend() : AU.ctx.resume(); } catch (e) {} }
}
function refreshBtns(){
  $('bSnd').classList.toggle('off', !AU.on); $('bVoice').classList.toggle('off', !VOICE); $('bSubs').classList.toggle('off', !SUBS); $('bPlates').classList.toggle('off', !PLATES);
  document.body.classList.toggle('nosubs', !SUBS); document.body.classList.toggle('noplates', !PLATES);
}
function setVoice(v){ VOICE = v; $('voiceChk').checked = v; if (!v) stopVoice(0.3); else if (started && curCue && curCue.id) prefetch([curCue.id]); refreshBtns(); }
async function wake(){ try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch (e) {} }

$('enter').onclick = () => {
  VOICE = $('voiceChk').checked; SUBS = $('subsChk').checked; PLATES = $('platesChk').checked;
  try { audioInit(); cvLoad(); } catch (e) {}
  $('gate').classList.add('gone'); started = true; ctl.classList.add('live');
  refreshBtns(); wake(); go(0); poke();
};
$('enter').addEventListener('pointerenter', () => { GH = 1; GHt = T; });
$('enter').addEventListener('pointerleave', () => { GH = 0; GHt = T; });
$('enter').addEventListener('focus', () => { GH = 1; GHt = T; });
$('enter').addEventListener('blur', () => { GH = 0; GHt = T; });
$$('.seg [data-l]').forEach(b => b.onclick = () => setLang(b.dataset.l));
const nextLang = () => LANGS[(LANGS.indexOf(LANG) + 1) % LANGS.length];
$('bLang').onclick = () => setLang(nextLang());
$('again').onclick = () => { $('end').classList.remove('on'); setPause(false); seedAll(); go(0); };
$('bPrev').onclick = () => { if (ended) return go(SC.length - 1); go(st > 4 ? si : si - 1); };
$('bNext').onclick = () => { if (!ended){ if (si < SC.length - 1) go(si + 1); else { hush(); finish(); } } };
$('bPlay').onclick = () => setPause(!paused);
$('bBack').onclick = () => stepLine(-1);
$('bFwd').onclick = () => stepLine(1);
$('bVoice').onclick = () => setVoice(!VOICE);
$('bSubs').onclick = () => { SUBS = !SUBS; refreshBtns(); };
$('bPlates').onclick = () => { PLATES = !PLATES; refreshBtns(); };
$('bSnd').onclick = () => { AU.on = !AU.on; if (AU.ctx) AU.master.gain.setTargetAtTime(AU.on ? 0.9 : 0, AU.ctx.currentTime, 0.3); if (!AU.on) stopVoice(); refreshBtns(); };
$('bFs').onclick = () => { try { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); } catch (e) {} };
$('atlasLink').onclick = openAtlas; $('atlasBtn2').onclick = openAtlas; $('atlasClose').onclick = closeAtlas;
addEventListener('keydown', e => {
  if ($('atlas').classList.contains('on')){ if (e.key === 'Escape') closeAtlas(); return; }
  if (!started) return;
  if (e.code === 'Space'){ e.preventDefault(); setPause(!paused); }
  else if (e.code === 'ArrowRight'){ e.preventDefault(); e.shiftKey ? $('bNext').click() : stepLine(1); }
  else if (e.code === 'ArrowLeft'){ e.preventDefault(); e.shiftKey ? $('bPrev').click() : stepLine(-1); }
  else if (e.code === 'PageDown') $('bNext').click();
  else if (e.code === 'PageUp') $('bPrev').click();
  else if (e.key === 'f') $('bFs').click();
  else if (e.key === 'v') setVoice(!VOICE);
  else if (e.key === 'l') setLang(nextLang());
});
try { const l = localStorage.getItem('ok-lang'); if (LANGS.includes(l)) LANG = l; else { const nl = (navigator.language || '').toLowerCase().slice(0, 2); if (LANGS.includes(nl)) LANG = nl; } } catch (e) {}
buildTree(); applyLang(); refreshBtns(); seedAll();
requestAnimationFrame(frame);

</script>
</body>
